<!doctype html>
<!-- 由 level-kit/pack.mjs 从场景和公共模块生成 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>地图关卡</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e9f4f7;
    --muted: #9db2c0;
    --cyan: #79f3e0;
    --orange: #ffad73;
    --red: #ff626d;
    --border: #9fc4da3d;
    --panel: #09131de8;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #080d17;
    color: var(--ink);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .visually-hidden {
    position: absolute; inline-size: 1px; block-size: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  #world, #hud, #injury, #blast { position: fixed; inset: 0; }
  #world { width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; container-type: size; }
  #injury { background: radial-gradient(ellipse, transparent 35%, #a62239 120%); opacity: 0; }
  #blast { background: radial-gradient(ellipse at center, #ffd5be80, #ff6ebb33 50%, transparent 85%); opacity: 0; }
  .hud-top {
    position: absolute; inset: 24px 28px auto; display: grid;
    grid-template-columns: minmax(0, 1fr) min(280px, 33vw) minmax(0, 1fr);
    grid-template-areas: "task signals map"; align-items: start; column-gap: 12px;
  }
  .top-left { grid-area: task; justify-self: start; min-inline-size: 0; max-inline-size: min(420px, 100%); }
  .top-right { grid-area: map; justify-self: end; position: relative; }
  .top-signals { grid-area: signals; display: grid; gap: 7px; margin-block-start: 2px; }
  .bottom-left, .bottom-right { position: absolute; }
  .bottom-left { bottom: 28px; left: 28px; width: min(250px, 41vw); }
  .bottom-right { bottom: 28px; right: 28px; min-width: 128px; }
  .instrument {
    background: linear-gradient(112deg, #091723f0, #09131dba);
    border: 1px solid var(--border);
    padding: 13px 15px;
    box-shadow: 0 6px 28px #02050855;
  }
  .area { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: .13em; }
  .objective { margin: 5px 0 0; font-size: 13px; line-height: 1.55; }
  .tallies { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 9px; color: var(--muted); font-size: 11px; }
  .tallies strong { color: var(--ink); margin-left: 5px; font: 600 13px var(--mono); }
  #map-offline { display: none; }
  #hud[data-offline] .top-left,
  #hud[data-offline] .bottom-left,
  #hud[data-offline] .bottom-right,
  #hud[data-offline] #boss,
  #hud[data-offline] #cross,
  #hud[data-offline] #message,
  #hud[data-offline] #map { visibility: hidden; }
  #hud[data-offline] #map-offline {
    display: grid; position: absolute; inset: 34px 12px 12px; place-items: center;
    color: #aac4da; font: 11px var(--mono); text-align: center;
    background: repeating-linear-gradient(0deg, #132238 0 2px, #101a2c 2px 4px);
    border: 1px solid #62748568;
  }
  .map-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
  #map { display: block; width: 150px; height: 150px; margin-top: 7px; }
  .meter-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: var(--muted); }
  .meter-label output { font: 600 16px var(--mono); color: var(--ink); }
  progress { width: 100%; height: 5px; display: block; border: 0; appearance: none; background: #293a48; margin: 6px 0 11px; }
  progress:last-child { margin-bottom: 0; }
  progress::-webkit-progress-bar { background: #293a48; }
  progress::-webkit-progress-value { background: var(--fill, var(--cyan)); }
  progress::-moz-progress-bar { background: var(--fill, var(--cyan)); }
  #health { --fill: #71e1a4; }
  #stamina { --fill: #77bfe5; }
  .ammo-label { color: var(--muted); font-size: 11px; }
  .ammo-line { display: flex; align-items: baseline; gap: 9px; margin: 3px 0; font-family: var(--mono); }
  #ammo { font-size: clamp(25px, 4vw, 44px); font-weight: 650; line-height: 1; }
  #reserve { font-size: 14px; color: var(--muted); }
  #weapon-state { min-height: 16px; color: var(--orange); font-size: 11px; }
  #boss, #condition { padding: 8px 10px; background: var(--panel); border: 1px solid #ff64675c; }
  #condition { border-color: #ffad736b; }
  #condition-title { color: var(--orange); font-size: 12px; }
  #condition-time { font: 600 12px var(--mono); color: var(--ink); white-space: nowrap; }
  #condition-meter {
    display: block; appearance: none; width: 100%; height: 5px;
    margin: 6px 0 0; border: 0; background: #293a48;
  }
  #condition-meter::-webkit-meter-bar { border: 0; border-radius: 0; background: #293a48; }
  #condition-meter::-webkit-meter-optimum-value { background: #77bfe5; }
  #condition-meter::-webkit-meter-suboptimum-value { background: var(--orange); }
  #condition-meter::-webkit-meter-even-less-good-value { background: var(--red); }
  #condition-meter::-moz-meter-bar { background: #77bfe5; }
  #condition-meter:-moz-meter-sub-optimum::-moz-meter-bar { background: var(--orange); }
  #condition-meter:-moz-meter-sub-sub-optimum::-moz-meter-bar { background: var(--red); }
  #condition p { margin: 4px 0 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
  #posture { color: var(--cyan); font-size: 10px; margin-inline-start: auto; white-space: nowrap; }
  #boss progress { --fill: var(--red); margin-bottom: 0; }
  #boss strong { color: #ffafb7; font-size: 12px; font-weight: 650; }
  #cross { --gap: 7px; display: block; position: absolute; top: 50%; left: 50%; width: 0; height: 0; color: #edfffc; filter: drop-shadow(0 0 2px #02070a); }
  #cross i { position: absolute; display: block; border-radius: 1px; background: currentColor; }
  #cross i:nth-child(1) { width: 5px; height: 1px; right: var(--gap); top: 0; }
  #cross i:nth-child(2) { width: 5px; height: 1px; left: var(--gap); top: 0; }
  #cross i:nth-child(3) { width: 1px; height: 5px; bottom: var(--gap); left: 0; }
  #cross i:nth-child(4) { width: 1px; height: 5px; top: var(--gap); left: 0; }
  #cross i:nth-child(5) { width: 3px; height: 3px; left: -1px; top: -1px; border-radius: 50%; }
  #cross[data-hit="hit"] { color: var(--orange); }
  #cross[data-hit="kill"] { color: var(--red); transform: scale(1.55) rotate(45deg); }
  #message { position: absolute; top: calc(50% + 37px); left: 50%; transform: translateX(-50%); max-width: 80%; width: max-content; padding: 7px 12px; background: #07111be8; border: 1px solid var(--border); color: var(--ink); font-size: 12px; text-align: center; }
  #menu {
    position: fixed; inset: 0; margin: 0; width: 100%; height: 100%;
    max-width: none; max-height: none; border: 0; padding: 0;
    overflow: auto; background: transparent; color: var(--ink);
  }
  #menu:modal { overscroll-behavior: contain; }
  #menu::backdrop { background: #04091228; overflow: hidden; overscroll-behavior: contain; }
  .screen {
    min-height: 100%; display: grid; align-content: center; justify-items: start;
    padding: clamp(22px, 7vw, 104px);
    background: linear-gradient(90deg, #060d18f2 0%, #07111de8 27%, #091521b8 42%, #09152118 76%), linear-gradient(0deg, #060c16ab, transparent 44%);
  }
  .brief { width: min(100%, 475px); }
  .brief-tag { display: flex; align-items: center; gap: 11px; color: var(--cyan); font-size: 12px; letter-spacing: .18em; font-weight: 700; }
  .brief-tag::before { content: ""; width: 24px; height: 2px; background: currentColor; }
  h1 { margin: 16px 0 9px; font-weight: 780; font-size: clamp(40px, 6.25vw, 90px); line-height: 1.06; letter-spacing: -.05em; }
  #menu-text { margin: 0; max-width: 36ch; color: #bdced9; font-size: clamp(14px, 1.65vw, 17px); line-height: 1.8; }
  .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 25px 0 24px; padding: 14px 0; border-block: 1px solid var(--border); }
  .controls div { display: flex; gap: 5px 10px; align-items: center; flex-wrap: wrap; }
  .controls dt { color: #d7ebf0; font: 650 12px var(--mono); white-space: nowrap; }
  .controls dd { margin: 0; color: var(--muted); font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button, .action-link {
    min-height: 46px; border: 1px solid var(--border); border-radius: 0;
    padding: 10px 18px; font: 650 14px system-ui, sans-serif;
    background: #0c1b28e8; color: var(--ink); cursor: pointer;
  }
  .action-link { display: inline-flex; align-items: center; text-decoration: none; }
  button:hover, .action-link:hover { background: #163343; }
  button:focus-visible, .action-link:focus-visible { outline: 2px solid #effcfe; outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: wait; }
  #start { min-width: 148px; background: var(--cyan); border-color: var(--cyan); color: #07191e; }
  #start:hover:enabled { background: #b2fff3; }
  #next-level { color: var(--cyan); border-color: var(--cyan); }
  #menu-status { margin: 11px 0 0; min-height: 18px; color: var(--orange); font-size: 12px; }
  #summary { margin: 22px 0; padding: 12px 15px; border: 1px solid var(--border); background: #0a1826d9; font-size: 13px; line-height: 1.8; }
  @media (max-width: 790px) {
    .hud-top {
      inset: 13px 13px auto; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "task map" "signals signals"; gap: 8px;
    }
    .top-signals { inline-size: min(280px, 74vw); justify-self: center; margin-block-start: 0; }
    .bottom-left { bottom: 13px; left: 13px; } .bottom-right { bottom: 13px; right: 13px; }
    #map { width: 105px; height: 105px; }
    .instrument { padding: 9px 10px; }
  }
  @media (max-width: 790px) and (max-height: 575px) {
    .top-signals { display: flex; inline-size: min(100%, 460px); gap: 7px; align-items: start; justify-content: center; }
    .top-signals > section { flex: 0 1 226px; min-inline-size: 0; }
  }
  @media (max-width: 790px) and (max-height: 520px) {
    #map { width: 76px; height: 76px; }
  }
  @media (max-height: 575px) {
    .screen { padding-block: 17px; }
    h1 { margin-top: 8px; font-size: clamp(32px, 8vh, 54px); }
    .controls { margin-block: 13px; padding-block: 9px; }
    #map { max-width: 96px; max-height: 96px; }
  }
</style>

<script type="text/plain" data-level-module="@level-kit/audio.mjs">
export function createSoundClass({ CONFIG, seededRandom }) {
  class Sound {
    constructor() { this.enabled = true; }
    open() {
      if (!this.ctx) {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        this.ctx = new Audio();
        this.main = this.ctx.createGain();
        this.main.gain.value = this.enabled ? 0.52 : 0;
        this.main.connect(this.ctx.destination);
        this.noise = this.ctx.createBuffer(1, this.ctx.sampleRate * 3, this.ctx.sampleRate);
        const samples = this.noise.getChannelData(0);
        const rng = seededRandom(71);
        for (let i = 0; i < samples.length; i++) samples[i] = rng() * 2 - 1;
        const ambient = CONFIG.audio.ambient;
        if (ambient) {
          const noise = this.ctx.createBufferSource(), filter = this.ctx.createBiquadFilter();
          this.ambientVolume = this.ctx.createGain();
          noise.buffer = this.noise; noise.loop = true;
          filter.type = ambient.filter ?? 'bandpass';
          filter.frequency.value = ambient.frequency ?? 1700;
          filter.Q.value = ambient.q ?? 0.52;
          this.ambientVolume.gain.value = ambient.activeGain ?? 0.24;
          noise.connect(filter).connect(this.ambientVolume).connect(this.main);
          noise.start();
        }
      }
      this.ctx.resume().catch(() => {});
    }
    toggle() {
      this.enabled = !this.enabled;
      if (this.ctx) this.main.gain.setTargetAtTime(this.enabled ? 0.52 : 0, this.ctx.currentTime, 0.055);
    }
    active(active) {
      if (!this.ambientVolume) return;
      const ambient = CONFIG.audio.ambient;
      this.ambientVolume.gain.setTargetAtTime(active ? ambient.activeGain ?? 0.24 : ambient.pauseGain ?? 0.14, this.ctx.currentTime, 0.18);
    }
    tone(from, to, seconds, volume, type = 'sine', delay = 0) {
      if (!this.ctx || !this.enabled) return;
      const at = this.ctx.currentTime + delay, end = at + seconds;
      const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, at); osc.frequency.exponentialRampToValueAtTime(to, end);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(volume, at + Math.min(0.012, seconds / 3));
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain).connect(this.main); osc.start(at); osc.stop(end);
    }
    hiss(seconds, from, to, volume, delay = 0) {
      if (!this.ctx || !this.enabled) return;
      const at = this.ctx.currentTime + delay, end = at + seconds;
      const source = this.ctx.createBufferSource(), filter = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
      source.buffer = this.noise; source.loop = true;
      filter.type = 'lowpass'; filter.frequency.setValueAtTime(from, at); filter.frequency.exponentialRampToValueAtTime(to, end);
      gain.gain.setValueAtTime(0.0001, at); gain.gain.exponentialRampToValueAtTime(volume, at + Math.min(seconds * 0.3, 0.013));
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      source.connect(filter).connect(gain).connect(this.main); source.start(at, Math.random() * 2); source.stop(end);
    }
    shoot() { this.hiss(0.097, 3700, 270, 0.58); this.tone(112, 39, 0.10, 0.36, 'triangle'); }
    hit(killed) {
      this.tone(killed ? 615 : 990, killed ? 1010 : 570, killed ? 0.20 : 0.063, 0.19, 'triangle');
      if (killed) this.tone(410, 675, 0.23, 0.14, 'sine', 0.07);
    }
    reload(finished = false) {
      this.hiss(0.096, 2200, 690, 0.18);
      this.tone(finished ? 440 : 195, 106, 0.11, 0.16, 'triangle', 0.025);
    }
    pickup(rare) { this.tone(rare ? 720 : 445, rare ? 1180 : 665, 0.19, 0.18, 'triangle'); }
    blast() { this.hiss(2.1, 4600, 63, 0.76); this.tone(122, 24, 1.28, 0.60, 'triangle'); }
  }

  return Sound;
}
</script>
<script type="text/plain" data-level-module="@level-kit/beasts.mjs">
import { SpatialHash } from '@level-kit/world.mjs';
import { resetTargetEffects } from '@level-kit/weapon-perks.mjs';

export function createBeastClasses({ CONFIG, THREE, V3, TAU, stamp, shapes, camera, workColor, brighter, clamp, lerp, randomRange, dynamicMesh, updateMesh, setInstance, mergeGeometries, colors, definition, TEXT }) {
  const { projectileTint, ichor, spark, coreTint } = colors;

  function beastModel(type) {
    const body = [], emit = [];
    const palette = definition.beastPalettes?.[type] ?? [
      [0x4d5966, 0x738793, 0xa34b61, 0xf98782],
      [0x354459, 0x8b96a1, 0x886958, 0xffad68],
      [0x3c6065, 0x6a8781, 0x779859, 0xbbff65],
      [0x494258, 0x7d788c, 0xaa526d, 0xff658e],
    ][type];
    function piece(which, shape, tint, x, y, z, w, h, d, pitch = 0, roll = 0) {
      const geo = shape.index ? shape.toNonIndexed() : shape.clone();
      stamp.position.set(x, y, z); stamp.scale.set(w, h, d); stamp.rotation.set(pitch, 0, roll); stamp.updateMatrix();
      geo.applyMatrix4(stamp.matrix);
      const rgb = new THREE.Color(tint), array = new Float32Array(geo.attributes.position.count * 3);
      for (let i = 0; i < array.length; i += 3) { array[i] = rgb.r; array[i + 1] = rgb.g; array[i + 2] = rgb.b; }
      geo.setAttribute('color', new THREE.BufferAttribute(array, 3));
      which.push(geo);
    }
    const unit = new THREE.IcosahedronGeometry(1, 0), tooth = new THREE.ConeGeometry(0.5, 1, 4);
    const rock = (t, ...v) => piece(body, unit, palette[t], ...v);
    const block = (t, ...v) => piece(body, shapes.box, palette[t], ...v);
    const spike = (t, ...v) => piece(body, tooth, palette[t], ...v);
    const glow = (...v) => piece(emit, unit, palette[3], ...v);
    // 模型均面朝正 z，共用几何体与单一实例矩阵。各类按轮廓和发光色区分。
    if (type === 0) {
      rock(0, 0, 0.56, -0.10, 0.33, 0.25, 0.51);
      rock(1, 0, 0.68, 0.25, 0.34, 0.28, 0.28);
      rock(0, 0, 0.72, 0.56, 0.25, 0.25, 0.28);
      block(2, 0, 0.61, 0.72, 0.28, 0.12, 0.26, -0.15);
      spike(1, 0, 0.62, -0.65, 0.18, 0.48, 0.15, -1.0);
      for (const sign of [-1, 1]) {
        block(0, sign * 0.22, 0.25, -0.34, 0.145, 0.43, 0.16, -0.32);
        block(1, sign * 0.22, 0.27, 0.23, 0.13, 0.45, 0.17, 0.19);
        spike(2, sign * 0.16, 0.96, 0.43, 0.16, 0.25, 0.15, -0.35, sign * 0.22);
        glow(sign * 0.158, 0.766, 0.698, 0.05, 0.034, 0.032);
      }
    } else if (type === 1) {

  class BeastAI {
    constructor(level, nav, beasts) {
      this.level = level; this.nav = nav; this.beasts = beasts;
      this.from = new V3(); this.dir = new V3(); this.near = [];
    }

    patrol(b) {
      if (b.patrol <= 0 || b.stuck > 0.5) {
        const a = randomRange(0, TAU);
        b.fx = Math.sin(a); b.fz = Math.cos(a); b.patrol = randomRange(0.8, 2.6);
      }
      b.dx = b.fx * 0.23; b.dz = b.fz * 0.23;
      if (b.type === 3 && Math.hypot(b.x - this.level.bossAnchor.x, b.z - this.level.bossAnchor.z) > 6) {
        const angle = Math.atan2(this.level.bossSpawn.x - b.x, this.level.bossSpawn.z - b.z);
        b.dx = Math.sin(angle) * 0.24; b.dz = Math.cos(angle) * 0.24;
      }
    }

    listen(b, p, game) {
      const rules = game.encounter, step = game.footstep;
      const heardShot = game.time - game.shotAt < 0.35 &&
        Math.hypot(b.x - game.shotX, (b.y - game.shotY) * 2, b.z - game.shotZ) < rules.shotHearing * game.shotHearingScale;
      const heardStep = game.time - step.at < 0.28 &&
        Math.hypot(b.x - step.x, (b.y - step.y) * 2, b.z - step.z) < step.radius;
      if (heardShot || heardStep) {
        const shot = heardShot && (!heardStep || game.shotAt >= step.at);
        const at = shot ? game.shotAt : step.at;
        if (at > b.heardAt) {
          b.heardAt = at;
          b.heardX = shot ? game.shotX : step.x;
          b.heardY = shot ? game.shotY : step.y;
          b.heardZ = shot ? game.shotZ : step.z;
          b.alert = rules.memory;
        }
      }

      // 沙暴中只沿最后一次听到的位置搜索。贴身碰撞仍可能暴露玩家。
      const type = CONFIG.beasts.types[b.type];
      const contact = b.type !== 2 && Math.hypot(p.x - b.x, p.z - b.z) < Math.min(type.reach, 1.40) &&
        Math.abs(p.y - b.y) < 0.76;
      if (!contact && b.alert <= 0) { this.patrol(b); return; }
      const x = contact ? p.x : b.heardX, y = contact ? p.y : b.heardY, z = contact ? p.z : b.heardZ;
      const dx = x - b.x, dz = z - b.z, distance = Math.max(0.01, Math.hypot(dx, dz));
      this.from.set(b.x, b.y + type.height * 0.65, b.z);
      const rayLength = this.dir.set(dx, y + 0.72 - this.from.y, dz).length();
      const clear = this.level.visible(this.from, this.dir.divideScalar(Math.max(0.01, rayLength)), rayLength);
      if (clear && b.cooldown <= 0 && b.mode === 'move' && !p.protected(game)) {
        const charge = b.type === 1 && distance > 2.2 && distance < 12 && Math.abs(y - b.y) < 1.1;
        const shot = b.type === 2 && distance > 3.4 && distance < type.reach;
        if (contact || (game.time - b.heardAt < 0.37 && (charge || shot))) {
          b.mode = 'windup'; b.phaseTime = shot ? 0.45 : type.windup ?? 0.24;
          b.fx = dx / distance; b.fz = dz / distance;
          b.aim.x = x; b.aim.y = y; b.aim.z = z;
          return;
        }
      }
      if (!contact && distance < 0.65) {
        b.alert = 0; this.patrol(b); return;
      }
      const point = this.nav.target;
      if (!clear && point >= 0 && Math.hypot(this.nav.x(point) - x, this.nav.z(point) - z) < this.nav.cell * 2) {
        const next = this.nav.next(b.x, b.z);
        if (next !== this.nav.index(b.x, b.z)) {
          const nx = this.nav.x(next) - b.x, nz = this.nav.z(next) - b.z;
          const n = Math.max(0.05, Math.hypot(nx, nz));
          b.dx = nx / n; b.dz = nz / n;
          return;
        }
      }
      const flank = b.type === 0 && distance > 3.5 ? b.lane * Math.min(0.52, distance * 0.035) : 0;
      b.dx = (dx - dz * flank) / distance; b.dz = (dz + dx * flank) / distance;
    }

    perceive(b, p, game) {
      if (game.encounter?.hearingOnly) { this.listen(b, p, game); return; }
      const type = CONFIG.beasts.types[b.type];
      const settings = CONFIG.beasts;
      const dx = p.x - b.x, dz = p.z - b.z;
      const distance = Math.max(0.01, Math.hypot(dx, dz));
      const towardX = dx / distance, towardZ = dz / distance;
      this.from.set(b.x, b.y + type.height * 0.65, b.z);
      const lineDistance = this.dir.set(dx, p.y + 1.1 - this.from.y, dz).length();
      this.dir.divideScalar(Math.max(0.01, lineDistance));
      const inSight = distance < settings.sight && (b.alert > 0 || distance < 4.5 || towardX * b.fx + towardZ * b.fz > settings.sightDot);
      const sees = inSight && this.level.visible(this.from, this.dir, lineDistance);
      const hearing = game.time - game.shotAt < 0.35 &&
        Math.hypot(b.x - game.shotX, b.z - game.shotZ) < CONFIG.weapon.hearingRadius * game.shotHearingScale;
      if (sees || hearing) b.alert = settings.memory;
      if (b.alert <= 0) { this.patrol(b); return; }

      b.playerVisible = sees;
      const yDiff = Math.abs(p.y - b.y);
      if (sees && b.cooldown <= 0 && b.mode === 'move' && !p.protected(game)) {
        if (b.type === 2 && distance < type.reach && distance > 3.4) {
          b.mode = 'windup'; b.phaseTime = 0.45; b.fx = towardX; b.fz = towardZ; return;
        }
        if (b.type === 1 && distance > 2.2 && distance < 12 && yDiff < 1.1) {
          b.mode = 'windup'; b.phaseTime = type.windup; b.fx = towardX; b.fz = towardZ; return;
        }
        if (b.type !== 2 && distance < type.reach + 0.16 && yDiff < (b.type === 3 ? 1.6 : 0.95)) {
          b.mode = 'windup'; b.phaseTime = type.windup ?? 0.24; b.fx = towardX; b.fz = towardZ; return;
        }
      }

      let aimX = towardX, aimZ = towardZ, stride = 1;
      const waypoint = definition.chaseWaypoint?.(b, p, this.level);
      if (waypoint) {
        aimX = waypoint.x - b.x; aimZ = waypoint.z - b.z;
      } else if (!sees || b.stuck > 0.24) {
        const next = this.nav.next(b.x, b.z);
        if (next !== this.nav.index(b.x, b.z)) {
          aimX = this.nav.x(next) - b.x; aimZ = this.nav.z(next) - b.z;
        }
      } else if (b.type === 2 && distance < 8.5) {
        aimX = -towardX - towardZ * b.lane * 0.48;
        aimZ = -towardZ + towardX * b.lane * 0.48;
        stride = 0.75;
      } else if (b.type === 2 && distance < 14.4) {
        aimX = -towardZ * b.lane; aimZ = towardX * b.lane; stride = 0.47;
      } else if (b.type === 0 && distance > 3.5 && distance < 20) {
        // 两侧领跑的犬群绕向玩家的侧翼。
        const flank = b.lane * Math.min(0.72, (distance - 3.5) * 0.09);
        aimX -= towardZ * flank; aimZ += towardX * flank;
      }
      const length = Math.max(0.05, Math.hypot(aimX, aimZ));
      b.dx = aimX / length * stride; b.dz = aimZ / length * stride;
    }

    update(b, p, game, dt, frame) {
      const type = CONFIG.beasts.types[b.type];
      const damage = type.damage * (game.encounter?.beastDamageScale ?? 1);
      b.flash = Math.max(0, b.flash - dt);
      b.stun = Math.max(0, b.stun - dt);
      b.cooldown = Math.max(0, b.cooldown - dt);
      b.patrol -= dt; b.alert -= dt; b.phaseTime -= dt;
      const distance = Math.hypot(p.x - b.x, p.z - b.z);
      const hearingOnly = Boolean(game.encounter?.hearingOnly);
      const justChanged = hearingOnly !== b.hearingOnly;
      if (justChanged) {
        b.hearingOnly = hearingOnly; b.heardAt = -Infinity; b.alert = 0;
        if (b.mode === 'windup') b.mode = 'move';
      }
      if (b.type === 3 && !b.rage && b.hp <= type.hp * 0.5) {
        b.rage = true; b.summon = type.summonCount;
        if (!hearingOnly) b.alert = CONFIG.beasts.memory + 6;
        this.from.set(b.x, b.y + 2, b.z);
        game.effects.spray(this.from, coreTint, 47, 7.5, 0.14, 'mist');
        game.sound.tone(77, 31, 0.54, 0.50, 'sawtooth');
        definition.onBossRage?.(b, game, { THREE, brighter });
        game.ui.notify(TEXT.rage, 2.1);
      }

      if (Math.abs(b.perkPushX) + Math.abs(b.perkPushZ) > .05) {
        this.level.move(b, b.perkPushX * dt, b.perkPushZ * dt, .47);
        const decay = Math.exp(-7 * dt);
        b.perkPushX *= decay; b.perkPushZ *= decay;
      }
      if (b.perkMoveScale === 0) {
        const hover = b.statusEffects.get('hover');
        if (hover) {
          hover.baseY ??= b.y;
          const y = hover.baseY + .75 * Math.sin(Math.PI * Math.min(1, hover.until - game.time));
          if (!this.level.blocked(b.x, b.z, y, b.radius, b.height)) b.y = y;
        }
        b.stride = 0;
        return;
      }
      if (game.encounter?.stepScriptedBeast?.(b, game, dt)) return;
      const confusion = b.statusEffects.get('confused');
      let x = 0, z = 0;
      if (b.stun > 0) {
        x = b.knockX; z = b.knockZ;
        b.knockX *= Math.exp(-12 * dt); b.knockZ *= Math.exp(-12 * dt);
      } else if (b.mode === 'charge') {
        x = b.fx * type.chargeSpeed; z = b.fz * type.chargeSpeed;
        if (b.phaseTime <= 0) { b.mode = 'move'; b.cooldown = type.recovery; }
        if (distance < type.reach && Math.abs(p.y - b.y) < 1.32 && !b.chargeHit) {
          this.from.set(b.x, b.y + 0.8, b.z);
          const gap = this.dir.set(p.x - b.x, p.y + 0.7 - this.from.y, p.z - b.z).length();
          if ((!confusion || b.fx * (p.x - b.x) + b.fz * (p.z - b.z) > distance * .85) &&
              this.level.visible(this.from, this.dir.divideScalar(Math.max(0.001, gap)), gap)) {
            p.hurt(damage, game); b.chargeHit = true;
          }
        }
      } else if (b.mode === 'windup') {
        if (b.phaseTime <= 0) {
          if (b.type === 1 && (!hearingOnly ? distance > 1.9 : Math.hypot(b.aim.x - b.x, b.aim.z - b.z) > 1.9)) {
            b.mode = 'charge'; b.phaseTime = type.chargeTime; b.chargeHit = false;
            if (confusion) {
              const angle = Math.atan2(b.fx, b.fz) + confusion.angle;
              b.fx = Math.sin(angle); b.fz = Math.cos(angle);
            }
            x = b.fx * type.chargeSpeed; z = b.fz * type.chargeSpeed;
          } else {
            if (b.type === 2) {
              if (!p.protected(game)) {
                const aim = hearingOnly ? b.aim : p;
                if (confusion) {
                  const angle = Math.atan2(aim.x - b.x, aim.z - b.z) + confusion.angle;
                  this.from.set(b.x + Math.sin(angle) * distance, aim.y, b.z + Math.cos(angle) * distance);
                }
                game.projectiles.launch(b, confusion ? this.from : aim);
                if (distance < 17) game.sound.hiss(0.25, 2100, 490, 0.14);
              }
            } else if ((!confusion || Math.cos(confusion.angle) > .85) && distance < type.reach + 0.2 && Math.abs(p.y - b.y) < (b.type === 3 ? 1.65 : 1.02)) {
              this.from.set(b.x, b.y + b.height * 0.55, b.z);
              const length = this.dir.set(p.x - b.x, p.y + 0.8 - this.from.y, p.z - b.z).length();
              if (this.level.visible(this.from, this.dir.divideScalar(Math.max(0.001, length)), length)) p.hurt(b.rage ? damage * 1.24 : damage, game);
            }
            b.mode = 'move'; b.cooldown = type.recovery * (b.rage ? 0.68 : 1);
          }
        }
      } else {
        const period = distance > CONFIG.beasts.farDistance ? CONFIG.beasts.farUpdateFrames : 3;
        if (justChanged || (frame + b.id) % period === 0) this.perceive(b, p, game);
        if (b.mode === 'move') {
          const range = b.radius + 1.10;
          const nearby = this.beasts.hash.query(b.x - range, b.z - range, b.x + range, b.z + range, this.near);
          let separateX = 0, separateZ = 0;
          for (const other of nearby) {
            if (other === b || Math.abs(other.y - b.y) > 1.3) continue;
            const dx = b.x - other.x, dz = b.z - other.z;
            const limit = b.radius + other.radius + 0.18;
            const separation = dx * dx + dz * dz;
            if (separation > limit * limit) continue;
            if (separation < 0.0001) { separateX += b.lane * 0.37; continue; }
            const d = Math.sqrt(separation), strength = (limit - d) / limit / d;
            separateX += dx * strength; separateZ += dz * strength;
          }
          const speed = b.rage ? type.rageSpeed : type.speed;
          x = (b.dx + separateX * CONFIG.beasts.separation) * speed;
          z = (b.dz + separateZ * CONFIG.beasts.separation) * speed;
          const magnitude = Math.hypot(x, z);
          if (magnitude > speed) { x *= speed / magnitude; z *= speed / magnitude; }
          if (magnitude > 0.24) {
            b.fx = lerp(b.fx, x / Math.min(magnitude, speed), Math.min(1, 10 * dt));
            b.fz = lerp(b.fz, z / Math.min(magnitude, speed), Math.min(1, 10 * dt));
          }
        }
      }
      if (p.protected(game) && this.level.inSafeZone(b.x + x * dt, b.z + z * dt, 2.6) &&
          !this.level.inSafeZone(b.x, b.z, 2.6)) {
        x = 0; z = 0;
      }
      const terrain = this.level.movementScale(b.x, b.z, b.y, game) * (game.encounter?.beastSpeedScale ?? 1);
      x *= terrain * b.perkMoveScale; z *= terrain * b.perkMoveScale;
      const moved = this.level.move(b, x * dt, z * dt, 0.47);
      const floor = this.level.foot(b.x, b.z, b.y + 0.27, b.radius);
      if (b.statusEffects.has('grounded')) {
        b.y = Math.max(floor, b.y - dt * 9); b.surfaceRoll *= Math.exp(-10 * dt);
      } else if (definition.beastSurface) definition.beastSurface(b, p, this.level, floor, dt, game);
      else b.y = Math.max(floor, b.y - dt * 8);
      b.stride = Math.hypot(x, z);
      if (b.stride > 0.9 && moved < dt * b.stride * 0.22) {
        b.stuck += dt;
        if (b.mode === 'charge') { b.mode = 'move'; b.stun = 0.95; b.cooldown = 2.0; b.flash = 0.16; }
      } else {
        b.stuck = Math.max(0, b.stuck - dt * 2);
      }
    }
  }

  class BeastManager {
    constructor(level, nav) {
      this.level = level; this.nav = nav;
      this.hash = new SpatialHash(CONFIG.map.hash);
      this.pool = Array.from({ length: CONFIG.beasts.capacity }, (_, id) => ({ id, active: false, mark: 0, aim: new V3() }));
      this.air = new V3(); this.line = new V3();
      const modelContext = { THREE, shapes, mergeGeometries, CONFIG };
      const createBatch = ([body, eye], capacity) => {
        const material = new THREE.MeshLambertMaterial({ vertexColors: true });
        // 把受击强度作为实例属性，保留原本的顶点色和各部位区分。
        const flash = new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1).setUsage(THREE.DynamicDrawUsage);
        body.setAttribute('beastFlash', flash);
        material.onBeforeCompile = shader => {
          shader.vertexShader = 'attribute float beastFlash; varying float vBeastFlash;\n' + shader.vertexShader
            .replace('#include <begin_vertex>', '#include <begin_vertex>\n vBeastFlash = beastFlash;');
          shader.fragmentShader = 'varying float vBeastFlash;\n' + shader.fragmentShader
            .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += vec3(1.25) * vBeastFlash;');
        };
        const eyes = new THREE.MeshBasicMaterial({ vertexColors: true });
        return [dynamicMesh(body, material, capacity), dynamicMesh(eye, eyes, capacity)];
      };
      this.modelBatches = CONFIG.beasts.types.map((_, type) =>
        createBatch(definition.buildBeastModel?.(type, modelContext) ?? beastModel(type), type === 3 ? 1 : CONFIG.beasts.capacity));
      if (definition.buildRageModel) this.modelBatches.push(createBatch(definition.buildRageModel(modelContext), 1));
      this.healthBG = dynamicMesh(shapes.plane, new THREE.MeshBasicMaterial({ color: 0x101523, side: THREE.DoubleSide }), this.pool.length);
      this.healthFG = dynamicMesh(shapes.plane, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), this.pool.length);
      this.ai = new BeastAI(level, nav, this);
      this.counts = new Uint16Array(this.modelBatches.length);
    }
    bodyBounds(b) {
      b.x0 = b.x - b.radius * 1.16; b.x1 = b.x + b.radius * 1.16;
      b.z0 = b.z - b.radius * (b.type === 0 ? 1.75 : 1.13);
      b.z1 = b.z + b.radius * (b.type === 0 ? 1.75 : 1.13);
      b.y0 = b.y + 0.025; b.y1 = b.y + b.height;
    }
    reset(player) {
      this.live = 0; this.boss = null; this.frame = 0; this.spawnTime = 0; this.navTime = 0;
      for (const b of this.pool) b.active = false;
      this.nav.rebuild(player.x, player.z); this.hash.clear();
      const spawn = this.level.bossSpawn;
      this.spawn(3, spawn.x, spawn.z, spawn.y, 1);
      for (let i = 1; i < Math.min(CONFIG.beasts.population, this.pool.length); i++) {
        const site = this.spawnSite(player, true, null);
        if (site !== -1) this.spawn(this.randomType(), this.nav.x(site), this.nav.z(site));
      }
      this.refreshHash(); this.render();
    }
    randomType() {
      const r = Math.random();
      return r < 0.66 ? 0 : r < 0.86 ? 1 : 2;
    }
    spawn(type, x, z, y = this.level.base(x, z), angle = randomRange(0, TAU)) {
      const b = this.pool.find(item => !item.active);
      if (!b) return null;
      const stats = CONFIG.beasts.types[type];
      Object.assign(b, {
        active: true, x, y, z, type, hp: stats.hp, radius: stats.radius, height: stats.height,
        fx: Math.sin(angle), fz: Math.cos(angle), dx: Math.sin(angle) * 0.11, dz: Math.cos(angle) * 0.11,
        lane: Math.random() > 0.5 ? 1 : -1, yaw: angle, blink: randomRange(0, TAU), stride: 0, alert: 0,
        mode: 'move', phaseTime: 0, cooldown: randomRange(0.5, 1.3), stun: 0, flash: 0, patrol: randomRange(0.5, 2),
        knockX: 0, knockZ: 0, stuck: 0, rage: false, summon: 0, playerVisible: false,
        surfaceRoll: 0, clinging: false, surfaceSide: 1,
        hearingOnly: false, heardAt: -Infinity, heardX: x, heardY: y, heardZ: z, reinforcement: false,
      });
      resetTargetEffects(b);
      this.bodyBounds(b);
      this.live++;
      if (type === 3) this.boss = b;
      return b;
    }
    refreshHash() {
      this.hash.clear();
      for (const b of this.pool) {
        if (!b.active) continue;
        this.bodyBounds(b);
        this.hash.insert(b);
      }
    }
    visibleToPlayer(x, y, z, viewDirection) {
      const dx = x - camera.position.x, dz = z - camera.position.z;
      const d = Math.hypot(dx, dz);
      if (d > 0.001 && (viewDirection.x * dx + viewDirection.z * dz) / d <= 0.30) return false;
      const length = this.line.set(dx, y + 0.80 - camera.position.y, dz).length();
      return this.level.visible(camera.position, this.line.divideScalar(Math.max(length, 0.01)), length);
    }
    spawnSite(player, initial, viewDirection) {
      const sites = this.level.sites, cursor = Math.floor(Math.random() * sites.length);
      for (let k = 0; k < sites.length; k++) {
        const i = sites[(cursor + k) % sites.length];
        if (this.nav.dist[i] < 0) continue;
        const x = this.nav.x(i), z = this.nav.z(i);
        const dx = x - player.x, dz = z - player.z, d = Math.hypot(dx, dz);
        if (d < CONFIG.beasts.spawnDistance || (initial && d > 76) || this.level.inSafeZone(x, z, 3)) continue;
        if (!initial && this.level.blocked(x, z, this.level.base(x, z), 0.61, 2.1)) continue;
        let occupied = false;
        for (const b of this.pool) {
          if (b.active && (b.x - x) ** 2 + (b.z - z) ** 2 < (initial ? 1.65 : 2.3) ** 2) { occupied = true; break; }
        }
        if (occupied) continue;
        if (viewDirection && this.visibleToPlayer(x, this.level.base(x, z), z, viewDirection)) continue;
        return i;
      }
      return -1;
    }
    retire(b, game) {
      if (!b.active) return false;
      b.active = false;
      this.live--;
      game.kills++;
      return true;
    }
    eject(b, game) {
      return b.type !== 3 && this.retire(b, game);
    }
    dropHeight(b) { return definition.beastDropHeight?.(b, this.level) ?? b.y; }
    takeHit(b, damage, at, dir, game, hit = null, source = hit?.electric ? 'electric' : hit ? 'weapon' : 'environment') {
      if (!b.active) return false;
      const type = b.type;
      b.flash = 0.115; b.stun = type === 3 ? 0.065 : 0.115;
      b.knockX = dir.x * (type === 3 ? 0.8 : 3.7); b.knockZ = dir.z * (type === 3 ? 0.8 : 3.7);
      if (!game.encounter?.hearingOnly) b.alert = CONFIG.beasts.memory;
      game.effects.spray(at, ichor, 7, 3.4, 0.094, 'mist');
      game.effects.spray(at, spark, 5, 4.6, 0.037, 'spark');
      return this.damage(b, damage, game, source, hit);
    }
    damage(b, amount, game, source = 'environment', hit = null) {
      if (game.phase !== 'play' || !b.active || !(amount > 0)) return false;
      const type = b.type, combat = game.weapon.combat;
      const applied = Math.min(b.hp, amount * combat.damageScale(b, source, game.time));
      b.hp -= applied;
      if (hit?.lifeSteal) game.player.hp = Math.min(CONFIG.player.health, game.player.hp + applied * hit.lifeSteal);
      if (b.hp > 0) return false;
      this.retire(b, game);
      const dropY = this.dropHeight(b);
      if (source === 'weapon' || source === 'electric') combat.onKill(b, hit, game);
      if (type === 3) {
        game.bossDead = true; this.boss = null;
        game.pickups.add('core', b.x, b.z, dropY + 0.18, TEXT.keyItem, 0);
        game.ui.notify(TEXT.bossDefeated, 2.6);
      }
      if (!definition.onBeastDefeated?.(b, game, source)) {
        this.air.set(b.x, b.y + b.height * 0.52, b.z);
        game.effects.spray(this.air, ichor, type === 3 ? 65 : 18, type === 3 ? 10 : 6.4, 0.12, 'mist');
        game.effects.spray(this.air, type === 3 ? coreTint : projectileTint, type === 3 ? 28 : 7, 6.2, 0.061, 'spark');
      }
      const bonusAmmo = game.encounter?.bonusAmmo ?? 0;
      if (bonusAmmo > 0 || type === 3 || game.weapon.reserve < 46 || game.kills % 2 === 0) {
        const amount = (CONFIG.pickups.ammoDrop + bonusAmmo) * (type === 3 ? 3 : 1);
        game.pickups.add('ammo', b.x + 0.17, b.z, dropY, '机关枪弹药', amount);
      }
      const bonusHealth = game.encounter?.bonusHealth ?? 0;
      if (bonusHealth > 0) {
        game.pickups.add('health', b.x - 0.26, b.z, dropY, '圣露', bonusHealth);
      }
      return true;
    }
    update(dt, player, game) {
      if (dt <= 0) return;
      this.frame++;
      this.navTime -= dt;
      const encounter = game.encounter;
      if (this.navTime <= 0) {
        if (encounter?.hearingOnly) {
          const step = game.footstep;
          const latest = Math.max(game.shotAt, step.at);
          if (game.time - latest < encounter.memory) {
            this.nav.rebuild(game.shotAt >= step.at ? game.shotX : step.x, game.shotAt >= step.at ? game.shotZ : step.z);
          }
        } else this.nav.rebuild(player.x, player.z);
        this.navTime = 0.24;
      }
      this.refreshHash();
      let nearest = Infinity;
      for (const b of this.pool) {
        if (!b.active) continue;
        game.weapon.combat.updateTarget(b, game);
        if (!b.active) continue;
        this.ai.update(b, player, game, dt, this.frame);
        nearest = Math.min(nearest, Math.hypot(b.x - player.x, b.z - player.z));
      }
      this.spawnTime -= dt;
      if (this.spawnTime <= 0) {
        this.spawnTime = encounter?.spawnEvery ?? CONFIG.beasts.spawnEvery;
        const target = Math.min(encounter?.population ?? CONFIG.beasts.population, this.pool.length);
        const burst = encounter?.spawnBurst ?? CONFIG.beasts.spawnBurst;
        camera.getWorldDirection(this.air);
        for (let i = 0; i < burst && this.live < target; i++) {
          const spawn = this.spawnSite(player, false, this.air);
          if (spawn !== -1) {
            const child = this.spawn(this.randomType(), this.nav.x(spawn), this.nav.z(spawn));
            child.reinforcement = this.live > CONFIG.beasts.population;
          }
        }
        if (!encounter?.hearingOnly && this.live > target) {
          for (const b of this.pool) {
            if (this.live <= target) break;
            if (!b.active || !b.reinforcement || Math.hypot(player.x - b.x, player.z - b.z) < CONFIG.beasts.spawnDistance ||
                this.visibleToPlayer(b.x, b.y, b.z, this.air)) continue;
            b.active = false; this.live--;
          }
        }
      }
      if (this.boss?.summon > 0) {
        const b = this.boss;
        const a = Math.random() * TAU;
        const x = b.x + Math.cos(a) * 3.6, z = b.z + Math.sin(a) * 3.6;
        const floor = this.level.surface(x, z, b.y + 0.45);
        if (this.live < this.pool.length && !this.level.blocked(x, z, floor, 0.51, 1.15)) {
          const stage = definition.stageBossSummon;
          if (!stage || stage(x, floor, z, game)) {
            if (!stage) {
              const child = this.spawn(0, x, z, floor);
              if (!encounter?.hearingOnly) child.alert = CONFIG.beasts.memory;
            }
            b.summon--;
            this.air.set(x, floor + 0.28, z);
            game.effects.spray(this.air, ichor, 8, 4.2, 0.10, 'mist');
          }
        }
      }
      this.refreshHash();
      game.threat = nearest;
    }
    fadeHitFlashes(dt, game) {
      for (const b of this.pool) {
        if (!b.active) continue;
        game.weapon.combat.updateTarget(b, game);
        if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
      }
    }
    render(dt = 0, t = 0, disabled = false) {
      this.counts.fill(0);
      let bars = 0;
      for (const b of this.pool) {
        if (!b.active) continue;
        const type = b.type;
        const batch = b.rage && type === 3 && this.modelBatches.length > CONFIG.beasts.types.length ? CONFIG.beasts.types.length : type;
        const i = this.counts[batch]++;
        const [body, luminous] = this.modelBatches[batch];
        const angle = Math.atan2(b.fx, b.fz);
        const delta = Math.atan2(Math.sin(angle - b.yaw), Math.cos(angle - b.yaw));
        b.yaw += delta * Math.min(1, dt * 16);
        const walk = t * (type === 0 ? 17 : 10) + b.blink;
        const action = disabled ? 0 : b.mode === 'windup' ? -0.13 : b.mode === 'charge' ? 0.23 : 0;
        const bob = (disabled ? 0 : Math.sin(walk * 2)) * 0.075 * clamp(b.stride / 3, 0.15, 1);
        body.geometry.attributes.beastFlash.setX(i, Math.min(1, b.flash * 12));
        const roll = b.surfaceRoll + (disabled ? 0 : Math.cos(walk) * 0.062);
        const visualY = b.y + bob + (b.surfaceRoll ? b.height * 0.5 * (1 - Math.cos(b.surfaceRoll)) : 0);
        setInstance(body, i, b.x, visualY, b.z, 1, 1, 1, null, b.yaw, action, roll);
        workColor.setScalar(disabled ? 0.31 : b.rage ? 3.2 : b.mode === 'windup' ? 2.85 : 1.90);
        setInstance(luminous, i, b.x, visualY, b.z, 1, 1, 1, workColor, b.yaw, action, roll);
        const range2 = (camera.position.x - b.x) ** 2 + (camera.position.z - b.z) ** 2;
        if (range2 > 68 ** 2) continue;
        const w = type === 3 ? 1.83 : 0.93, h = type === 3 ? 0.099 : 0.059;
        const ratio = clamp(b.hp / CONFIG.beasts.types[type].hp, 0, 1);
        const y = Math.abs(b.surfaceRoll) > 2.10 ? b.y - 0.18 : b.y + b.height + 0.20;
        stamp.position.set(b.x, y, b.z);
        stamp.quaternion.copy(camera.quaternion); stamp.scale.set(w + 0.055, h + 0.035, 1);
        stamp.updateMatrix(); this.healthBG.setMatrixAt(bars, stamp.matrix);
        this.line.set(w * (ratio - 1) / 2, 0, 0.016).applyQuaternion(camera.quaternion);
        stamp.position.add(this.line);
        stamp.scale.set(w * ratio, h, 1); stamp.updateMatrix(); this.healthFG.setMatrixAt(bars, stamp.matrix);
        workColor.setHex(type === 3 || b.rage ? 0xff536a : b.mode === 'windup' ? 0xffae62 : 0xee755f);
        this.healthFG.setColorAt(bars++, workColor);
      }
      for (let i = 0; i < this.counts.length; i++) {
        const [body, luminous] = this.modelBatches[i];
        body.geometry.attributes.beastFlash.needsUpdate = true;
        updateMesh(body, this.counts[i]); updateMesh(luminous, this.counts[i]);
      }
      updateMesh(this.healthBG, bars); updateMesh(this.healthFG, bars);
    }
  }

  return { BeastAI, BeastManager };
}
</script>
<script type="text/plain" data-level-module="@level-kit/config.mjs">
const DEFAULT_CONFIG = {
  audio: { ambient: null },
  map: { cell: 4, fog: 0.021, hash: 4, navCell: 1.25 },
  graphics: { maxPixelRatio: 1.25, bloomScale: 0.72 },
  player: {
    eye: 1.7, height: 1.77, radius: 0.33, health: 100, walk: 5.25, backward: 0.81,
    sprint: 8.1, stamina: 100, sprintUse: 24, staminaRegen: 17, sprintResume: 19,
    jump: 5.75, gravity: 16.5, step: 0.46, healDelay: 5, healRate: 4.5, safeTime: 9, safeRadius: 6,
    hurtCooldown: 0.24, mouseSpeed: 0.86, crouch: null,
  },
  weapon: {
    fireRate: 10, magazine: 60, reserve: 300, maxReserve: 540, reloadTime: 1.8,
    damage: 24, range: 92, baseSpread: 0.0045, maxSpread: 0.033, recoil: 0.012,
    heatPerShot: 0.061, heatRecovery: 1.1, hitStop: 0.03, hearingRadius: 32,
  },
  beasts: {
    population: 64, capacity: 96, killsToWin: 150, spawnEvery: 0.50, spawnBurst: 2,
    spawnDistance: 21, farDistance: 30, farUpdateFrames: 6, sight: 25, sightDot: 0.18,
    memory: 7, separation: 1.35,
    types: [
      { hp: 62, speed: 7.29, radius: 0.39, height: 1.11, damage: 8, reach: 1.08, recovery: 0.92 },
      { hp: 150, speed: 3.75, radius: 0.58, height: 2.08, damage: 17, reach: 1.45, recovery: 1.55, windup: 0.70, chargeSpeed: 13.8, chargeTime: 0.73 },
      { hp: 95, speed: 4.6, radius: 0.49, height: 1.75, damage: 11, reach: 19, recovery: 2.15, projectileSpeed: 13.4, hazardLife: 0 },
      { hp: 760, speed: 3.4, rageSpeed: 5.3, radius: 0.93, height: 3.92, damage: 24, reach: 2.25, recovery: 1.25, windup: 0.65, summonCount: 6 },
    ],
  },
  pickups: { pool: 220, grab: 1.18, ammoDrop: 14, ammoCache: 65 },
  effects: { particles: 680, tracers: 32, projectiles: 40, pools: 32, gateDuration: 2.25 },
};

const CAMPAIGN_DIFFICULTY = {
  firstPopulation: 56,
  populationStep: 2,
  reserveCapacity: 32,
  firstSpeedScale: 0.5,
  speedStepFromBase: 0.05,
};

function merge(base, patch) {
  if (patch === undefined) return structuredClone(base);
  if (Array.isArray(base) && Array.isArray(patch)) {
    return Array.from({ length: Math.max(base.length, patch.length) }, (_, i) => merge(base[i], patch[i]));
  }
  if (base && typeof base === 'object' && patch && typeof patch === 'object') {
    return Object.fromEntries([...new Set([...Object.keys(base), ...Object.keys(patch)])]
      .map(key => [key, merge(base[key], patch[key])]));
  }
  return structuredClone(patch);
}

// 每个关卡得到独立配置，避免场景间共享数组或对象。
export function makeConfig(overrides = {}, campaignStage = 0) {
  const config = merge(DEFAULT_CONFIG, overrides);
  if (campaignStage > 0) {
    const rules = CAMPAIGN_DIFFICULTY;
    const steps = campaignStage - 1;
    const beasts = config.beasts;
    beasts.population = rules.firstPopulation + steps * rules.populationStep;
    beasts.capacity = Math.max(beasts.capacity, beasts.population + rules.reserveCapacity);

    // 关卡只填写原速。追击、冲撞和狂暴统一缩放，弹丸和事件倍率沿用各自配置。
    const speedScale = Math.min(1, rules.firstSpeedScale * (1 + steps * rules.speedStepFromBase));
    for (const type of beasts.types) {
      for (const key of ['speed', 'chargeSpeed', 'rageSpeed']) {
        if (type[key] !== undefined) type[key] *= speedScale;
      }
    }
  }
  for (const [name, value, min] of [
    ['map.cell', config.map.cell, 0.1],
    ['map.hash', config.map.hash, 0.1],
    ['map.navCell', config.map.navCell, 0.1],
    ['weapon.fireRate', config.weapon.fireRate, 0.1],
    ['weapon.reloadTime', config.weapon.reloadTime, 0.01],
    ['weapon.magazine', config.weapon.magazine, 1],
    ['beasts.population', config.beasts.population, 1],
    ['beasts.capacity', config.beasts.capacity, config.beasts.population],
    ['beasts.killsToWin', config.beasts.killsToWin, 1],
    ['beasts.farUpdateFrames', config.beasts.farUpdateFrames, 1],
    ['effects.particles', config.effects.particles, 1],
    ['effects.tracers', config.effects.tracers, 1],
    ['effects.projectiles', config.effects.projectiles, 1],
    ['effects.pools', config.effects.pools, 1],
    ['pickups.pool', config.pickups.pool, 1],
  ]) {
    if (!Number.isFinite(value) || value < min) throw new RangeError(name + ' 必须大于或等于 ' + min);
  }
  if (config.beasts.types.length !== 4) throw new RangeError('关卡需要定义四类凶兽参数');
  return config;
}
</script>
<script type="text/plain" data-level-module="@level-kit/effects.mjs">
import { rayBox } from '@level-kit/world.mjs';

export function createEffectClasses({ CONFIG, THREE, V3, TAU, Y_AXIS, shapes, stamp, scene, brighter, workColor, randomRange, dynamicMesh, updateMesh, setInstance, colors, definition }) {
  const { projectileTint, coreTint } = colors;

  class Effects {
    constructor() {
      this.dots = Array.from({ length: CONFIG.effects.particles }, () => ({ pos: new V3(), vel: new V3(), tint: new THREE.Color(), life: 0 }));
      this.traces = Array.from({ length: CONFIG.effects.tracers }, () => ({ a: new V3(), b: new V3(), life: 0 }));
      this.dotMesh = dynamicMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshBasicMaterial(), this.dots.length);
      this.traceMesh = dynamicMesh(shapes.box, new THREE.MeshBasicMaterial({ color: brighter(0xffc489, 2.1) }), this.traces.length);
      this.nextDot = 0; this.nextTrace = 0;
      this.rayVec = new V3();
    }
    reset() {
      for (const item of this.dots) item.life = 0;
      for (const item of this.traces) item.life = 0;
      updateMesh(this.dotMesh, 0); updateMesh(this.traceMesh, 0);
    }
    streak(from, to) {
      const data = this.traces[this.nextTrace++ % this.traces.length];
      data.a.copy(from); data.b.copy(to); data.life = 0.052;
    }
    spray(where, color, count, speed, size, style) {
      for (let i = 0; i < count; i++) {
        const p = this.dots[this.nextDot++ % this.dots.length];
        const a = randomRange(0, TAU), v = randomRange(speed * 0.3, speed);
        p.pos.copy(where); p.vel.set(Math.cos(a) * v, randomRange(0.04, 1.0) * v, Math.sin(a) * v);
        p.tint.copy(color);
        p.size = size * randomRange(0.45, 1.6); p.style = style;
        p.life = p.max = style === 'mist' ? randomRange(0.26, 0.54) : randomRange(0.10, 0.40);
      }
    }
    update(dt) {
      let n = 0, m = 0;
      for (const p of this.dots) {
        if (p.life <= 0) continue;
        p.life -= dt;
        if (p.life <= 0) continue;
        const t = p.life / p.max, mist = p.style === 'mist';
        p.vel.y -= dt * (mist ? 1 : 11);
        p.pos.addScaledVector(p.vel, dt);
        const size = p.size * (mist ? (1.4 - t * 0.52) * Math.sqrt(t) : 0.3 + t * 0.7);
        workColor.copy(p.tint).multiplyScalar(mist ? t * 0.64 + 0.13 : t + 0.37);
        setInstance(this.dotMesh, n++, p.pos.x, p.pos.y, p.pos.z, size, size * (mist ? 1 : 2.1), size, workColor);
      }
      for (const p of this.traces) {
        if (p.life <= 0) continue;
        p.life -= dt;
        if (p.life <= 0) continue;
        this.rayVec.subVectors(p.b, p.a);
        const length = this.rayVec.length();
        if (length < 0.01) continue;
        stamp.position.lerpVectors(p.a, p.b, 0.5);
        stamp.quaternion.setFromUnitVectors(Y_AXIS, this.rayVec.divideScalar(length));
        stamp.scale.set(0.021, length, 0.021);
        stamp.updateMatrix(); this.traceMesh.setMatrixAt(m++, stamp.matrix);
      }
      updateMesh(this.dotMesh, n); updateMesh(this.traceMesh, m);
    }
  }

  class Rift {
    constructor(position) {
      const palette = definition.palette?.rift ?? {};
      this.group = new THREE.Group();
      this.group.position.copy(position);
      scene.add(this.group);
      this.core = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 4.7), new THREE.ShaderMaterial({
        transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          tick: { value: 0 }, ready: { value: 0 }, open: { value: 0 },
          sealedTint: { value: new V3(...(palette.sealed ?? [0.34, 0.09, 0.8])) },
          openTint: { value: new V3(...(palette.ready ?? [2.1, 0.70, 0.16])) },
        },
        vertexShader: 'varying vec2 tex; void main(){ tex=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: `
          varying vec2 tex;
          uniform float tick,ready,open;
          uniform vec3 sealedTint,openTint;
          void main() {
            vec2 p = tex*2.0-1.0;
            float r = length(p);
            float a = atan(p.y,p.x);
            float spiral = sin(a*5.0-r*23.0+tick*3.1+sin(a*4.0+tick)*0.7);
            float veins = pow(max(0.0,spiral),8.0);
            float band = exp(-abs(r-0.76-sin(a*7.0+tick)*0.064)*25.0);
            float rim = 1.0-smoothstep(0.62,0.98,r);
            float shell = abs(sin(p.y*62.0-tick*6.0))*0.13*(1.0-ready);
            vec3 energy = mix(sealedTint,openTint,ready + (1.0-ready)*band*0.67);
            gl_FragColor = vec4(energy * (1.0+open*3.0), (veins*0.46+band*0.62+shell+0.12)*rim*(1.0-open*0.82));
          }`,
      }));
      this.core.position.y = 2.55; this.group.add(this.core);
      this.rings = [];
      for (let i = 0; i < 3; i++) {
        const mesh = new THREE.Mesh(new THREE.TorusGeometry(1.83 + i * 0.19, 0.028 + i * 0.009, 5, 68, TAU - i * 0.73),
          new THREE.MeshBasicMaterial({ color: brighter(palette.rings?.[i % 2] ?? (i % 2 ? 0xa18aff : 0xff9b6b), 2.1 - i * 0.29) }));
        mesh.scale.y = 1.10;
        mesh.position.set(0, 2.55, -0.045 + i * 0.084);
        this.group.add(mesh); this.rings.push(mesh);
      }
      const particleCount = 140, positions = new Float32Array(particleCount * 3);
      this.embers = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({
        color: brighter(palette.particles ?? 0xffa372, 2.1), size: 0.047, transparent: true, opacity: 0.93, depthWrite: false,
        blending: THREE.AdditiveBlending,
      }));
      this.embers.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
      this.embers.frustumCulled = false;
      this.group.add(this.embers);
      this.wave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.023, 7, 64),
        new THREE.MeshBasicMaterial({ color: brighter(palette.wave ?? 0xffae86, 2.3), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      this.wave.rotation.x = -Math.PI / 2;
      this.wave.position.y = 0.42; this.group.add(this.wave);
    }
    update(t, ready, blast) {
      const u = this.core.material.uniforms;
      u.tick.value = t; u.ready.value = ready ? 1 : 0; u.open.value = blast;
      for (let i = 0; i < this.rings.length; i++) {
        this.rings[i].rotation.set(Math.sin(t * 0.67 + i) * (0.11 + i * 0.09), Math.cos(t * 0.32 + i) * 0.30, t * (i === 1 ? -0.51 : 0.65) + i * 1.3);
        this.rings[i].visible = blast < 0.94;
      }
      const positions = this.embers.geometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        const cycle = (i * 0.618034 + t * 0.29) % 1;
        const a = i * 2.399963 + t * (1.8 + cycle), r = 2.55 * (1 - cycle) + blast * 8.3;
        positions.setXYZ(i, Math.cos(a) * r, 2.55 + Math.sin(a) * r * 0.87, Math.sin(cycle * TAU) * 0.8 + Math.sin(a * 0.4) * blast * 2.5);
      }
      positions.needsUpdate = true;
      this.embers.material.opacity = 1 - blast * 0.72;
      this.wave.visible = blast > 0 && blast < 1;
      this.wave.scale.setScalar(0.9 + blast * 31);
      this.wave.material.opacity = Math.max(0, 1 - blast) * 0.92;
      this.core.visible = blast < 1;
    }
  }

  class Projectiles {
    constructor(level, effects) {
      this.level = level; this.effects = effects;
      this.shots = Array.from({ length: CONFIG.effects.projectiles }, () => ({ pos: new V3(), vel: new V3(), life: 0 }));
      this.puddles = Array.from({ length: CONFIG.effects.pools }, () => ({ pos: new V3(), life: 0, max: 1 }));
      this.sparks = dynamicMesh(definition.projectileGeometry?.(THREE) ?? new THREE.IcosahedronGeometry(1, 1),
        new THREE.MeshBasicMaterial({ color: projectileTint }), this.shots.length);
      this.directional = Boolean(definition.projectileGeometry);
      this.fields = dynamicMesh(new THREE.CircleGeometry(1, 21), new THREE.MeshBasicMaterial({
        transparent: true, opacity: 0.41, depthWrite: false, blending: THREE.AdditiveBlending,
      }), this.puddles.length);
      this.old = new V3(); this.dir = new V3();
      this.shotCursor = 0; this.puddleCursor = 0;
      this.gravity = 9.6;
    }
    reset() {
      this.shots.forEach(p => { p.life = 0; });
      this.puddles.forEach(p => { p.life = 0; });
      updateMesh(this.sparks, 0); updateMesh(this.fields, 0);
    }
    launch(beast, player) {
      const { projectileSpeed, damage, hazardLife, slowScale = 1, slowDuration = 0,
        projectileGravity = this.gravity } = CONFIG.beasts.types[beast.type];
      const shot = this.shots[this.shotCursor++ % this.shots.length];
      shot.pos.set(beast.x, beast.y + beast.height * 0.72, beast.z);
      const dx = player.x - beast.x, dz = player.z - beast.z;
      const range = Math.max(1, Math.hypot(dx, dz));
      const t = range / projectileSpeed;
      shot.vel.set(dx / t, (player.y + 0.55 - shot.pos.y) / t + 0.5 * projectileGravity * t, dz / t);
      shot.life = t + 1.55; shot.damage = damage; shot.poolLife = hazardLife;
      shot.gravity = projectileGravity;
      shot.slowScale = slowScale; shot.slowDuration = slowDuration;
    }
    splat(p, game, markGround = true) {
      this.effects.spray(p.pos, projectileTint, 13, 4.2, 0.073, 'mist');
      definition.onProjectileImpact?.(p.pos, game);
      if (markGround && p.poolLife > 0) {
        const pool = this.puddles[this.puddleCursor++ % this.puddles.length];
        pool.pos.copy(p.pos);
        pool.pos.y = this.level.surface(p.pos.x, p.pos.z, p.pos.y + 0.15) + 0.038;
        pool.life = pool.max = p.poolLife;
      }
      p.life = 0;
    }
    update(dt, player, game) {
      let n = 0, m = 0;
      for (const p of this.shots) {
        if (p.life <= 0) continue;
        p.life -= dt;
        if (p.life <= 0) continue;
        this.old.copy(p.pos);
        p.pos.addScaledVector(p.vel, dt);
        p.pos.y -= p.gravity * 0.5 * dt * dt;
        p.vel.y -= p.gravity * dt;
        const distance = this.dir.subVectors(p.pos, this.old).length();
        this.dir.divideScalar(Math.max(distance, 0.00001));
        const cover = this.level.hash.ray(this.old, this.dir, distance + 0.001);
        const coverDistance = this.level.hash.depth;
        const target = rayBox(this.old, this.dir, player.bounds());
        if (target <= distance && target < coverDistance) {
          p.pos.copy(this.old).addScaledVector(this.dir, target);
          const damage = p.damage * (game.encounter?.beastDamageScale ?? 1);
          if (player.hurt(damage, game) && player.hp > 0) {
            if (p.slowDuration > 0) player.slow(p.slowScale, p.slowDuration, game.time);
            definition.onProjectileHit?.(game);
          }
          this.splat(p, game);
        } else if (cover) {
          p.pos.copy(this.old).addScaledVector(this.dir, Math.max(0, coverDistance - 0.06));
          this.splat(p, game, cover.y0 < p.pos.y - 0.3);
        } else if (p.pos.y <= this.level.base(p.pos.x, p.pos.z)) {
          this.splat(p, game);
        } else {
          const size = 0.089 + 0.022 * Math.sin(p.life * 34);
          const yaw = this.directional ? Math.atan2(p.vel.x, p.vel.z) : 0;
          const pitch = this.directional ? -Math.atan2(p.vel.y, Math.hypot(p.vel.x, p.vel.z)) : 0;
          setInstance(this.sparks, n++, p.pos.x, p.pos.y, p.pos.z, size, size, size, null, yaw, pitch);
        }
      }
      for (const p of this.puddles) {
        if (p.life <= 0) continue;
        p.life -= dt;
        if (p.life <= 0) continue;
        const age = p.life / p.max;
        const r = 1.24 + (1 - age) * 0.36;
        if (Math.abs(player.y - p.pos.y) < 0.60 && Math.hypot(player.x - p.pos.x, player.z - p.pos.z) < r - 0.1 && player.hurtDelay < 0.03) {
          player.hurt(3.3, game, 0.48);
        }
        workColor.copy(projectileTint).multiplyScalar(age * 0.40 + 0.10);
        setInstance(this.fields, m++, p.pos.x, p.pos.y, p.pos.z, r, r * 0.86, 1, workColor, 0, -Math.PI / 2);
      }
      updateMesh(this.sparks, n); updateMesh(this.fields, m);
    }
  }

  return { Effects, Rift, Projectiles };
}
</script>
<script type="text/plain" data-level-module="@level-kit/pickups.mjs">
export function createPickupClass({ CONFIG, THREE, V3, shapes, workColor, dynamicMesh, updateMesh, setInstance, colors, definition, TEXT }) {
  const { coreTint, rareTint, ammoTint } = colors;
  const healthTint = new THREE.Color(0x86ed9f).multiplyScalar(1.30);

  class Pickups {
    constructor(level, effects) {
      this.level = level; this.effects = effects;
      this.objects = Array.from({ length: CONFIG.pickups.pool }, () => ({ active: false, kind: '', born: 0 }));
      this.boxes = dynamicMesh(shapes.box, new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x1a2832 }), this.objects.length);
      this.marks = dynamicMesh(new THREE.OctahedronGeometry(1, 0), new THREE.MeshBasicMaterial(), this.objects.length);
      this.rings = dynamicMesh(new THREE.RingGeometry(0.79, 1, 15), new THREE.MeshBasicMaterial({
        side: THREE.DoubleSide, transparent: true, depthWrite: false, opacity: 0.72,
      }), this.objects.length);
      this.where = new V3(); this.age = 0;
    }
    reset() {
      this.age = 0;
      for (const p of this.objects) p.active = false;
      for (const [x, z, name, value, height] of (definition.loot ?? [])) {
        this.add('rare', x, z, this.level.surface(x, z, height === 'top' ? Infinity : this.level.base(x, z) + 0.16), name, value, true);
      }
      for (const [x, z] of (definition.ammo ?? [])) this.add('ammo', x, z, this.level.base(x, z), '补给弹药', CONFIG.pickups.ammoCache, true);
    }
    add(kind, x, z, y, name, value, permanent = false) {
      let object = this.objects.find(p => !p.active);
      if (!object) {
        for (const p of this.objects) {
          if (!p.permanent && ['ammo', 'health', 'sample'].includes(p.kind) && (!object || p.born < object.born)) object = p;
        }
      }
      if (!object) return;
      Object.assign(object, { active: true, kind, x, z, y, name, value, permanent, born: this.age });
    }
    update(dt, player, game) {
      this.age += dt;
      for (const item of this.objects) {
        if (!item.active) continue;
        if (Math.abs(player.y - item.y) > 1.25 || Math.hypot(player.x - item.x, player.z - item.z) > CONFIG.pickups.grab) continue;
        if (item.kind === 'core') { game.core = true; game.ui.notify(TEXT.coreCollected, 2.0); }
        else if (item.kind === 'rare') {
          game.loot.push({ name: item.name, value: item.value }); game.value += item.value;
          game.ui.notify('已拾取 ' + item.name + ' / 价值 ' + item.value, 1.7);
        } else if (item.kind === 'sample') {
          game.weapon.combat.samplePending = true;
          game.ui.notify('已回收样本 / 下次换弹伤害提升 30%', 1.7);
        } else if (item.kind === 'health') {
          const restored = Math.min(CONFIG.player.health - player.hp, item.value);
          if (restored <= 0) continue;
          player.hp += restored;
          game.ui.notify(item.name + '恢复生命 ' + Math.ceil(restored), 1.2);
        } else {
          const added = Math.min(CONFIG.weapon.maxReserve - game.weapon.reserve, item.value);
          if (added <= 0) continue;
          game.weapon.reserve += added;
          game.ui.notify('备用弹药增加 ' + added, 1.05);
        }
        item.active = false;
        game.sound.pickup(item.kind !== 'ammo');
        this.where.set(item.x, item.y + 0.42, item.z);
        const tint = item.kind === 'core' ? coreTint : item.kind === 'rare' ? rareTint : item.kind === 'health' ? healthTint : ammoTint;
        this.effects.spray(this.where, tint, 8, 2.5, 0.041, 'spark');
      }
    }
    render(t) {
      let n = 0;
      for (const item of this.objects) {
        if (!item.active) continue;
        const core = item.kind === 'core', rare = item.kind === 'rare';
        const color = core ? coreTint : rare ? rareTint : item.kind === 'health' || item.kind === 'sample' ? healthTint : ammoTint;
        const a = t * 1.7 + item.x * 0.11;
        const offset = core ? 0.68 : rare ? 0.47 : 0.35;
        const float = Math.sin(a * 1.8) * 0.070;
        const size = core ? 0.22 : rare ? 0.117 : 0.076;
        setInstance(this.marks, n, item.x, item.y + offset + float, item.z, size, size * (core ? 1.46 : 1), size, color, a, 0.22);
        workColor.copy(color).multiplyScalar(0.44);
        setInstance(this.rings, n, item.x, item.y + 0.025, item.z, core ? 0.64 : rare ? 0.54 : 0.38, core ? 0.64 : rare ? 0.54 : 0.38, 1, workColor, 0, -Math.PI / 2);
        workColor.setHex(core ? 0xbb7147 : rare ? 0x6e9d91 : 0x617b8e);
        const w = rare ? 0.40 : 0.29;
        setInstance(this.boxes, n++, item.x, item.y + 0.126, item.z, w, 0.23, w * 0.72, workColor, a * 0.12);
      }
      updateMesh(this.boxes, n); updateMesh(this.marks, n); updateMesh(this.rings, n);
    }
  }

  return Pickups;
}
</script>
<script type="text/plain" data-level-module="@level-kit/player.mjs">
export function createPlayerClass({ CONFIG, THREE, V3, camera, clamp, lerp, randomRange }) {
  class Player {
    constructor(level, look) {
      this.level = level; this.look = look;
      this.radius = CONFIG.player.radius; this.height = CONFIG.player.height;
      this.box = {};
      this.forward = new V3(); this.visual = new THREE.Euler(0, 0, 0, 'YXZ');
      this.rot = new THREE.Quaternion();
      this.reset();
    }
    reset() {
      const p = CONFIG.player;
      this.x = this.level.spawn.x; this.z = this.level.spawn.z;
      this.y = this.level.spawn.y;
      this.escaped = false;
      this.crouched = false; this.height = p.height; this.eye = p.eye;
      this.hp = p.health; this.energy = p.stamina;
      this.vy = 0; this.grounded = true; this.tired = false;
      this.sprinting = false; this.lastHurt = -Infinity; this.hurtDelay = 0;
      this.slowUntil = -Infinity; this.slowScale = 1;
      this.damageVignette = 0; this.shake = 0; this.bob = 0; this.sway = 0;
      this.recoil = 0; this.recoilRoll = 0; this.speedMix = 0;
      this.look.rotation.set(this.level.spawnPitch, this.level.spawnYaw, 0, 'YXZ');
      this.positionCamera(0);
    }
    bounds() {
      const b = this.box;
      b.x0 = this.x - this.radius; b.x1 = this.x + this.radius;
      b.z0 = this.z - this.radius; b.z1 = this.z + this.radius;
      b.y0 = this.y; b.y1 = this.y + this.height;
      return b;
    }
    protected(game) {
      return !this.escaped && this.level.inSafeZone(this.x, this.z) && game.time < CONFIG.player.safeTime;
    }
    hurt(amount, game, cooldown = CONFIG.player.hurtCooldown) {
      if (game.phase !== 'play' || this.hurtDelay > 0 || this.protected(game)) return false;
      this.hp = Math.max(0, this.hp - amount); this.hurtDelay = cooldown; this.lastHurt = game.time;
      this.damageVignette = Math.min(1, this.damageVignette * 0.5 + 0.25 + amount / 37);
      this.shake = Math.max(this.shake, Math.min(0.73, 0.20 + amount / 34));
      game.sound.tone(95, 37, 0.19, 0.28, 'triangle');
      if (this.hp <= 0) game.finish(false);
      return true;
    }
    slow(scale, duration, now) {
      if (now >= this.slowUntil || scale <= this.slowScale) {
        this.slowUntil = now + duration; this.slowScale = scale;
      }
    }
    update(dt, input, game) {
      if (dt <= 0) return;
      const p = CONFIG.player;
      const forward = Number(input.down.has('KeyW')) - Number(input.down.has('KeyS'));
      const strafe = Number(input.down.has('KeyD')) - Number(input.down.has('KeyA'));
      if (p.crouch) {
        this.crouched = input.down.has('KeyC') ||
          (this.crouched && this.level.blocked(this.x, this.z, this.y, this.radius, p.height));
        this.height = this.crouched ? p.crouch.height : p.height;
      }
      const impairment = game.time < this.slowUntil ? this.slowScale : 1;
      const shift = input.down.has('ShiftLeft') || input.down.has('ShiftRight');
      if (this.tired && this.energy >= p.sprintResume) this.tired = false;
      this.sprinting = impairment > 0 && !this.crouched && shift && (forward > 0 || forward === 0 && strafe !== 0) && !this.tired;
      if (this.sprinting) {
        this.energy = Math.max(0, this.energy - p.sprintUse * dt);
        if (this.energy <= 0) { this.tired = true; this.sprinting = false; }
      } else {
        this.energy = Math.min(p.stamina, this.energy + dt * p.staminaRegen);
      }
      this.forward.set(0, 0, -1).applyQuaternion(this.look.quaternion);
      const norm = Math.max(0.0001, Math.hypot(this.forward.x, this.forward.z));
      const x = this.forward.x / norm, z = this.forward.z / norm;
      const stride = this.sprinting ? p.sprint : p.walk * (forward < 0 ? p.backward : 1) * (this.crouched ? p.crouch.speed : 1);
      const exposure = game.encounter?.moveScale ?? 1;
      const terrain = game.weapon.combat.terrainScale(this.level.movementScale(this.x, this.z, this.y, game)) * game.weapon.combat.moveSpeed;
      const scale = dt * stride * exposure * impairment * terrain / Math.max(1, Math.hypot(forward, strafe));
      const floorBefore = this.level.foot(this.x, this.z, this.y + 0.052, this.radius);
      this.grounded = this.y <= floorBefore + 0.07 && this.vy <= 0;
      if (input.jump) {
        input.jump = false;
        if (this.grounded && !this.crouched && impairment > 0) { this.vy = p.jump; this.grounded = false; }
      }
      const moved = this.level.move(this, (x * forward - z * strafe) * scale, (z * forward + x * strafe) * scale, this.grounded ? p.step : 0.06);
      const floor = this.level.foot(this.x, this.z, this.y + 0.06, this.radius);
      if (this.grounded && this.y <= floor + 0.16) {
        this.y = floor; this.vy = 0;
      } else if (this.y > floor + 0.001 || this.vy > 0) {
        this.vy -= p.gravity * dt;
        const target = Math.max(floor, this.y + this.vy * dt);
        if (this.vy > 0 && this.level.blocked(this.x, this.z, target, this.radius, this.height)) this.vy = -0.25;
        else this.y = target;
        if (this.y <= floor + 0.001) this.vy = 0;
      } else {
        this.y = floor; this.vy = 0;
      }
      if (!this.level.inSafeZone(this.x, this.z)) this.escaped = true;
      const encounter = game.encounter;
      if (encounter?.hearingOnly && this.grounded && moved > 0.003 && !this.crouched) {
        const footstep = game.footstep;
        footstep.x = this.x; footstep.y = this.y; footstep.z = this.z; footstep.at = game.time;
        footstep.radius = this.sprinting ? encounter.runHearing : encounter.walkHearing;
      }
      this.speedMix = lerp(this.speedMix, clamp(moved / Math.max(0.001, dt * p.walk), 0, 1.3), 1 - Math.exp(-14 * dt));
      this.bob += dt * (this.sprinting ? 13.0 : 8.3) * (0.25 + this.speedMix * 0.8);
      this.sway = lerp(this.sway, strafe * this.speedMix, Math.min(1, dt * 9));
      this.hurtDelay = Math.max(0, this.hurtDelay - dt);
      if (game.time - this.lastHurt >= p.healDelay) this.hp = Math.min(p.health, this.hp + dt * p.healRate);
    }
    positionCamera(dt) {
      this.damageVignette *= Math.exp(-dt * 4.8);
      this.shake *= Math.exp(-dt * 12);
      this.recoil *= Math.exp(-dt * 13.3);
      this.recoilRoll *= Math.exp(-dt * 10);
      const wobble = this.speedMix * Math.sin(this.bob * 2) * 0.028;
      const p = CONFIG.player;
      const targetEye = this.crouched ? p.crouch.eye : p.eye;
      this.eye = lerp(this.eye, targetEye, 1 - Math.exp(-dt * 17));
      camera.position.set(this.x, this.y + this.eye + wobble, this.z);
      camera.position.x += Math.sin(this.bob * 0.48) * this.speedMix * 0.012;
      this.visual.set(this.recoil + randomRange(-0.028, 0.028) * this.shake,
        randomRange(-0.021, 0.021) * this.shake,
        this.recoilRoll - this.sway * 0.012 + randomRange(-0.031, 0.031) * this.shake, 'YXZ');
      this.rot.setFromEuler(this.visual);
      camera.quaternion.copy(this.look.quaternion).multiply(this.rot);
      camera.updateMatrixWorld(true);
    }
  }

  return Player;
}
</script>
<script type="text/plain" data-level-module="@level-kit/rendering.mjs">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createRifleEnvironment } from '@level-kit/rifle-model.mjs';

export function createRendering({ CONFIG, definition, canvas }) {
  const stamp = new THREE.Object3D();
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(definition.background ?? 0x283b59);
  scene.fog = new THREE.FogExp2(definition.fog ?? 0x344865, CONFIG.map.fog);
  const camera = new THREE.PerspectiveCamera(73, 1, 0.045, 155);
  camera.rotation.order = 'YXZ';
  scene.add(camera);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.07;
  renderer.info.autoReset = false;
  const composer = new EffectComposer(renderer);
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.52, 0.63, 0.75);
  composer.addPass(new RenderPass(scene, camera));
  // 武器单独清深度，避免穿墙时被裁去，同时保留模型自身遮挡和透明材质。
  const weaponScene = new THREE.Scene();
  const weaponCamera = new THREE.PerspectiveCamera(camera.fov, 1, camera.near, 5);
  weaponScene.environment = createRifleEnvironment();
  const weaponAmbient = new THREE.HemisphereLight(0xe6f4ff, 0x736863, 1.35);
  const weaponKey = new THREE.DirectionalLight(0xffedda, 1.7);
  const weaponFill = new THREE.DirectionalLight(0xaddbff, .82);
  weaponKey.position.set(-1.4, 1.9, 1.4);
  weaponFill.position.set(1, .5, -2);
  weaponScene.add(weaponAmbient, weaponKey, weaponFill);
  class WeaponPass extends RenderPass {
    render(renderer, writeBuffer, readBuffer) {
      renderer.setRenderTarget(readBuffer);
      super.render(renderer, writeBuffer, readBuffer);
    }
  }
  const weaponPass = new WeaponPass(weaponScene, weaponCamera);
  weaponPass.clear = false;
  weaponPass.clearDepth = true;
  weaponPass.enabled = false;
  composer.addPass(weaponPass);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  function canvasTexture(w, h, paint, tiled = false) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    paint(canvas.getContext('2d'), w, h);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    if (tiled) texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    return texture;
  }

  const shapes = {
    box: new THREE.BoxGeometry(1, 1, 1),
    cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 12),
    stone: new THREE.DodecahedronGeometry(0.65, 0),
    plane: new THREE.PlaneGeometry(1, 1),
  };

  class StaticBatches {
    constructor(materials, geometries = shapes) {
      this.groups = new Map();
      this.materials = materials;
      this.geometries = geometries;
    }
    add(kind, mat, x, y, z, w, h, d, color = 0xffffff, yaw = 0, pitch = 0, roll = 0) {
      const key = kind + '/' + mat;
      if (!this.groups.has(key)) this.groups.set(key, { kind, mat, rows: [] });
      stamp.position.set(x, y, z); stamp.rotation.set(pitch, yaw, roll); stamp.scale.set(w, h, d);
      stamp.updateMatrix();
      this.groups.get(key).rows.push({ matrix: stamp.matrix.clone(), color: color?.isColor ? color : new THREE.Color(color) });
    }
    flush() {
      for (const { kind, mat, rows } of this.groups.values()) {
        const mesh = new THREE.InstancedMesh(this.geometries[kind], this.materials[mat], rows.length);
        for (let i = 0; i < rows.length; i++) {
          mesh.setMatrixAt(i, rows[i].matrix); mesh.setColorAt(i, rows[i].color);
        }
        mesh.computeBoundingSphere();
        scene.add(mesh);
      }
      this.groups.clear();
    }
  }

  function dynamicMesh(geometry, material, capacity) {
    const mesh = new THREE.InstancedMesh(geometry, material, capacity);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    mesh.count = 0;
    scene.add(mesh);
    return mesh;
  }

  function updateMesh(mesh, count) {
    mesh.count = count;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }

  function setInstance(mesh, i, x, y, z, w, h, d, color, yaw = 0, pitch = 0, roll = 0) {
    stamp.position.set(x, y, z); stamp.scale.set(w, h, d); stamp.rotation.set(pitch, yaw, roll, 'YXZ');
    stamp.updateMatrix(); mesh.setMatrixAt(i, stamp.matrix);
    if (color) mesh.setColorAt(i, color);
  }
