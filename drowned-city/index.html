function normalPattern(THREE, paint) {
  return rifleTexture(THREE, width, height, ctx => {
    ctx.fillStyle = '#555'; ctx.fillRect(0, 0, width, height);
    paint(ctx, '#ddd');
    const source = ctx.getImageData(0, 0, width, height).data;
    const image = ctx.createImageData(width, height);
    const at = (x, y) => source[(y * width + x) * 4] / 255;
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        const a = (at(x - 1, y) - at(x + 1, y)) * 2;
        const b = (at(x, y - 1) - at(x, y + 1)) * 2;
        const scale = 127 / Math.hypot(a, b, 1), offset = (y * width + x) * 4;
        image.data.set([128 + a * scale, 128 - b * scale, 128 + scale, 255], offset);

    }
    ctx.fillStyle = '#8080ff'; ctx.fillRect(0, 0, width, height);
    ctx.putImageData(image, 0, 0, 1, 1, width - 2, height - 2);
  }, false);
}

function voronoi(THREE) {
  const step = 37, columns = Math.ceil(width / step) + 2, rows = Math.ceil(height / step) + 2;
  const random = rifleRandom(31314);
  const cells = Array.from({ length: columns * rows }, (_, i) => ({
    x: (i % columns - 1 + .16 + random() * .68) * step,
    y: (Math.floor(i / columns) - 1 + .16 + random() * .68) * step,
  }));
  return rifleTexture(THREE, width, height, ctx => {
    const image = ctx.createImageData(width, height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const row = Math.floor(y / step), col = Math.floor(x / step);
        let nearest = Infinity, second = Infinity;
        const warp = 2.9 * Math.sin(y * .13) + 1.3 * Math.sin(x * .25);
        for (let cy = row; cy <= row + 2; cy++) {
          for (let cx = col; cx <= col + 2; cx++) {
            const cell = cells[cy * columns + cx];
            const d = (x + warp - cell.x) ** 2 + (y - cell.y) ** 2;
            if (d < nearest) { second = nearest; nearest = d; }
            else second = Math.min(second, d);
          }
        }
        const edge = Math.sqrt(second) - Math.sqrt(nearest);
        const glow = Math.max(0, 1 - edge / 2.8);
        const pixel = 4 * (y * width + x);
        image.data[pixel] = Math.round(255 * glow);
        image.data[pixel + 1] = Math.round(67 * glow * glow);
        image.data[pixel + 2] = Math.round(8 * glow);
        image.data[pixel + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);
  });
}

function royalMark(ctx) {
  const ink = '#6c4a2c';
  stroke(ctx, [[171, 59], [212, 41], [255, 42], [291, 56], [252, 71], [213, 72], [171, 59]], ink, 5);
  ring(ctx, 235, 56, 11, ink, 4);
  stroke(ctx, [[249, 69], [244, 91], [226, 106], [208, 100], [216, 91]], ink, 5);
  stroke(ctx, [[267, 66], [270, 87], [282, 95]], ink, 5);
  for (const x of [29, 70, 113, 328, 370, 416, 456]) {
    ring(ctx, x + 6, 52, 8, ink, 2);
    stroke(ctx, [[x - 7, 85], [x + 6, 66], [x + 20, 85], [x - 7, 85]], ink, 3);
  }
}

function gothicMark(ctx) {
  const silver = '#dbccd1';
  for (let x = 22; x < width; x += 43) {
    ctx.strokeStyle = silver; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(x - 13, 103); ctx.bezierCurveTo(x - 13, 85, x - 12, 75, x, 67);
    ctx.bezierCurveTo(x + 12, 75, x + 13, 85, x + 13, 103); ctx.closePath(); ctx.stroke();
  }
  ring(ctx, 251, 45, 26, silver, 2);
  for (let i = 0; i < 8; i++) {
    const a = i * tau / 8;
    ring(ctx, 251 + Math.cos(a) * 14, 45 + Math.sin(a) * 14, 8, silver, 2);
  }
  stroke(ctx, [[16, 15], [197, 15], [212, 26]], silver);
  stroke(ctx, [[301, 26], [318, 15], [496, 15]], silver);
}

export function rifleFinish(THREE, id, skin) {
  const map = rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(74106);
    const paint = ctx.createLinearGradient(0, 0, 0, height);
    paint.addColorStop(0, skin.base); paint.addColorStop(.46, skin.base); paint.addColorStop(1, skin.dark);
    ctx.fillStyle = paint; ctx.fillRect(0, 0, width, height);
    switch (id) {
      case 'underground-lab':
        stains(ctx, rand, ['#66532b73', '#72803696', '#292b33a1'], 68, 20);
        hazard(ctx, 0, 5, 512, 23); hazard(ctx, 270, 96, 242, 19);
        biohazard(ctx, 226, 63); type(ctx, 'BIO / LAB-01', 22, 73, '#373b32');
        type(ctx, 'SPECIMEN', 293, 69, '#393e30', 22);
        break;
      case 'shanhai-secret-realm':
        stains(ctx, rand, ['#24584be8', '#63a688bb', '#55331dcc'], 133, 22);
        bronzePattern(ctx, '#d9a878');
        break;
      case 'rain-city':
        stains(ctx, rand, ['#9f421cdc', '#321f1bca', '#1c2839ca', '#cc7233b0'], 83, 29);
        flecks(ctx, rand, ['#949b8980', '#291c1870'], 240, 8);
        ctx.save(); ctx.translate(218, 75); ctx.rotate(-.11);
        type(ctx, '下城制造', -94, 7, '#a6d0ca', 41);
        stroke(ctx, [[-97, 17], [45, 22], [92, 10]], '#af633d', 5); ctx.restore();
        for (let i = 0; i < 72; i++) {
          const x = rand() * width, y = rand() * height;
          stroke(ctx, [[x, y], [x + 2, y + 5 + rand() * 45]], '#cae2f239', 1.3);
        }
        break;
      case 'buried-tomb':
        flecks(ctx, rand, ['#ffecc38c', '#70502a6b', '#b996546e'], 2100, 4);
        royalMark(ctx);
        break;
      case 'polar-station':
        ctx.fillStyle = '#e97029'; ctx.fillRect(8, 34, 205, 55);
        type(ctx, 'ARC / 05', 20, 71, '#252c30', 35); type(ctx, 'POLAR SURVEY', 237, 70, '#10223b', 23);
        stains(ctx, rand, ['#e1f5ff90', '#f3fbffb0'], 100, 14);
        flecks(ctx, rand, ['#f0f8ffc9', '#c3e8ffc0', '#527a986e'], 660, 4);
        break;
      case 'drowned-city':
        for (let i = 0; i < 44; i++) {
          const x = rand() * width, y = rand() * height;
          ring(ctx, x, y, 1 + rand() * 7, '#eef4e48c');
          stroke(ctx, [[x, y + 12], [x + 8, y], [x + 6, y - 12], [x + 16, y - 24]], '#39847f70', 2);
        }
        type(ctx, 'ABYSS', 173, 81, '#e1f2e4', 29);
        break;
      case 'ember-fortress':
        stains(ctx, rand, ['#87738465', '#060507d9'], 125, 18);
        flecks(ctx, rand, ['#b78b7f52', '#181218aa'], 300, 4);
        break;
      case 'derelict-station':
        hazard(ctx, 332, 78, 149, 35);
        type(ctx, 'OS-08', 21, 78, '#25394e', 44);
        type(ctx, 'ORBITAL SYSTEMS', 232, 55, '#244a70', 22);
        for (let x = 232; x < 486; x += 28) ring(ctx, x, 18, 5, '#4d7291');
        for (let i = 0; i < 62; i++) {
          const x = rand() * width, y = rand() * height;
          stroke(ctx, [[x, y], [x + 8 + rand() * 14, y - 4]], '#f5faff85', 1);
        }
        break;
      case 'neon-undercity':
        for (let y = 0; y < height; y += 8) {
          for (let x = 0; x < width; x += 8) {
            const warp = ((x + y) / 8) % 2;
            ctx.fillStyle = warp ? '#313140' : '#181923'; ctx.fillRect(x, y, 8, 8);
            ctx.fillStyle = warp ? '#474657' : '#252733';
            ctx.fillRect(x + (warp ? 1 : 0), y + (warp ? 0 : 1), warp ? 2 : 8, warp ? 8 : 2);
          }
        }
        ctx.fillStyle = '#623055'; ctx.fillRect(49, 33, 161, 54);
        type(ctx, '義体工房', 63, 71, '#fcc6f5', 31); type(ctx, '電脳 / 09', 264, 73, '#a5fff5', 27);
        break;
      case 'jungle-temple':
        stains(ctx, rand, ['#a9e49cbf', '#12746cbf', '#cde8a777'], 100, 28);
        jadePattern(ctx, '#cfdda3');
        break;
      case 'bloodmoon-castle':
        gothicMark(ctx);
        break;
    }
    flecks(ctx, rand, ['#fff8e03d', '#10151d30'], 330, 4);
    stroke(ctx, [[0, 4], [width, 4]], '#eee0c290', 2);
    stroke(ctx, [[0, 123], [width, 123]], '#211c2270', 2);
  });
  const pattern = id === 'shanhai-secret-realm' ? bronzePattern : id === 'jungle-temple' ? jadePattern : null;
  return {
    map,
    normalMap: pattern ? normalPattern(THREE, pattern) : null,
    emissiveMap: id === 'ember-fortress' ? voronoi(THREE) : null,
  };
}

export function rifleWood(THREE, base) {
  return rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(7196);
    ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
    for (let i = 0; i < 145; i++) {
      const y = rand() * height, wave = rand() * 20 - 10;
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(124, y + wave, 294, y - wave, width, y + wave * .4);
      ctx.strokeStyle = i % 3 ? '#17101480' : '#f6ac634e';
      ctx.lineWidth = .4 + rand() * 1.9; ctx.stroke();
    }
  });
}

export function rifleFrost(THREE, base) {
  return rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(7943);
    ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
    stains(ctx, rand, ['#e4f6ffe8', '#aacde6a7'], 110, 24);
    flecks(ctx, rand, ['#ffffffaf', '#a8d1f1b0', '#f1faffdc'], 1400, 6);
  });
}

<script type="text/plain" data-level-module="@level-kit/runtime.mjs">
import { makeConfig } from '@level-kit/config.mjs';
import { createWorld, createGrid } from '@level-kit/world.mjs';
import { createRendering } from '@level-kit/rendering.mjs';
import { createEffectClasses } from '@level-kit/effects.mjs';
import { createSoundClass } from '@level-kit/audio.mjs';
import { createBeastClasses } from '@level-kit/beasts.mjs';
import { createPlayerClass } from '@level-kit/player.mjs';
import { createPickupClass } from '@level-kit/pickups.mjs';
import { createWeaponClass } from '@level-kit/weapon.mjs';
import { rifleSkins, resolveRifleSkin } from '@level-kit/rifle-skins.mjs';
import { createUIClass } from '@level-kit/ui.mjs';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

export function startLevel(definition, campaign = null, campaignStage = 0) {
  if (typeof definition?.buildMap !== 'function') throw new TypeError('关卡需要实现 buildMap()');
  const $ = id => document.getElementById(id);
  const canvas = $('world');
  const menus = $('menu');
  const CONFIG = makeConfig(definition.config, campaignStage);
  const GRID = createGrid(definition.grid, CONFIG.map.cell);
  const visual = createRendering({ CONFIG, definition, canvas });
  const { THREE, scene, camera, renderer, composer, bloom, weaponCamera, weaponPass } = visual;
  const { clamp, lerp } = THREE.MathUtils;
  const V3 = THREE.Vector3;
  const TAU = Math.PI * 2;
  const Y_AXIS = new V3(0, 1, 0);
  const workColor = new THREE.Color();
  const brighter = (color, power = 1) => new THREE.Color(color).multiplyScalar(power);
  const randomRange = (a, b) => lerp(a, b, Math.random());
  const palette = definition.palette ?? {};
  const colors = {
    projectileTint: brighter(palette.projectile ?? 0x9bfa48, 2.3),
    ichor: new THREE.Color(palette.ichor ?? 0x9b4763),
    spark: brighter(palette.spark ?? 0xffc280, 3.3),
    coreTint: brighter(palette.core ?? 0xffa064, 2.6),
    rareTint: brighter(palette.rare ?? 0x84eccc, 1.7),
    ammoTint: brighter(palette.ammo ?? 0x7fc8ed, 1.1),
  };
  const TEXT = makeText(definition);
  const context = {
    ...visual, CONFIG, GRID, definition, TEXT, colors, $, clamp, lerp, V3, TAU, Y_AXIS,
    brighter, workColor, randomRange, seededRandom,
  };
  document.title = definition.pageTitle ?? TEXT.title;
  const { Level, Navigation } = createWorld(context);
  const { Effects, Rift, Projectiles } = createEffectClasses(context);
  const { BeastManager } = createBeastClasses(context);
  const Sound = createSoundClass(context);
  const Player = createPlayerClass(context);
  const Pickups = createPickupClass(context);
  const WeaponSystem = createWeaponClass(context);
  const UI = createUIClass(context);

  const level = new Level();
  const mapData = definition.buildMap({ ...context, level });
  const gate = definition.portal ?? {};
  const gateShield = gate.shield === false ? null : level.box(level.gate.x, level.gate.z,
    gate.width ?? 4.05, gate.depth ?? 0.15, level.gate.y + 0.10, level.gate.y + (gate.height ?? 4.72));

  const look = new THREE.PerspectiveCamera();
  const controls = new PointerLockControls(look, canvas);
  controls.pointerSpeed = CONFIG.player.mouseSpeed;
  controls.minPolarAngle = 0.04;
  controls.maxPolarAngle = Math.PI - 0.04;

  const input = {
    down: new Set(), fire: false, jump: false, reload: false, interact: false,
    clear() { this.down.clear(); this.fire = this.jump = this.reload = this.interact = false; },
  };
  const sound = new Sound(), effects = new Effects();
  const environment = definition.createEnvironment?.({ ...context, level, mapData, sound });
  const rift = definition.createPortal?.({ ...context, level, mapData, sound }) ?? new Rift(level.gate);
  const player = new Player(level, look), beasts = new BeastManager(level, nav);
  const projectiles = new Projectiles(level, effects), pickups = new Pickups(level, effects);
  const skinId = resolveRifleSkin(campaign?.equippedSkin, resolveRifleSkin(definition.weaponSkin));
  const weapon = new WeaponSystem(skinId), ui = new UI(level);
  $('rifle-label').textContent = rifleSkins[skinId].name;
  const burstPoint = new V3();
  const blastTint = brighter(palette.blast ?? 0xb78cff, 2.8);
  const encounter = definition.createEncounter?.({ ...context, level, mapData, sound });

  const game = {
    level, player, beasts, pickups, weapon, effects, sound, projectiles, ui, encounter,
    phase: 'ready', time: 0, kills: 0, core: false, bossDead: false, loot: [], value: 0,
    hitStop: 0, shotAt: -Infinity, shotX: 0, shotY: 0, shotZ: 0,
    footstep: { at: -Infinity, x: 0, y: 0, z: 0, radius: 0 }, blast: 0, blastClock: 0,
    threat: Infinity, threatDelay: 0,
    reset() {
      campaign?.reset();
      this.time = 0; this.kills = 0; this.core = false; this.bossDead = false; this.loot.length = 0; this.value = 0;
      this.shotAt = -Infinity; this.footstep.at = -Infinity; encounter?.reset?.(); this.hitStop = 0; this.blast = 0; this.blastClock = 0;
      this.threat = Infinity; this.threatDelay = 0;
      if (gateShield) gateShield.active = true;
      player.reset(); beasts.reset(player); projectiles.reset(); effects.reset(); pickups.reset(); weapon.reset(); ui.reset();
      input.clear();
    },
    ready() { return this.kills >= CONFIG.beasts.killsToWin && this.bossDead && this.core; },
    nearGate() {
      return Math.abs(player.y - level.gate.y) < (gate.verticalRange ?? 2) && Math.hypot(player.x - level.gate.x, player.z - level.gate.z) < (gate.useRadius ?? 4.55);
    },
    trigger() {
      if (!this.ready() || !this.nearGate() || this.blast > 0) return;
      this.blast = 0.001; this.blastClock = 0;
      if (gateShield) gateShield.active = false;
      sound.blast();
      burstPoint.copy(level.gate); burstPoint.y += 1.8;
      effects.spray(burstPoint, colors.coreTint, 150, 15.5, 0.15, 'spark');
      burstPoint.y += 0.45;

      this.hitStop -= frozen;

        player.update(dt - frozen, input, this);
        if (input.interact) {
          input.interact = false;
          if (this.nearGate()) {
            if (!this.ready()) ui.notify(TEXT.locked, 1.55);
            this.trigger();
          } else {
            encounter?.interact?.(this);
          }
        }
        if (!this.blast) {
          player.positionCamera(0);
          weapon.update(dt, input, this);
          if (encounter?.beastsDisabled) beasts.fadeHitFlashes(dt);
          else beasts.update(dt - frozen, player, this);
          projectiles.update(dt - frozen, player, this);
          if (this.phase !== 'play') return;
          pickups.update(dt, player, this);
          if (this.threat < 8.1 && this.threatDelay <= 0 && !player.protected(this)) {
            sound.tone(65, 47, 0.35, clamp((9 - this.threat) * 0.022, 0.035, 0.18), 'sine');
            this.threatDelay = clamp(0.52 + this.threat * 0.10, 0.56, 1.4);

        this.blastClock += dt;
        this.blast = clamp(this.blastClock / CONFIG.effects.gateDuration, 0.001, 1);
        player.shake = Math.max(player.shake, (1 - this.blast) * 0.70);
        if (this.blast >= 1) this.finish(true);
      }
      effects.update(dt);
      player.positionCamera(dt);
      weapon.render(dt, player, this);
      ui.update(dt, this);
    },
  };

  function pause() {
    if (game.phase !== 'play') return;
    game.phase = 'pause';
    input.clear(); sound.active(false);
    ui.menu('pause', game);
  }

  function startGame() {
    if (!canvas.requestPointerLock) {
      ui.text('menu-status', '此浏览器无法锁定鼠标，请使用支持 Pointer Lock 的桌面浏览器。');
      return;
    }
    if (document.pointerLockElement === canvas) return;
    ui.text('menu-status', '');
    try {
      // r160 控制器不返回锁定请求。直接在点击事件里发起请求，兼容有无 Promise 的实现。
      const result = canvas.requestPointerLock();
      result?.catch(lockError);
      sound.open();
    } catch {
      lockError();
    }
  }

  function lockError() {
    ui.text('menu-status', '鼠标锁定未成功。请聚焦此窗口，再点击进入游戏。');
  }

  controls.addEventListener('lock', () => {
    if (game.phase !== 'pause') game.reset();
    if (menus.open) menus.close();
    game.phase = 'play';
    ui.nodes.hud.hidden = false;
    weapon.group.visible = game.blast === 0;
    sound.active(true);
    ui.update(0, game);
  });
  controls.addEventListener('unlock', pause);
  document.addEventListener('pointerlockerror', lockError);
  menus.addEventListener('cancel', event => event.preventDefault());
  $('start').addEventListener('click', startGame);
  $('sound').addEventListener('click', () => {
    sound.toggle();
    $('sound').setAttribute('aria-pressed', String(sound.enabled));
    ui.text('sound', sound.enabled ? '音效开启' : '音效关闭');
  });

  const capturedKeys = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'KeyE', 'Space', 'ShiftLeft', 'ShiftRight']);
  if (CONFIG.player.crouch) capturedKeys.add('KeyC');
  document.addEventListener('keydown', event => {
    if (game.phase !== 'play') return;
    if (event.code === 'Escape' && document.pointerLockElement === canvas) {
      event.preventDefault(); controls.unlock(); return;
    }
    if (!capturedKeys.has(event.code)) return;
    event.preventDefault();
    input.down.add(event.code);
    if (event.repeat) return;
    if (event.code === 'KeyR') input.reload = true;
    if (event.code === 'Space') input.jump = true;
    if (event.code === 'KeyE') input.interact = true;
  });
  document.addEventListener('keyup', event => input.down.delete(event.code));
  document.addEventListener('mousedown', event => {
    if (event.button !== 0 || game.phase !== 'play' || document.pointerLockElement !== canvas) return;
    event.preventDefault(); input.fire = true;
  });
  document.addEventListener('mouseup', event => { if (event.button === 0) input.fire = false; });
  window.addEventListener('blur', input.clear.bind(input));
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  function resize() {
    const width = canvas.clientWidth || window.innerWidth, height = canvas.clientHeight || window.innerHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, CONFIG.graphics.maxPixelRatio);
    camera.aspect = weaponCamera.aspect = width / height;
    camera.updateProjectionMatrix(); weaponCamera.updateProjectionMatrix();
    renderer.setPixelRatio(ratio); renderer.setSize(width, height, false);
    composer.setPixelRatio(ratio); composer.setSize(width, height);
    bloom.setSize(width * ratio * CONFIG.graphics.bloomScale, height * ratio * CONFIG.graphics.bloomScale);
  }

  let lastFrame = 0, worldTime = 0, requested = 0;
  function animate(now) {
    requested = 0;
    if (document.hidden) return;
    const dt = lastFrame ? clamp((now - lastFrame) / 1000, 0, 0.040) : 0;
    lastFrame = now;
    worldTime += dt;
    // 失焦时暂停模拟和 WebGL 绘制，重新进入页面不补算隐藏期间的时间。
    if (game.phase === 'play') game.step(dt);
    if (game.phase === 'play' || game.phase === 'pause' || game.phase === 'win' || game.phase === 'fail') {
      beasts.render(game.phase === 'play' && !game.encounter?.beastsDisabled ? dt : 0, game.time, game.encounter?.beastsDisabled);
    }
    pickups.render(game.phase === 'ready' ? worldTime : game.time);
    environment?.update(worldTime, game.phase === 'play', game);
    rift.update(worldTime, game.ready(), game.blast);
    renderer.info.reset();
    weaponPass.enabled = weapon.group.visible;
    composer.render(dt);
    requested = requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (requested) cancelAnimationFrame(requested);
      requested = 0; lastFrame = 0;
      pause();
      if (document.pointerLockElement === canvas) controls.unlock();
      if (sound.ctx?.state === 'running') sound.ctx.suspend().catch(() => {});
    } else if (!requested) {
      requested = requestAnimationFrame(animate);
    }
  });
  pickups.reset();
  resize();
  $('start').disabled = false;
  ui.menu('ready', game);
  requested = requestAnimationFrame(animate);

  return { game, scene, camera, renderer, config: CONFIG, grid: GRID, nav };
}

function seededRandom(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function makeText(definition) {
  const theme = definition.text ?? {};
  const enemy = theme.enemy ?? '凶兽';
  const keyItem = theme.keyItem ?? '关键道具';
  const portal = theme.portal ?? '传送门';
  const loot = theme.loot ?? '宝物';
  const bossName = theme.bossName ?? '首领凶兽';
  return {
    tag: '地图关卡', title: '走位射击', enter: '进入关卡',
    brief: '沿开阔路线边打边退，击杀凶兽，夺取关键道具并引爆传送门，带走沿途找到的宝物。',
    pauseBrief: '返回地图后，战斗会从暂停处继续。',
    winBrief: `你已引爆${portal}，带着搜集到的${loot}成功撤离。`,
    failBrief: `你在战斗中倒下，本局拾取的${loot}已丢失。`,
    objective: `清除${enemy}，击杀${bossName}并夺取${keyItem}`,
    exitObjective: `前往${portal}，按 E 引爆`,
    detonating: `${portal}屏障崩解中`,
    coreCollected: `已取得${keyItem}，前往${portal}`,
    bossDefeated: `${bossName}已倒下，靠近拾取${keyItem}`,
    rage: `${bossName}狂暴，群攻体正在聚集`,
    locked: `解除封印需要达到击杀目标并取得${keyItem}`,
    safe: '出生安全区',
    enemy, portal, bossName, keyItem, loot,
    ...theme,
  };
}
</script>
<script type="text/plain" data-level-module="@level-kit/ui.mjs">
export function createUIClass({ CONFIG, GRID, TEXT, $, V3, TAU, definition }) {
  class UI {
    constructor(level) {
      this.level = level;
      this.nodes = {};
      for (const name of ['menu', 'menu-title', 'menu-tag', 'menu-text', 'loot-title', 'boss-title', 'menu-status', 'guide', 'summary', 'start', 'sound', 'hud', 'area', 'objective', 'kills', 'loot',
        'map', 'boss', 'boss-phase', 'boss-health', 'health', 'hp', 'stamina', 'energy', 'condition', 'condition-title', 'condition-time', 'condition-meter', 'condition-detail', 'hud-announcement', 'crouch-help', 'posture', 'ammo', 'reserve', 'weapon-state', 'cross', 'message', 'injury', 'blast']) this.nodes[name] = $(name);
      this.ctx = this.nodes.map.getContext('2d');
      this.size = this.nodes.map.width;
      this.facing = new V3();
      this.tick = 0; this.hitTime = 0; this.noticeTime = 0;
      this.base = document.createElement('canvas');
      this.base.width = this.base.height = this.size;
      this.drawBase();
      this.text('menu-tag', TEXT.tag);
      this.text('loot-title', TEXT.loot);
      this.text('boss-title', TEXT.bossName);
      this.nodes.boss.setAttribute('aria-label', TEXT.bossName + '状态');
      this.nodes['boss-health'].setAttribute('aria-label', TEXT.bossName + '生命值');
      this.nodes['crouch-help'].hidden = !CONFIG.player.crouch;
      this.nodes.health.max = CONFIG.player.health;
      this.nodes.stamina.max = CONFIG.player.stamina;
      this.nodes['boss-health'].max = CONFIG.beasts.types[3].hp;
    }
    px(x) { return (x + GRID.halfX) / (GRID.halfX * 2) * this.size; }
    pz(z) { return (z + GRID.halfZ) / (GRID.halfZ * 2) * this.size; }
    drawBase() {
      const ctx = this.base.getContext('2d'), size = this.size;
      ctx.fillStyle = '#152735'; ctx.fillRect(0, 0, size, size);
      const style = definition.minimap ?? {};
      const draw = { ctx, px: x => this.px(x), pz: z => this.pz(z), size };
      style.beforeTiles?.(draw);
      const palette = style.tiles ?? { '#': '#3a556b' };
      const w = size / GRID.columns, h = size / GRID.rows;
      for (let row = 0; row < GRID.rows; row++) {
        for (let column = 0; column < GRID.columns; column++) {
          const color = palette[GRID.cells[row][column]];
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(column * w + 0.42, row * h + 0.42, Math.max(0, w - 0.84), Math.max(0, h - 0.84));
        }
      }
      style.afterTiles?.(draw);
      ctx.strokeStyle = '#6d95bf2d'; ctx.lineWidth = 1;
      for (let i = 36; i < size; i += 36) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
      }
      ctx.fillStyle = '#ffb171'; ctx.fillRect(this.px(this.level.gate.x) - 3, this.pz(this.level.gate.z) - 3, 6, 6);
      ctx.fillStyle = '#a1a086'; ctx.fillRect(this.px(this.level.bossAnchor.x) - 2, this.pz(this.level.bossAnchor.z) - 2, 4, 4);
    }
    drawMap(game) {
      const ctx = this.ctx;
      ctx.drawImage(this.base, 0, 0);
      definition.minimap?.overlay?.({ ctx, px: x => this.px(x), pz: z => this.pz(z), game });
      for (const b of game.beasts.pool) {
        if (!b.active) continue;
        ctx.fillStyle = b.type === 3 ? '#ff9a71' : '#f45f76';
        ctx.beginPath(); ctx.arc(this.px(b.x), this.pz(b.z), b.type === 3 ? 3.2 : 1.5, 0, TAU); ctx.fill();
      }
      if (game.bossDead && !game.core) {
        const core = game.pickups.objects.find(item => item.active && item.kind === 'core');
        if (core) {
          ctx.strokeStyle = '#ffd89a'; ctx.strokeRect(this.px(core.x) - 3, this.pz(core.z) - 3, 6, 6);
        }
      }
      this.facing.set(0, 0, -1).applyQuaternion(game.player.look.quaternion);
      ctx.save();
      ctx.translate(this.px(game.player.x), this.pz(game.player.z));
      ctx.rotate(Math.atan2(this.facing.x, -this.facing.z));
      ctx.fillStyle = '#b0fff0'; ctx.strokeStyle = '#102738'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4.6, 5); ctx.lineTo(0, 2.5); ctx.lineTo(-4.6, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    text(name, value) {
      if (this.nodes[name].textContent !== value) this.nodes[name].textContent = value;
    }
    notify(text, duration) {
      this.notice = text; this.noticeTime = duration;
      this.text('hud-announcement', text);
    }
    hit(kind) {
      this.nodes.cross.dataset.hit = kind;
      this.hitTime = kind === 'kill' ? 0.20 : 0.12;
    }
    reset() {
      this.tick = 0; this.hitTime = 0; this.noticeTime = 0;
      this.nodes.cross.dataset.hit = '';
      this.nodes.blast.style.opacity = '0'; this.nodes.injury.style.opacity = '0';
      this.nodes.message.hidden = true; this.nodes.boss.hidden = true;
      this.nodes.condition.hidden = true; this.nodes.posture.hidden = true;
      this.nodes.hud.removeAttribute('data-offline');
      this.text('hud-announcement', '');
    }
    update(dt, game) {
      if (this.hitTime > 0) {
        this.hitTime -= dt;
        if (this.hitTime <= 0) this.nodes.cross.dataset.hit = '';
      }
      this.noticeTime -= dt;
      if (this.noticeTime <= 0) this.text('hud-announcement', '');
      const { player: p, weapon: w } = game;
      this.nodes.injury.style.opacity = (p.damageVignette * 0.81).toFixed(3);
      const blast = game.blast;
      this.nodes.blast.style.opacity = blast > 0 && blast < 1 ? String(Math.sin(blast ** 0.47 * Math.PI) * 0.86) : '0';
      this.tick -= dt;
      if (this.tick > 0) return;
      this.tick = 0.062;
      const condition = game.encounter?.status;
      this.nodes.condition.hidden = !condition;
      if (condition) {
        this.text('condition-title', condition.title);
        const meter = this.nodes['condition-meter'];
        meter.hidden = !Number.isFinite(condition.value);
        if (!meter.hidden) meter.value = condition.value;
        const readout = condition.readout ?? (Number.isFinite(condition.remaining) ? Math.max(0, Math.ceil(condition.remaining)) + ' 秒' : '');
        this.text('condition-time', readout);
        this.text('condition-detail', condition.detail);
      }
      const offline = game.encounter?.hudOffline === true;
      this.nodes.hud.toggleAttribute('data-offline', offline);
      if (offline) return;
      this.text('area', this.level.area(p.x, p.z, p.y));
      this.text('hp', String(Math.ceil(p.hp)));
      this.text('energy', String(Math.ceil(p.energy)));
      this.nodes.posture.hidden = !p.crouched;
      this.nodes.health.value = p.hp; this.nodes.stamina.value = p.energy;
      this.text('ammo', String(w.ammo).padStart(2, '0'));
      this.text('reserve', '/ ' + w.reserve);
      this.text('weapon-state', w.reloadLeft > 0 ? '换弹中 ' + (Math.ceil(w.reloadLeft * 10) / 10).toFixed(1) + ' 秒' : w.ammo === 0 ? (w.reserve ? '按 R 换弹' : '弹药耗尽') : '');
      this.nodes.cross.style.setProperty('--gap', (7 + w.heat * 12 + (p.sprinting ? 5 : 0)).toFixed(1) + 'px');
      this.text('loot', game.loot.length + ' / ' + (definition.loot?.length ?? 0));
      this.text('kills', game.kills + ' / ' + CONFIG.beasts.killsToWin);
      const remaining = Math.max(0, CONFIG.beasts.killsToWin - game.kills);
      const objective = blast ? TEXT.detonating : game.ready() ? TEXT.exitObjective :
        game.core ? `已取得${TEXT.keyItem}，还需击杀 ${remaining} 只${TEXT.enemy}` :
          game.bossDead ? '靠近掉落物，拾取' + TEXT.keyItem : TEXT.objective;
      this.text('objective', objective);
      const boss = game.beasts.boss;
      this.nodes.boss.hidden = !boss || Math.hypot(boss.x - p.x, boss.z - p.z) > 28;
      if (!this.nodes.boss.hidden) {
        this.text('boss-phase', boss.rage ? '狂暴' : '第一阶段');
        this.nodes['boss-health'].value = Math.max(boss.hp, 0);
      }
      let note = !blast && this.noticeTime > 0 ? this.notice : '';
      if (game.nearGate()) {
        if (game.ready() && !game.blast) note = '按 E 引爆' + TEXT.portal;
        else if (!note && !game.blast) note = ['屏障封印', remaining ? '还需击杀 ' + remaining + ' 只' : '', game.core ? '' : '需要' + TEXT.keyItem].filter(Boolean).join(' / ');
      } else if (!note && !blast) {
        note = game.encounter?.interactionHint?.(game) ??
          (p.protected(game) ? TEXT.safe + ' / ' + Math.max(0, Math.ceil(CONFIG.player.safeTime - game.time)) + ' 秒' : '');
      }
      this.nodes.message.hidden = !note;
      if (note) this.text('message', note);
      this.drawMap(game);
    }
    menu(mode, game) {
      const overlay = this.nodes.menu;
      this.text('menu-title', mode === 'pause' ? '行动暂停' : mode === 'win' ? '撤离成功' : mode === 'fail' ? '撤离失败' : TEXT.title);
      this.text('menu-text', mode === 'pause' ? TEXT.pauseBrief : mode === 'win' ? TEXT.winBrief : mode === 'fail' ? TEXT.failBrief : TEXT.brief);
      this.text('start', mode === 'pause' ? '继续游戏' : mode === 'ready' ? TEXT.enter : '再来一局');
      this.text('menu-status', '');
      const ended = mode === 'win' || mode === 'fail';
      this.nodes.guide.hidden = ended;
      this.nodes.summary.hidden = !ended;
      if (ended) this.text('summary', '累计击杀 ' + game.kills + ' 只 / 带回 ' + game.loot.length + ' 件' + TEXT.loot + ' / 结算价值 ' + game.value);
      if (!overlay.open) overlay.showModal();
      this.nodes.start.focus({ preventScroll: true });
    }
  }

  return UI;
}
</script>
<script type="text/plain" data-level-module="@level-kit/weapon.mjs">
import { createRifle } from '@level-kit/rifle-model.mjs';

export function createWeaponClass({ CONFIG, THREE, V3, TAU, camera, weaponScene, definition, shapes, brighter, lerp, randomRange, colors }) {
  const { spark } = colors;
  const nativeSkin = definition.weaponSkin;
  const bloodMoonLevel = nativeSkin === 'shanhai-secret-realm' || nativeSkin === 'bloodmoon-castle';

  class WeaponSystem {
    constructor(skinId) {
      this.group = new THREE.Group();
      weaponScene.add(this.group);
      this.rifle = createRifle(skinId);
      this.rifle.root.rotation.y = Math.PI / 2;
      this.group.add(this.rifle.root);
      this.signals = {};
      this.empRecovery = 0;
      const glove = new THREE.MeshStandardMaterial({ color: 0x35373b, roughness: .86 });
      const sleeve = new THREE.MeshStandardMaterial({ color: 0x313c46, roughness: .88 });
      function component(group, geo, mat, x, y, z, w = 1, h = 1, d = 1, pitch = 0, yaw = 0, roll = 0) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z); mesh.scale.set(w, h, d); mesh.rotation.set(pitch, yaw, roll);
        group.add(mesh);
        return mesh;
      }
      // 手套随第一人称武器移动，收藏预览只展示武器本身。
      const hand = (mat, ...args) => component(this.group, shapes.box, mat, ...args);
      hand(sleeve, .024, -.171, .19, .115, .125, .39, -.41, .17, -.1);
      hand(glove, .016, -.118, .132, .115, .095, .115, -.35, .18, -.12);
      hand(glove, -.047, -.071, -.49, .141, .072, .12, -.21, .22, .15);
      hand(sleeve, -.117, -.155, -.26, .116, .112, .43, -.39, .48);

      this.flashGroup = new THREE.Group(); this.group.add(this.flashGroup);
      this.flashGroup.position.copy(this.rifle.muzzle).applyAxisAngle(new V3(0, 1, 0), Math.PI / 2);
      const outer = new THREE.MeshBasicMaterial({ color: brighter(0xff9c48, 4), transparent: true, depthWrite: false });
      const inner = new THREE.MeshBasicMaterial({ color: brighter(0xffe8a4, 6), transparent: true, depthWrite: false });
      const star = new THREE.ConeGeometry(0.064, 0.24, 5);
      component(this.flashGroup, star, outer, 0, 0, -0.08, 1, 1, 1, -Math.PI / 2).renderOrder = 15;
      component(this.flashGroup, new THREE.OctahedronGeometry(0.050, 0), inner, 0, 0, -0.065, 1.32, 1.32, 3).renderOrder = 16;
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5;
        component(this.flashGroup, star, outer, Math.cos(a) * 0.039, Math.sin(a) * 0.039, -0.045, 0.45, 0.62, 0.45, -Math.PI / 2, Math.cos(a) * 0.62, Math.sin(a) * 0.57).renderOrder = 15;
      }
      this.dir = new V3(); this.origin = new V3(); this.end = new V3(); this.muzzle = new V3();
      this.reset();
    }
    reset() {
      this.ammo = CONFIG.weapon.magazine; this.reserve = CONFIG.weapon.reserve;
      this.heat = 0; this.cooldown = 0; this.reloadLeft = 0; this.kick = 0; this.flash = 0;
      this.emptyAt = -5;
      this.empRecovery = 0;
      this.signals.emp = false;
      this.flashGroup.visible = false;
      this.group.visible = false;
    }
    reload(game) {
      if (this.reloadLeft > 0 || this.ammo >= CONFIG.weapon.magazine || this.reserve <= 0) return;
      this.reloadLeft = CONFIG.weapon.reloadTime; game.sound.reload();
    }
    shoot(game) {
      const w = CONFIG.weapon, p = game.player;
      this.ammo--; this.heat = Math.min(1, this.heat + w.heatPerShot);
      this.kick = Math.min(0.21, this.kick + 0.081 + 0.028 * this.heat);
      this.flash = 0.047;
      p.recoil = Math.min(0.085, p.recoil + w.recoil * (1 + 1.1 * this.heat));
      p.recoilRoll += randomRange(-0.004, 0.004) * (1 + this.heat);
      game.shotAt = game.time; game.shotX = p.x; game.shotY = p.y; game.shotZ = p.z;
      game.sound.shoot();
      const spread = lerp(w.baseSpread, w.maxSpread, this.heat ** 1.25) * (p.sprinting ? 1.45 : 1);
      const a = randomRange(0, TAU), s = Math.sqrt(Math.random()) * spread;
      this.dir.set(Math.cos(a) * s, Math.sin(a) * s, -1).normalize().applyQuaternion(camera.quaternion);
      this.origin.copy(camera.position);
      const cover = game.level.hash.ray(this.origin, this.dir, w.range);
      let limit = game.level.hash.depth;
      if (this.dir.y < -0.009) {
        const floor = game.level.base(this.origin.x, this.origin.z);
        const t = (floor - this.origin.y) / this.dir.y;
        if (t > 0) {
          const depth = (game.level.base(this.origin.x + this.dir.x * t, this.origin.z + this.dir.z * t) - this.origin.y) / this.dir.y;
          limit = Math.min(limit, Math.max(0, depth));
        }
      }
      const hit = game.beasts.hash.ray(this.origin, this.dir, limit);
      this.end.copy(this.origin).addScaledVector(this.dir, game.beasts.hash.depth);
      this.group.updateWorldMatrix(true, true);
      camera.localToWorld(this.flashGroup.getWorldPosition(this.muzzle));
      const streakLength = this.muzzle.distanceTo(this.end);
      if (streakLength > 0.28) game.effects.streak(this.muzzle, this.end);
      if (hit) {
        const dead = game.beasts.takeHit(hit, w.damage, this.end, this.dir, game);
        game.sound.hit(dead);
        game.ui.hit(dead ? 'kill' : 'hit');
        game.hitStop = w.hitStop;
      } else if (cover || limit < w.range) {
        game.effects.spray(this.end, spark, 5, 3.2, 0.025, 'spark');
      }
    }
    update(dt, input, game) {
      this.cooldown = Math.max(-dt, this.cooldown - dt);
      this.heat = Math.max(0, this.heat - dt * CONFIG.weapon.heatRecovery * (input.fire && this.ammo > 0 && this.reloadLeft <= 0 ? 0.26 : 1));
      if (input.reload) { input.reload = false; this.reload(game); }
      if (this.reloadLeft > 0) {
        this.reloadLeft = Math.max(0, this.reloadLeft - dt);
        if (this.reloadLeft === 0) {
          const fill = Math.min(CONFIG.weapon.magazine - this.ammo, this.reserve);
          this.ammo += fill; this.reserve -= fill; game.sound.reload(true);
          this.cooldown = Math.max(0.08, this.cooldown);
        }
      }
      if (!input.fire) this.cooldown = Math.max(0, this.cooldown);
      if (input.fire && this.reloadLeft <= 0 && this.cooldown <= 0) {
        if (this.ammo > 0) {
          this.cooldown += 1 / CONFIG.weapon.fireRate;
          this.shoot(game);
        } else if (game.time - this.emptyAt > 0.45) {

      }
    }
    render(dt, player, game) {
      const emp = Boolean(game.level.empActive);
      if (this.signals.emp && !emp) this.empRecovery = .88;
      this.empRecovery = Math.max(0, this.empRecovery - dt);
      this.signals.bloodMoon = bloodMoonLevel && game.encounter?.phase === 'active';
      this.signals.tide = game.level.tide?.rifleTide;
      this.signals.emp = emp;
      this.signals.empRecovery = this.empRecovery;
      this.rifle.update(game.time, this.signals);
      this.kick *= Math.exp(-dt * 17);
      this.flash = Math.max(0, this.flash - dt);
      const cycle = this.reloadLeft > 0 ? Math.sin(Math.PI * this.reloadLeft / CONFIG.weapon.reloadTime) : 0;
      const sway = player.speedMix * Math.sin(player.bob);
      this.group.position.set(0.315 + sway * 0.028 + cycle * 0.075, -0.315 + sway * 0.023 - cycle * 0.29, -0.67 + this.kick * 0.8 + (player.sprinting ? 0.041 : 0));
      this.group.rotation.set(this.kick * 0.24 - cycle * 0.31, -0.045 + cycle * 0.26, -0.013 + player.sway * 0.026 - cycle * 0.62);
      this.rifle.magazine.position.y = -Math.sin(cycle * 1.56) * 0.18;
      this.flashGroup.visible = this.flash > 0;
      if (this.flashGroup.visible) {
        this.flashGroup.scale.setScalar(Math.max(0.55, this.flash * 18 + 0.25));
        this.flashGroup.rotation.z += 0.42;
      }
    }
  }

  return WeaponSystem;
}

<script type="text/plain" data-level-module="@level-kit/world.mjs">
// xz 空间哈希。静态掩体和每帧更新的凶兽使用同一套桶与射线遍历。
export class SpatialHash {
  constructor(size) {
    this.size = size;
    this.buckets = new Map();
    this.visited = 0;
    this.used = [];
  }
  key(x, z) { return x + z * 4096; }
  insert(item) {
    const s = this.size;
    for (let z = Math.floor(item.z0 / s); z <= Math.floor(item.z1 / s); z++) {
      for (let x = Math.floor(item.x0 / s); x <= Math.floor(item.x1 / s); x++) {
        const k = this.key(x, z);
        let list = this.buckets.get(k);
        if (!list) this.buckets.set(k, list = []);
        if (!list.length) this.used.push(list);
        list.push(item);
      }
    }
  }
  clear() {
    for (const list of this.used) list.length = 0;
    this.used.length = 0;
  }
  query(x0, z0, x1, z1, out) {
    out.length = 0;
    const mark = ++this.visited;
    const s = this.size;
    for (let z = Math.floor(z0 / s); z <= Math.floor(z1 / s); z++) {
      for (let x = Math.floor(x0 / s); x <= Math.floor(x1 / s); x++) {
        const list = this.buckets.get(this.key(x, z));
        if (!list) continue;
        for (const item of list) {
          if (item.mark === mark) continue;
          item.mark = mark;
          out.push(item);
        }
      }
    }
    return out;
  }
  ray(origin, direction, limit) {
    const s = this.size;
    let x = Math.floor(origin.x / s), z = Math.floor(origin.z / s);
    const sx = Math.sign(direction.x), sz = Math.sign(direction.z);
    let tx = sx ? ((x + (sx > 0 ? 1 : 0)) * s - origin.x) / direction.x : Infinity;
    let tz = sz ? ((z + (sz > 0 ? 1 : 0)) * s - origin.z) / direction.z : Infinity;
    const dx = sx ? Math.abs(s / direction.x) : Infinity;
    const dz = sz ? Math.abs(s / direction.z) : Infinity;
    const mark = ++this.visited;
    let hit = null, depth = limit, entered = 0;
    while (entered <= depth) {
      const list = this.buckets.get(this.key(x, z));
      if (list) {
        for (const item of list) {
          if (item.mark === mark || item.active === false) continue;
          item.mark = mark;
          const distance = rayBox(origin, direction, item);
          if (distance < depth) { depth = distance; hit = item; }
        }
      }
      if (tx < tz) { entered = tx; tx += dx; x += sx; }
      else { entered = tz; tz += dz; z += sz; }
    }
    this.depth = depth;
    return hit;
  }
}

export function rayBox(o, d, box) {
  let near = 0, far = Infinity;
  if (Math.abs(d.x) < 1e-8) {
    if (o.x < box.x0 || o.x > box.x1) return Infinity;
  } else {
    const a = (box.x0 - o.x) / d.x, b = (box.x1 - o.x) / d.x;
    near = Math.max(near, Math.min(a, b)); far = Math.min(far, Math.max(a, b));
  }
  if (Math.abs(d.y) < 1e-8) {
    if (o.y < box.y0 || o.y > box.y1) return Infinity;
  } else {
    const a = (box.y0 - o.y) / d.y, b = (box.y1 - o.y) / d.y;
    near = Math.max(near, Math.min(a, b)); far = Math.min(far, Math.max(a, b));
  }
  if (Math.abs(d.z) < 1e-8) {
    if (o.z < box.z0 || o.z > box.z1) return Infinity;
  } else {
    const a = (box.z0 - o.z) / d.z, b = (box.z1 - o.z) / d.z;
    near = Math.max(near, Math.min(a, b)); far = Math.min(far, Math.max(a, b));
  }
  return far >= near ? near : Infinity;
}

// 二维地图允许矩形。原点始终位于场景中央，行号沿 z 轴递增。
export function createGrid(source, cell) {
  if (!Array.isArray(source) || !source.length) throw new TypeError('关卡需要二维地图');
  const cells = source.map(row => typeof row === 'string' ? Array.from(row) : [...row]);
  const rows = cells.length, columns = cells[0].length;
  if (!columns || cells.some(row => row.length !== columns)) throw new RangeError('地图每行必须等宽');
  const halfX = columns * cell / 2, halfZ = rows * cell / 2;
  return {
    cells, rows, columns, halfX, halfZ, cell,
    x: column => (column + 0.5) * cell - halfX,
    z: row => (row + 0.5) * cell - halfZ,
  };
}

export function createWorld({ CONFIG, GRID, V3, clamp, definition }) {
  class Level {
    constructor() {
      this.hash = new SpatialHash(CONFIG.map.hash);
      this.solids = [];
      this.near = [];
      this.spawn = new V3();
      this.gate = new V3();
      this.bossAnchor = new V3();
      this.bossSpawn = new V3();
      this.spawnYaw = definition.spawnYaw ?? 0;
      this.spawnPitch = definition.spawnPitch ?? -0.012;
      this.sites = [];
      this.terrainRevision = 0;
    }
    box(x, z, width, depth, low, high, climb = false) {
      const b = { x0: x - width / 2, x1: x + width / 2, z0: z - depth / 2, z1: z + depth / 2,
        y0: low, y1: high, climb, mark: 0 };
      this.solids.push(b);
      this.hash.insert(b);
      return b;
    }
    base(x, z) { return definition.terrain?.ground?.(x, z) ?? 0; }
    ramp(x, z) { return definition.terrain?.ramp?.(x, z) ?? 0; }
    movementScale(x, z, y, game) { return definition.terrain?.moveScale?.(x, z, y, game) ?? 1; }
    inSafeZone(x, z, margin = 0) {
      return definition.inSafeZone?.(x, z, this.spawn, margin) ??
        Math.hypot(x - this.spawn.x, z - this.spawn.z) < CONFIG.player.safeRadius + margin;
    }
    surface(x, z, ceiling = Infinity) {
      let floor = this.base(x, z);
      const ramp = this.ramp(x, z);
      if (ramp && ramp <= ceiling) floor = Math.max(floor, ramp);
      const list = this.hash.query(x, z, x, z, this.near);
      for (const b of list) {
        if (b.active !== false && b.climb && b.y1 <= ceiling && b.y1 > floor && x >= b.x0 && x <= b.x1 && z >= b.z0 && z <= b.z1) floor = b.y1;
      }
      return floor;
    }
    blocked(x, z, y, radius, height) {
      if (x - radius <= -GRID.halfX || z - radius <= -GRID.halfZ || x + radius >= GRID.halfX || z + radius >= GRID.halfZ) return true;
      const list = this.hash.query(x - radius, z - radius, x + radius, z + radius, this.near);
      for (const b of list) {
        if (b.active === false) continue;
        if (x + radius > b.x0 && x - radius < b.x1 && z + radius > b.z0 && z - radius < b.z1 &&
            y + height > b.y0 + 0.025 && y < b.y1 - 0.025) return true;
      }
      return false;
    }
    foot(x, z, ceiling, radius) {
      let floor = this.surface(x, z, ceiling);
      const edge = radius + 0.021;
      floor = Math.max(floor, this.surface(x - edge, z, ceiling), this.surface(x + edge, z, ceiling));
      return Math.max(floor, this.surface(x, z - edge, ceiling), this.surface(x, z + edge, ceiling));
    }
    canEnter(body, x, z, y) {
      return definition.terrain?.canEnter?.(body, x, z, y, this) ?? true;
    }
    move(body, dx, dz, step) {
      const startX = body.x, startZ = body.z;
      // 先沿 x 再沿 z，墙角阻止其中一轴时仍可沿另一轴滑动。
      const nextX = body.x + dx;
      const fx = this.foot(nextX, body.z, body.y + step, body.radius);
      const moveY = Math.max(body.y, fx);
      if (fx <= body.y + step + 0.025 && !this.blocked(nextX, body.z, moveY, body.radius, body.height) &&
          this.canEnter(body, nextX, body.z, moveY)) {
        body.x = nextX;
        body.y = moveY;
      }
      const nextZ = body.z + dz;
      const fz = this.foot(body.x, nextZ, body.y + step, body.radius);
      const moveY2 = Math.max(body.y, fz);
      if (fz <= body.y + step + 0.025 && !this.blocked(body.x, nextZ, moveY2, body.radius, body.height) &&
          this.canEnter(body, body.x, nextZ, moveY2)) {
        body.z = nextZ;
        body.y = moveY2;
      }
      return Math.abs(startX - body.x) + Math.abs(startZ - body.z);
    }
    visible(origin, direction, distance) {
      return !this.hash.ray(origin, direction, distance);
    }
    area(x, z, y = 0) { return definition.area?.(x, z, this, y) ?? '探索区域'; }
  }

  class Navigation {
    constructor(level) {
      this.level = level;
      this.cell = CONFIG.map.navCell;
      this.width = Math.ceil(GRID.halfX * 2 / this.cell);
      this.height = Math.ceil(GRID.halfZ * 2 / this.cell);
      const count = this.width * this.height;
      this.walkable = new Uint8Array(count);
      this.dist = new Int32Array(count);
      this.queue = new Int32Array(count);
      for (let i = 0; i < count; i++) {
        const x = this.x(i), z = this.z(i);
        const y = level.surface(x, z, level.base(x, z) + 0.50);
        this.walkable[i] = !level.blocked(x, z, y, 0.52, 1.64);
        if (this.walkable[i] && i % 7 === 2) level.sites.push(i);
      }
      this.target = -1;
      this.terrainRevision = -1;
      this.routes = definition.terrain?.routeOpen ? new Uint8Array(count) : this.walkable;
    }
    x(i) { return (i % this.width + 0.5) * this.cell - GRID.halfX; }
    z(i) { return (Math.floor(i / this.width) + 0.5) * this.cell - GRID.halfZ; }
    index(x, z) {
      const row = clamp(Math.floor((z + GRID.halfZ) / this.cell), 0, this.height - 1);
      const column = clamp(Math.floor((x + GRID.halfX) / this.cell), 0, this.width - 1);
      return row * this.width + column;
    }
    rebuild(x, z) {
      const routes = this.routes;
      if (routes !== this.walkable && this.terrainRevision !== this.level.terrainRevision) {
        this.terrainRevision = this.level.terrainRevision;
        this.target = -1;
        for (let i = 0; i < routes.length; i++) {
          routes[i] = this.walkable[i] && definition.terrain.routeOpen(this.x(i), this.z(i), this.level);
        }
      }
      let start = this.index(x, z);
      if (!routes[start]) {
        let best = Infinity;
        for (let dz = -3; dz <= 3; dz++) {
          for (let dx = -3; dx <= 3; dx++) {
            const i = this.index(x + dx * this.cell, z + dz * this.cell);
            if (routes[i] && dx * dx + dz * dz < best) { best = dx * dx + dz * dz; start = i; }
          }
        }
      }
      if (this.target === start) return;
      this.target = start;
      this.dist.fill(-1);
      if (!routes[start]) return;
      this.dist[start] = 0;
      this.queue[0] = start;
      let head = 0, count = 1;
      const n = this.width;
      while (head < count) {
        const i = this.queue[head++], d = this.dist[i] + 1;
        const left = i % n > 0 ? i - 1 : -1;
        const right = i % n < n - 1 ? i + 1 : -1;
        const up = i - n, down = i + n;
        if (routes[left] && this.dist[left] < 0) { this.dist[left] = d; this.queue[count++] = left; }
        if (routes[right] && this.dist[right] < 0) { this.dist[right] = d; this.queue[count++] = right; }
        if (routes[up] && this.dist[up] < 0) { this.dist[up] = d; this.queue[count++] = up; }
        if (routes[down] && this.dist[down] < 0) { this.dist[down] = d; this.queue[count++] = down; }
      }
    }
    next(x, z) {
      const i = this.index(x, z), n = this.width;
      let best = i, cost = this.dist[i] < 0 ? Infinity : this.dist[i];
      const left = i % n > 0 ? i - 1 : -1;
      const right = i % n < n - 1 ? i + 1 : -1;
      for (const candidate of [left, right, i - n, i + n]) {
        const d = this.dist[candidate];
        if (d >= 0 && d < cost) { best = candidate; cost = d; }
      }
      return best;
    }
  }

  return { Level, Navigation };
}
</script>

    shader.vertexShader='varying vec3 seaPosition;\n'+shader.vertexShader.replace('#include <worldpos_vertex>',`

    ctx.fillStyle='#526e70';ctx.fillRect(0,0,w,h);

    for(let i=0;i<8;i++){
      const x=i*32+16;

      ctx.lineTo(x,h/2+17);ctx.closePath();ctx.stroke();
      ctx.fillStyle='#a5bba0';ctx.fillRect(x-1,h/2-3,3,6);
    }
  });
  const material={
    floor:seaCaustics(new THREE.MeshLambertMaterial({map:slate,color:0xb5c6c3}),tick,.92),
    wall:seaCaustics(new THREE.MeshLambertMaterial({map:stone,color:0xa8bfbb}),tick,.70),

    rock:new THREE.MeshLambertMaterial({color:0x65848b}),
    decor:seaCaustics(new THREE.MeshLambertMaterial({map:ornament,color:0xa2c6bd}),tick,.62),
    wood:new THREE.MeshLambertMaterial({color:0x788e86}),
    dark:new THREE.MeshLambertMaterial({color:0x486974}),
    seaweed:new THREE.MeshLambertMaterial({color:0xb7c6ad,side:THREE.DoubleSide}),
    glow:new THREE.MeshBasicMaterial(),
  };
  const kelp=new THREE.BufferGeometry();
  kelp.setAttribute('position',new THREE.Float32BufferAttribute([
    0,0,0, .12,.45,.06,-.12,.46,-.05,
    -.12,.46,-.05, .12,.45,.06,.09,.78,.10,
    -.12,.46,-.05, .09,.78,.10,-.055,.82,.12,
    -.055,.82,.12, .09,.78,.10, -.17,1.04,.19,
  ],3));
  kelp.computeVertexNormals();
  const assets={
    ...shapes,kelp,
    archColumn:new THREE.CylinderGeometry(.43,.50,1,9),
    reef:new THREE.IcosahedronGeometry(.64,0),
    spire:new THREE.ConeGeometry(.50,1,6),
    ringRoof:new THREE.CylinderGeometry(.50,.50,1,56),
  };
  const kit=new StaticBatches(material,assets);
  const add=(...args)=>kit.add(...args);
  const box=(m,...args)=>kit.add('box',m,...args);
  const solid=(m,x,z,w,d,bottom,top,color,climb=false)=>{
    box(m,x,(bottom+top)/2,z,w,top-bottom,d,color);
    level.box(x,z,w,d,bottom,top,climb);
  };
  const cyan=brighter(0x6dfcdc,2.2), blue=brighter(0x7acaff,2.25), lemon=brighter(0xb3ecd0,1.75);
  const coralColors=[0xa3708b,0xb08486,0x78a59e,0x86b5a0];
  const lamps=[];
  function lantern(x,y,z,color,intensity){
    add('reef','glow',x,y,z,.35,.42,.35,color);

  function column(x,z,height,y=0){
    solid('chalk',x,z,1.21,1.21,y,y+.19,0xaec3bb,true);

    add('archColumn','decor',x,y+height-.17,z,.90,.29,.90,0xb2d0ba);

  function coral(x,z,scale=1,y=0){
    const tone=coralColors[Math.floor(rng()*coralColors.length)];
    add('reef','rock',x,y+.093,z,.69*scale,.32*scale,.65*scale,0x7f9b93,rng()*tau);
    for(let branch=0;branch<6;branch++){
      const a=rng()*tau, h=(.34+rng()*.90)*scale, r=(.13+rng()*.27)*scale;
      add('archColumn','chalk',x+Math.cos(a)*r,y+h*.48,z+Math.sin(a)*r,.11*scale,h,.11*scale,tone,a,(rng()-.5)*.53,(rng()-.5)*.5);
      add('reef',branch%4===0?'glow':'chalk',x+Math.cos(a)*r,y+h*.86,z+Math.sin(a)*r,.18*scale,.18*scale,.17*scale,branch%4===0?lemon:tone,a);

  function hall(x,z) {
    const r=HALL.radius,y=HALL.roof;
    level.gate.set(x,y,z);
    level.bossAnchor.set(x,0,z+5.8);

    add('ringRoof','wall',x,y-.25,z,r*2,.50,r*2,0xb5c7be);
    add('ringRoof','chalk',x,y+.014,z,r*2-.31,.022,r*2-.31,0xadbdb3);
    const band=.56;
    for(let zz=-r;zz<r;zz+=band){
      const far=Math.max(Math.abs(zz),Math.abs(Math.min(r,zz+band)));

  function temple(x,z) {

  function ruinedStreet(x,z) {

  function ship(x,z) {

        if(i%2===0)coral(xx,zz+.68,.64);
        box('wood',xx,1.83+rng()*.61,z+4.17+i*.11,.22,2.2,.58,0x749292,.48,side*.12,.19);
      }

        const xx=x+side*(2.85+i*2.05);

    }
    box('wood',x+8.4,2.9,z-3.95,.32,5.82,.35,0x748983,-.22,0,.39);
    box('wood',x+8.63,4.76,z-3.55,2.87,.26,.27,0x95a699,.11,0,.26);
    for(const f of [-8.3,8.2])box('glow',x+f,h+.09,z+1.10,.58,.045,.11,blue);

  function forest(x,z) {
    for(let j=0;j<9;j++){
      const a=rng()*tau, r=.41+rng()*1.28, h=2.15+rng()*3.35;

      if(j%3===0)add('reef','glow',x+Math.cos(a)*r+.14,h*.84,z+Math.sin(a)*r,.091,.12,.09,lemon,a);

  function hatch(x,z) {
    for(const side of [-1,1]){
      solid('wall',x+side*2.45,z,1.37,3.15,0,2.55,0xb1c1bd);
      box('decor',x+side*2.39,1.42,z-1.61,.96,1.69,.08,0xb7ccbe);

    solid('wall',x,z,6.31,2.76,2.51,3.47,0xa9c7bc);

    add('archColumn','dark',x,1.42,z+1.52,4.31,.56,4.31,0x688e8b,Math.PI/2);

  for(let r=0;r<GRID.rows;r++)for(let c=0;c<GRID.columns;c++){

    if(mark==='#'){
      const h=2.05+rng()*2.01;
      solid('rock',x,z,GRID.cell+.019,GRID.cell+.019,0,h,0x7c9c9d);
      if((r+c)%4!==0)add('reef','rock',x+(rng()-.5)*1.42,h,z,3.75,1.23+rng()*.97,3.16,0x799f9f,rng()*tau);
    }else if(mark==='B'){
      solid('wall',x,z,2.8,.68,0,.98,0xb2c9ba);

      add('reef','rock',x,.43,z,1.69+rng()*.81,.95+rng()*.41,1.58,0x789a9f,rng()*tau);

  const base=new THREE.PlaneGeometry(GRID.halfX*2,GRID.halfZ*2);

  const paving=new THREE.Mesh(base,material.floor);

  for(let i=0;i<180;i++){

    add('reef','rock',Math.cos(a)*r,h*.44-2,Math.sin(a)*r,5.3+rng()*19,h,7.5+rng()*15,0x527578,a,rng()*.48,rng()*.18);
  }
  kit.flush();

  const ambient=new THREE.HemisphereLight(0x9be2e7,0x415d65,1.48);
  const ray=new THREE.DirectionalLight(0xa5e2dd,1.30);
  ray.position.set(-22,28,-45);
  const portalLight=new THREE.PointLight(0x56caff,55,16,2);
  portalLight.position.copy(level.gate).add(new THREE.Vector3(0,2.2,0));
  scene.add(ambient,ray,portalLight);
  return {tick,lamps,portalLight};
}

function createEncounter({CONFIG: setup, sound, randomRange}) {
  const tune=setup.breach,status={title:'',detail:'',remaining:undefined,readout:undefined};
  return {
    settings:tune,phase:'calm',region:null,last:-1,height:0,opens:0,seals:0,status:null,
    reset(){
      this.phase='calm';this.region=null;this.last=-1;this.height=0;this.status=null;
      this.opens=randomRange(...tune.first);this.seals=0;
    },
    update(game){
      const t=game.time;
      if(this.phase==='calm' && t>=this.opens-tune.warning){
        // 从其他区选一个裂口，防止同一区域连续失守。
        const available=REGIONS.filter((_,index)=>index!==this.last);
        this.region=available[Math.floor(Math.random()*available.length)];
        this.last=REGIONS.indexOf(this.region);
        this.phase='warning';
        game.ui.notify('穹顶破裂预警，'+this.region.name+'即将进水',2.5);
        sound.tone(109,53,.58,.22,'triangle');
      }
      if(this.phase==='warning' && t>=this.opens){
        this.phase='flood';
        this.seals=this.opens+tune.duration;
        sound.hiss(2.8,2100,220,.42);
        sound.tone(86,22,1.13,.42,'triangle');
        game.ui.notify(this.region.name+'穹顶破裂，海水涌入',2.8);
      }
      if(this.phase==='flood' && t>=this.seals){
        this.phase='drain';
        sound.tone(67,42,.59,.21,'sine');
        game.ui.notify(this.region.name+'裂口已封闭',2.1);
      }
      if(this.phase==='drain' && t>=this.seals+tune.drain){
        this.phase='calm';this.region=null;this.height=0;this.opens=t+randomRange(...tune.calm);
      }
      const smooth=t=>{const c=Math.max(0,Math.min(1,t));return c*c*(3-2*c);};
      if(this.phase==='flood')this.height=tune.depth*smooth((t-this.opens)/tune.rise);
      if(this.phase==='drain')this.height=tune.depth*(1-smooth((t-this.seals)/tune.drain));

      const p=game.player, impaired=game.time<p.slowUntil && p.slowScale===0;
      status.readout=undefined;
      status.remaining=undefined;
      if(this.phase==='warning'){
        status.title='穹顶破裂预警';status.remaining=this.opens-t;
        status.detail=this.region.name+'即将进水，准备转移';
      }else if(this.phase==='flood'){
        status.title=this.region.name+'进水';
        status.remaining=this.seals-t;
        status.detail=insideBox(p.x,p.z,this.region)?'深水减速，沿主街转移':'绕开深水区，等待穹顶再封闭';
      }else if(this.phase==='drain'){
        status.title='裂口已封闭';status.remaining=this.seals+tune.drain-t;
        status.detail=this.region.name+'退水中';
      }else if(impaired){
        status.title='电弧麻痹';status.readout=(p.slowUntil-t).toFixed(1)+' 秒';status.detail='移动暂时受限';
      }
      if(impaired && this.phase!=='calm')status.detail='电弧麻痹中 / '+status.detail;
      this.status=this.phase==='calm'&&!impaired?null:status;
    },
  };
}

function createWater({THREE,scene},box,depth) {
  const w=box.x1-box.x0,d=box.z1-box.z0;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,
    uniforms:{tick:{value:0},scale:{value:new THREE.Vector2(w,d)},height:{value:depth},fogDepth:{value:.0175}},
    vertexShader:`
      varying vec2 field; varying float viewDepth;
      void main(){
        field=uv;
        vec4 v=modelViewMatrix*vec4(position,1.0);
        viewDepth=-v.z;
        gl_Position=projectionMatrix*v;
      }
    `,
    fragmentShader:`
      uniform float tick,height,fogDepth;
      uniform vec2 scale;
      varying vec2 field; varying float viewDepth;
      void main(){
        vec2 p=field*scale;
        float edge=min(min(p.x,scale.x-p.x),min(p.y,scale.y-p.y));
        float shore=smoothstep(.0,.82,edge);
        float a=sin(p.x*1.57+p.y*.49+tick*2.7);
        float b=sin(p.y*1.31-p.x*.36-tick*2.1);
        float shimmer=pow(max(0.0,sin(a*1.7+b*.79+p.y*.35-tick*.85)),11.0);
        float foam=exp(-edge*2.8)*pow(max(0.0,sin(p.x*.89+p.y*.72+tick*2.8)),4.0);
        vec3 shade=mix(vec3(.04,.19,.20),vec3(.025,.29,.36),clamp(height*.9,0.0,1.0));
        shade+=shimmer*vec3(.10,.32,.32)+foam*vec3(.16,.25,.17);
        float fog=1.0-exp(-pow(max(0.0,viewDepth)*fogDepth,2.0));
        gl_FragColor=vec4(mix(shade,vec3(.029,.104,.147),fog),shore*(.47+.18*clamp(height,0.0,1.0)));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
  }));
  mesh.rotation.x=-Math.PI/2;
  mesh.position.set((box.x0+box.x1)/2,depth,(box.z0+box.z1)/2);
  scene.add(mesh);
  return mesh;
}

function createEnvironment(context) {
  const {THREE,scene,camera,CONFIG:setup,mapData,seededRandom,brighter}=context;
  const rng=seededRandom(592067), tau=Math.PI*2;
  const shallow=createWater(context,BASIN,setup.breach.shallowDepth);
  const flooded=REGIONS.map(r=>{const m=createWater(context,r,1.20);m.visible=false;return m;});
  const sea=new THREE.Mesh(new THREE.SphereGeometry(124,32,21),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,
    vertexShader:`
      varying vec3 ray;
      void main(){
        vec4 p=modelMatrix*vec4(position,1.0);
        ray=p.xyz-cameraPosition;
        gl_Position=projectionMatrix*viewMatrix*p;
      }
    `,
    fragmentShader:`
      varying vec3 ray;
      void main(){
        vec3 d=normalize(ray);
        float up=clamp(d.y+.19,0.0,1.0);
        float beam=pow(max(0.0,dot(d,normalize(vec3(.16,.68,-.55)))),6.0);
        float vein=pow(max(0.0,sin(d.x*23.0+d.y*8.0+d.z*3.0)),8.0)*beam*.18;
        vec3 tint=mix(vec3(.018,.075,.117),vec3(.059,.245,.284),pow(up,.72));
        gl_FragColor=vec4(tint+vec3(.071,.29,.28)*(beam*.56+vein),1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
  }));
  sea.renderOrder=-25;sea.frustumCulled=false;scene.add(sea);
  function domeXZ(x,z){
    const len=Math.hypot(x,z);
    if(len<.0001)return [0,0];
    const power=10;
    const f=46.9/Math.pow(Math.abs(x/len)**power+Math.abs(z/len)**power,1/power);
    return [x*f,z*f];
  }
  const roof=new THREE.SphereGeometry(1,64,23,0,tau,0,Math.PI/2);
  const roofPosition=roof.attributes.position;
  for(let i=0;i<roofPosition.count;i++){
    const [x,z]=domeXZ(roofPosition.getX(i),roofPosition.getZ(i));
    roofPosition.setXYZ(i,x,roofPosition.getY(i)*36.8-1.15,z);
  }
  roof.computeVertexNormals();
  const glass=new THREE.Mesh(roof,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.BackSide,
    vertexShader:`
      varying vec3 norm,view;
      void main(){
        vec4 p=modelViewMatrix*vec4(position,1.0);
        norm=normalize(normalMatrix*normal);view=normalize(-p.xyz);
        gl_Position=projectionMatrix*p;
      }
    `,
    fragmentShader:`
      varying vec3 norm,view;
      void main(){
        float glancing=pow(1.0-abs(dot(normalize(norm),normalize(view))),2.5);
        gl_FragColor=vec4(vec3(.21,.60,.64),.035+glancing*.13);
      }
    `,
  }));
  scene.add(glass);
  const ribVertices=[];
  function domePoint(a,p){
    const k=Math.cos(p),[x,z]=domeXZ(Math.cos(a)*k,Math.sin(a)*k);
    return [x,Math.sin(p)*36.75-1.10,z];
  }
  for(let i=0;i<16;i++){
    const a=i/16*tau;
    for(let j=0;j<25;j++)ribVertices.push(...domePoint(a,j/25*Math.PI/2),...domePoint(a,(j+1)/25*Math.PI/2));
  }
  for(const p of [.24,.51,.80,1.07,1.31]){
    for(let i=0;i<72;i++)ribVertices.push(...domePoint(i/72*tau,p),...domePoint((i+1)/72*tau,p));
  }
  const ribs=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({
    color:0x90d6d7,transparent:true,opacity:.20,depthWrite:false,fog:false,
  }));
  ribs.geometry.setAttribute('position',new THREE.Float32BufferAttribute(ribVertices,3));
  scene.add(ribs);

  // 巨影在压力穹顶外侧游动，与关卡内可攻击的首领分开。
  const shadow=new THREE.Group();
  const shade=new THREE.MeshBasicMaterial({color:0x10262f,fog:false});
  const shape=new THREE.SphereGeometry(1,16,8),tailFin=new THREE.ConeGeometry(1,1,3);
  for(const [x,y,z,w,h,d] of [[0,0,0,3.6,2.10,11.8],[0,-.4,9.1,2.43,1.48,4.9],[0,.18,-9.6,1.19,1.11,5.5]]){
    const m=new THREE.Mesh(shape,shade);m.position.set(x,y,z);m.scale.set(w,h,d);shadow.add(m);
  }
  for(const d of [-1,1]){
    const f=new THREE.Mesh(tailFin,shade);
    f.position.set(d*3.64,-.66,1.79);f.scale.set(3.40,5.37,.26);
    f.rotation.set(-.43,.25,d*1.07);shadow.add(f);
  }
  const fin=new THREE.Mesh(tailFin,shade);
  fin.position.set(0,2.38,-.32);fin.scale.set(.32,4.35,4.18);fin.rotation.x=-.49;shadow.add(fin);
  const tail=new THREE.Group();tail.position.z=-12.4;shadow.add(tail);
  for(const d of [-1,1]){
    const f=new THREE.Mesh(tailFin,shade);
    f.position.set(0,d*1.54,-.2);f.scale.set(.28,5.23,2.03);
    f.rotation.x=d*.53;f.rotation.z=d<0?Math.PI:0;tail.add(f);
  }
  scene.add(shadow);

  const data=new Float32Array(setup.graphics.motes*3);
  for(let i=0;i<data.length;i++)data[i]=rng();
  const drift=new THREE.Points(new THREE.BufferGeometry(),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,
    uniforms:{tick:{value:0}},
    vertexShader:`
      uniform float tick;
      varying float opacity,bubble;
      void main(){
        vec3 s=position,c=cameraPosition;
        float span=55.0;
        bubble=step(.79,s.z);
        vec3 p=vec3(
          mod(s.x*span+tick*(.32+s.y*.67)-c.x,span)+c.x-span*.5+sin(tick+s.y*31.0)*.30,
          mod(s.y*12.0+tick*(.24+bubble*.86+s.z*.22),12.0)+.13,
          mod(s.z*span-tick*(.16+s.x*.19)-c.z,span)+c.z-span*.5
        );
        vec4 v=viewMatrix*vec4(p,1.0);
        float fade=smoothstep(.63,2.0,-v.z)*(1.0-smoothstep(20.0,26.0,-v.z));
        opacity=fade*(.24+s.x*.36+bubble*.15);
        gl_PointSize=clamp((3.8+s.y*5.5+bubble*11.0)/max(-v.z,1.0),1.1,6.8);
        gl_Position=projectionMatrix*v;
      }
    `,
    fragmentShader:`
      varying float opacity,bubble;
      void main(){
        float r=length(gl_PointCoord-.5);
        float dotMask=1.0-smoothstep(.13,.49,r);
        float ring=1.0-smoothstep(.042,.108,abs(r-.34));
        gl_FragColor=vec4(vec3(.62,.95,.90),opacity*mix(dotMask,ring,bubble));
      }
    `,
  }));
  drift.geometry.setAttribute('position',new THREE.BufferAttribute(data,3));drift.frustumCulled=false;scene.add(drift);

  const leak=new THREE.Group();scene.add(leak);
  const cuts=[
    [-1.38,.33,-.84,.13],[-.84,.13,-.42,.24],[-.42,.24,-.11,.04],[-.11,.04,.39,.15],[.39,.15,.72,-.08],[.72,-.08,1.32,.19],
    [-.42,.24,-.60,.55],[-.60,.55,-.53,.88],[.39,.15,.48,.51],[.48,.51,.71,.69],[-.11,.04,-.22,-.42],[-.22,-.42,.12,-.69],
  ];
  const edges=[];
  for(const [ax,ay,bx,by] of cuts)edges.push(ax,ay,.10,bx,by,.10);
  const crack=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({
    color:brighter(0x6bddff,2.65),transparent:true,opacity:.9,depthWrite:false,fog:false,
  }));
  crack.geometry.setAttribute('position',new THREE.Float32BufferAttribute(edges,3));leak.add(crack);
  const streams=[];
  for(let j=0;j<3;j++){
    const stream=new THREE.Mesh(new THREE.PlaneGeometry(1.82,4.75),new THREE.ShaderMaterial({
      transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,
      uniforms:{tick:{value:0},phase:{value:j*2.23},energy:{value:0}},
      vertexShader:'varying vec2 p; void main(){p=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:`
        uniform float tick,energy,phase;
        varying vec2 p;
        void main(){
          float v=p.x-.5 + .06*sin(p.y*12.0+tick*4.0+phase);
          float flow=pow(max(0.0,sin(v*92.0+p.y*8.0-phase)),7.0);
          float spray=pow(max(0.0,sin(p.y*58.0+tick*17.0+v*17.0)),4.0);
          float edge=1.0-smoothstep(.08,.47,abs(v));
          float falloff=smoothstep(0.0,.2,p.y)*(1.0-smoothstep(.9,1.0,p.y));
          gl_FragColor=vec4(vec3(.22,.66,.96),(.26+flow*.53+spray*.22)*edge*falloff*energy);
        }
      `,
    }));
    stream.position.set((j-1)*.36,-2.03,1.35+j*.20);
    stream.rotation.x=-.61;
    stream.rotation.y=(j-1)*.33;leak.add(stream);streams.push(stream);
  }
  return {
    update(t,playing,game){
      mapData.tick.value=t;
      for(const [i,light] of mapData.lamps.entries())light.intensity=(i===0?18:15)*(1+Math.sin(t*2.8+i*2.7)*.17);
      mapData.portalLight.intensity=55+Math.sin(t*2.8)*9+game.blast*(1-game.blast)*300;
      drift.material.uniforms.tick.value=t;
      const a=t*.14-Math.PI/2-.53;
      shadow.position.set(Math.cos(a)*71,19+Math.sin(t*.59)*2.9,Math.sin(a)*71);
      shadow.rotation.set(Math.sin(t*.6)*.08,Math.atan2(-Math.sin(a),Math.cos(a)),Math.sin(t*.73)*.11);
      tail.rotation.y=Math.sin(t*2.0)*.28;
      const encounter=game.encounter;
      const region=encounter?.region;
      shallow.visible=!(region===REGIONS[0]&&encounter.height>setup.breach.shallowDepth+.016);
      shallow.material.uniforms.tick.value=t;
      for(const [i,m] of flooded.entries()){
        const active=REGIONS[i]===region&&encounter.height>.015;
        m.visible=active;
        if(active){
          m.position.y=encounter.height;
          m.material.uniforms.height.value=encounter.height;
          m.material.uniforms.tick.value=t;
        }
      }
      leak.visible=!!region && encounter.phase!=='drain';
      if(leak.visible){
        leak.position.set(...region.wall);
        leak.rotation.y=region.yaw;
        crack.material.opacity=encounter.phase==='warning' ? .40+Math.sin(t*8)*.21:.89;
        for(const m of streams){
          m.material.uniforms.tick.value=t;
          m.material.uniforms.energy.value=encounter.phase==='flood'?1:0;
        }
      }
      const forest=game.player.z>18.5&&Math.abs(game.player.x)>6.5&&Math.abs(game.player.x)<28.5;
      scene.fog.density=setup.map.fog+(forest ? .014 : 0);
    },
  };
}

function createPortal({THREE,scene,level,brighter,seededRandom,dynamicMesh,setInstance,updateMesh}){
  const base=new THREE.Group();base.position.copy(level.gate);scene.add(base);
  const vortex=new THREE.Mesh(new THREE.PlaneGeometry(6.1,5.57),new THREE.ShaderMaterial({
    transparent:true,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{tick:{value:0},ready:{value:0},blast:{value:0}},
    vertexShader:'varying vec2 coord;void main(){coord=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform float tick,ready,blast;
      varying vec2 coord;
      void main(){
        vec2 p=coord*2.0-1.0;
        float r=length(p),a=atan(p.y,p.x);
        float spiral=sin(a*4.0-r*24.0+tick*3.3+sin(a*3.0+r*8.0)*.9);
        float arms=pow(max(0.0,spiral),8.0);
        float brim=exp(-abs(r-.78-sin(a*5.0+tick*1.9)*.042)*27.0);
        float eye=(1.0-smoothstep(.03,.28,r))*.93;
        float cover=(1.0-smoothstep(.72,1.0,r))*smoothstep(.05,.20,r);
        vec3 shade=mix(vec3(.12,.44,.89),vec3(.28,1.06,.98),ready);
        gl_FragColor=vec4(shade*(1.0+blast*3.0),(.09+arms*.64+brim*.59+eye*.12)*cover*(1.0-blast));
      }
    `,
  }));
  vortex.position.set(0,2.61,0);base.add(vortex);
  const rings=[];
  for(let j=0;j<3;j++){
    const m=new THREE.Mesh(new THREE.TorusGeometry(2.01+j*.23,.026+j*.005,6,61,Math.PI*(1.65+j*.09)),
      new THREE.MeshBasicMaterial({color:brighter(j%2?0x5bf3cf:0x64cfff,2.4)}));
    m.position.set(0,2.55,-j*.09);
    base.add(m);rings.push(m);
  }
  const surge=new THREE.Mesh(new THREE.CylinderGeometry(.92,.66,1,28,1,true),new THREE.ShaderMaterial({
    transparent:true,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{tick:{value:0},opacity:{value:0}},
    vertexShader:'varying vec2 p;void main(){p=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform float tick,opacity;
      varying vec2 p;
      void main(){
        float v=pow(max(0.0,sin(p.x*89.0+sin(p.y*16.0-tick*4.0)*1.81)),7.0);
        float wave=pow(max(0.0,sin(p.y*46.0-tick*20.0+p.x*60.0)),5.0);
        float ends=smoothstep(.0,.12,p.y)*(1.0-smoothstep(.60,1.0,p.y));
        gl_FragColor=vec4(vec3(.30,.72,1.19),(.24+v*.52+wave*.26)*ends*opacity);
      }
    `,
  }));
  base.add(surge);
  const circles=[];
  for(const [i,y] of [.13,-HALL.roof+.15].entries()){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.031,7,71),new THREE.MeshBasicMaterial({
      color:brighter(i?0x61dbff:0x88fce8,2.65),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    }));
    ring.rotation.x=-Math.PI/2;ring.position.y=y;base.add(ring);circles.push(ring);
  }
  const rng=seededRandom(203359),droplets=[];
  for(let i=0;i<138;i++){
    droplets.push({a:rng()*Math.PI*2,reach:2.5+rng()*18.4,height:2.3+rng()*8.1,
      size:.075+rng()*.30,spin:rng()*12.0,color:brighter(i%4?0x82defe:0x6cffe0,1.1+rng()*1.35)});
  }
  const drops=dynamicMesh(new THREE.OctahedronGeometry(1,0),new THREE.MeshBasicMaterial({
    transparent:true,opacity:.80,depthWrite:false,
  }),droplets.length);
  return {
    update(t,ready,blast){
      const u=vortex.material.uniforms;
      u.tick.value=t;u.ready.value=Number(ready);u.blast.value=blast;
      vortex.rotation.set(.12+Math.sin(t*.58)*.14,Math.sin(t*.43)*.46,t*.13);
      vortex.visible=blast<.86;
      for(const [i,ring] of rings.entries()){
        ring.visible=blast<.78;
        ring.rotation.set(Math.sin(t*.71+i)*(.24+i*.06),Math.cos(t*.51+i)*(.22+i*.078),t*(i%2?-.51:.49)+i*1.8);
        ring.scale.setScalar(1+blast*(2+i));
      }
      const columnHeight=1.6+Math.sin(blast*Math.PI*.86)*13.0;
      surge.visible=blast>0&&blast<.99;
      surge.position.y=columnHeight*.49;surge.scale.set(.76+blast*3.5,columnHeight,.76+blast*3.5);
      surge.rotation.y=t*.39;
      surge.material.uniforms.tick.value=t;
      surge.material.uniforms.opacity.value=(1-blast)*1.15;
      for(const [i,circle] of circles.entries()){
        const x=Math.max(0,blast-i*.13);
        circle.visible=x>0&&blast<1;
        circle.material.opacity=(1-blast)*.82;
        circle.scale.setScalar(1.3+x*(i?32:15));
      }
      let count=0;
      if(blast>0&&blast<1)for(const p of droplets){
        const r=1.32+p.reach*blast,y=.55+p.height*4*blast*(1-blast)-blast*3.6;
        if(y<-.29)continue;
        setInstance(drops,count++,level.gate.x+Math.cos(p.a)*r,level.gate.y+y,level.gate.z+Math.sin(p.a)*r,
          p.size*.55,p.size*1.61,p.size*.59,p.color,p.a+p.spin*blast,p.spin*blast,.36);
      }
      drops.material.opacity=(1-blast)*.82;
      updateMesh(drops,count);
    },
  };
}

function seaModel(type,{THREE,shapes,mergeGeometries}){
  const solid=[],lit=[],transform=new THREE.Object3D();
  const facet=new THREE.IcosahedronGeometry(1,0);
  const spike=new THREE.ConeGeometry(.50,1,5);
  const joint=new THREE.CylinderGeometry(.36,.50,1,6);
  const umbrella=new THREE.SphereGeometry(.50,12,6,0,Math.PI*2,0,Math.PI/2);
  function stamp(to,primitive,color,x,y,z,w,h,d,pitch=0,yaw=0,roll=0){
    const g=primitive.index?primitive.toNonIndexed():primitive.clone();
    transform.position.set(x,y,z);transform.scale.set(w,h,d);transform.rotation.set(pitch,yaw,roll,'YXZ');
    transform.updateMatrix();g.applyMatrix4(transform.matrix);
    const tint=new THREE.Color(color),data=new Float32Array(g.attributes.position.count*3);
    for(let i=0;i<data.length;i+=3){data[i]=tint.r;data[i+1]=tint.g;data[i+2]=tint.b;}
    g.setAttribute('color',new THREE.BufferAttribute(data,3));to.push(g);
  }
  const hull=(...p)=>stamp(solid,facet,...p);
  const plate=(...p)=>stamp(solid,shapes.box,...p);
  const fin=(...p)=>stamp(solid,spike,...p);
  const limb=(...p)=>stamp(solid,joint,...p);
  const light=(...p)=>stamp(lit,facet,...p);
  const navy=0x294d60,teal=0x496e76,lightTeal=0x72a599,ink=0x2a5561,copper=0x825b68;
  if(type===0){
    hull(teal,0,.72,-.11,.34,.29,.56);
    hull(navy,0,.66,.39,.25,.19,.33);
    fin(lightTeal,0,1.01,-.19,.10,.40,.31,-.46);
    for(const d of [-1,1]){
      fin(ink,d*.23,.60,.08,.17,.34,.12,.53,0,-d*.95);
      fin(lightTeal,0,.75+d*.14,-.71,.08,.34,.25,Math.PI/2+d*.62);
      light(0x80ffdf,d*.19,.79,.51,.061,.046,.042);
      light(0x62c8e3,d*.27,.66,.12,.040,.056,.16);
    }
  }else if(type===1){
    hull(copper,0,.96,-.17,.70,.51,.55);
    hull(teal,0,1.18,.18,.66,.30,.49);
    hull(navy,0,.88,.44,.49,.32,.29);
    for(const d of [-1,1]){
      for(let j=0;j<4;j++){
        limb(copper,d*(.54+j*.03),.46,.35-j*.25,.15,.67,.15,.13,0,d*-.84);
        fin(navy,d*(.76+j*.03),.235,.40-j*.25,.09,.30,.10,Math.PI,0,d*.44);
      }
      limb(teal,d*.57,.78,.44,.26,.46,.28,1.02,0,-d*.66);
      hull(copper,d*.69,.88,.66,.29,.25,.33);
      fin(teal,d*.81,.92,.90,.24,.48,.21,1.21,0,d*.52);
      fin(teal,d*.56,.84,.91,.18,.37,.19,1.21,0,-d*.41);
      fin(navy,d*.37,1.48,-.16,.25,.31,.25,-.43,0,-d*.17);
      light(0xffb7a8,d*.19,1.16,.57,.065,.050,.065);
    }
  }else if(type===2){
    stamp(solid,umbrella,0x769aad,0,1.33,-.06,1.02,1.34,1.04);
    hull(navy,0,1.31,.01,.47,.18,.48);
    hull(0x5f80a0,0,1.57,.10,.30,.22,.36);
    for(let j=0;j<8;j++){
      const a=j/8*2*Math.PI;
      const x=Math.cos(a)*.31,z=Math.sin(a)*.30;
      limb(0x39677a,x,1.005,z,.073,.62,.080,x*.89,0,z*.79);
      limb(teal,x*1.33,.52,z*1.24,.057,.48,.056,-z*.77,0,-x*.67);
      light(0x83d8ff,x,1.24,z,.070,.042,.075);
      light(0x66bfee,x*1.30,.333,z*1.22,.046,.045,.051);
    }
    light(0x87d8ff,0,1.40,.46,.147,.059,.046);
  }else{
    hull(navy,0,1.89,-.10,1.04,.93,.94);
    hull(teal,0,2.02,.63,.86,.66,.82);
    hull(ink,0,1.78,.99,.82,.39,.54);
    hull(navy,0,1.47,1.05,.71,.31,.52);
    hull(navy,0,1.58,-1.04,.43,.41,.88);
    fin(lightTeal,0,2.64,-.51,.26,1.19,.41,-.34);
    fin(ink,0,1.94,-1.72,.14,1.02,.43,-.26);
    for(const d of [-1,1]){
      hull(ink,d*.85,1.64,.19,.64,.22,.65,0,d*.41);
      fin(teal,d*1.14,1.45,.06,.40,.95,.36,.82,0,d*-1.06);
      fin(navy,d*.72,2.36,.49,.31,.69,.42,-.44,0,d*-.67);
      for(let j=0;j<3;j++)fin(0x9dc6c2,d*(.24+j*.16),1.87,1.24,.135,.27,.15,Math.PI,.13);
      light(0x80f1ec,d*.48,2.16,1.14,.13,.09,.080);
      light(0x6ecbf2,d*.69,1.89,.86,.070,.070,.096);
    }
    limb(ink,0,3.09,.62,.148,1.02,.151,.67);
    light(0x78ffdd,0,3.49,1.02,.19,.19,.18);
  }
  const g=[mergeGeometries(solid),mergeGeometries(lit)];
  for(const part of [...solid,...lit,facet,spike,joint,umbrella])part.dispose();
  return g;
}

export default {

  },

    beforeTiles({ctx,px,pz,size}){
      ctx.fillStyle='#193941';ctx.fillRect(0,0,size,size);
      ctx.fillStyle='#315864';
      ctx.fillRect(px(BASIN.x0),pz(BASIN.z0),px(BASIN.x1)-px(BASIN.x0),pz(BASIN.z1)-pz(BASIN.z0));
      ctx.strokeStyle='#658d8f';
      ctx.beginPath();ctx.ellipse(px(0),pz(0),HALL.radius*size/90,HALL.radius*size/90,0,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#625f60';ctx.fillRect(px(-12.3),pz(-30.1),px(12.3)-px(-12.3),pz(-27.5)-pz(-30.1));
    },
    overlay({ctx,px,pz,game}){
      const event=game.encounter,r=event?.region;
      if(!r)return;
      const x=px(r.x0),z=pz(r.z0),w=px(r.x1)-x,d=pz(r.z1)-z;
      ctx.fillStyle=event.phase==='warning'?'#f1ac6728':'#39bedf36';
      ctx.strokeStyle=event.phase==='warning'?'#ffbc76':'#79e7ff';
      ctx.lineWidth=1.0;
      ctx.fillRect(x,z,w,d);ctx.strokeRect(x,z,w,d);
    },
  },
  text:{
    tag:'第六关 / 穹顶海底都市',
    title:'沉穹古都',
    enter:'进入穹顶',
    brief:'从潜水舱进入沉城，击败深海魔鱼，带着深渊珍珠登上议事厅。穹顶破裂时，离开进水区可恢复跑动速度。',
    bossName:'巨型深海魔鱼',
    keyItem:'深渊珍珠',
    portal:'议事厅漩涡',
    safe:'潜水舱入口安全区',
    objective:'清除凶兽，击败巨型深海魔鱼并取得深渊珍珠',
    exitObjective:'登上圆形议事厅，在屋顶漩涡前按 E 引爆',
    detonating:'深海封印解除，水柱冲击波扩散中',
    rage:'深海魔鱼狂暴，鱼群向议事厅聚集',
  },
};
</script>
<script>
  {
    const imports = { ...globalThis.levelThreeModules?.() };
    for (const source of document.querySelectorAll('script[data-level-module]')) {
      imports[source.dataset.levelModule] = URL.createObjectURL(new Blob([source.textContent], { type: 'text/javascript' }));
    }
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports });
    document.currentScript.after(map);
  }
</script>
<script type="module">
  async function boot() {
    if (!globalThis.levelThreeModules) throw new Error('缺少本地 Three.js 文件');
    const sceneModule = '@level/scene.mjs';
    const campaignStage = 6;
    const [{ startLevel }, { default: definition }] = await Promise.all([
      import('@level-kit/runtime.mjs'), import(sceneModule),
    ]);
    const campaignId = document.body.dataset.campaignLevel;
    const campaignPath = `/${campaignId}/`;
    const campaign = campaignId && location.protocol === 'http:' &&
      [campaignPath, campaignPath + 'index.html'].includes(location.pathname)
      ? await import('/campaign/save.mjs').then(module => module.connectCampaign(campaignId))
      : null;
    startLevel(definition, campaign, campaignStage);
  }

  boot().catch(error => {
    console.error(error);
    document.getElementById('menu-status').textContent = '关卡加载失败。请检查本地游戏文件和浏览器的 WebGL 支持。';
  });
</script>
</body>
