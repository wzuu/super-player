<text x="490.0" y="125.0" font-size="18" fill="#f5ede1">驻防位置与实际部署</text>
<circle cx="161.1" cy="454.5" r="8.2" fill="#924e46"/>
<text x="157.1" y="458.5" font-size="12" fill="#f5ede1">1</text>
<text x="490.0" y="160.0" font-size="15" fill="#f5ede1">1　广场来敌　4 只</text>
<circle cx="120.1" cy="432.4" r="8.2" fill="#924e46"/>
<text x="116.1" y="436.4" font-size="12" fill="#f5ede1">2</text>
<text x="490.0" y="185.0" font-size="15" fill="#f5ede1">2　旧票厅看守　4 只</text>
<circle cx="202.1" cy="263.2" r="8.2" fill="#924e46"/>
<text x="198.1" y="267.2" font-size="12" fill="#f5ede1">3</text>
<text x="490.0" y="210.0" font-size="15" fill="#f5ede1">3　上层巡逻　5 只</text>
<circle cx="263.6" cy="373.6" r="8.2" fill="#924e46"/>
<text x="259.6" y="377.6" font-size="12" fill="#f5ede1">4</text>
<text x="490.0" y="235.0" font-size="15" fill="#f5ede1">4　南铁梯　7 只</text>
<circle cx="83.2" cy="255.8" r="8.2" fill="#924e46"/>
<text x="79.2" y="259.8" font-size="12" fill="#f5ede1">5</text>
<text x="490.0" y="260.0" font-size="15" fill="#f5ede1">5　西维修梯　7 只</text>
<circle cx="390.7" cy="266.8" r="8.2" fill="#924e46"/>
<text x="386.7" y="270.8" font-size="12" fill="#f5ede1">6</text>
<text x="490.0" y="285.0" font-size="15" fill="#f5ede1">6　东缆索梯　8 只</text>
<circle cx="239.0" cy="134.4" r="8.2" fill="#924e46"/>
<text x="235.0" y="138.4" font-size="12" fill="#f5ede1">7</text>
<text x="490.0" y="310.0" font-size="15" fill="#f5ede1">7　北外架梯　7 只</text>
<text x="490.0" y="352.0" font-size="14" fill="#f5ede1">绿线为进场与救援路线，金虚线通往 铜版首日票</text>
<text x="490.0" y="381.0" font-size="14" fill="#f5ede1">金色实条为独立挡栏，橙箭头为主要来向</text>
<text x="490.0" y="410.0" font-size="14" fill="#f5ede1">蓝点为弹箱，浅绿点为医疗补给</text>
<text x="490.0" y="450.0" font-size="17" fill="#f5ede1">启标后各入口开始预警的时间</text>
<text x="490.0" y="480.0" font-size="15" fill="#f5ede1">南铁梯　1 秒</text>
<text x="490.0" y="505.0" font-size="15" fill="#f5ede1">西维修梯　17 秒</text>
<text x="490.0" y="530.0" font-size="15" fill="#f5ede1">东缆索梯　30 秒</text>
<text x="490.0" y="555.0" font-size="15" fill="#f5ede1">北外架梯　44 秒</text>
