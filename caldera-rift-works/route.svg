<text x="525.0" y="85.0" fill="#efece0" font-size="19">任务弹箱与敌群来向</text>
<text x="525.0" y="117.0" fill="#efece0" font-size="15">A　检修库　　 1　炉芯门　最多 4 名增援</text>
<text x="525.0" y="145.0" fill="#efece0" font-size="15">B　冷却控制房　　 2　地窖门　最多 4 名增援</text>
<text x="525.0" y="173.0" fill="#efece0" font-size="15">C　桥头封存间　　 3　转运室门　最多 5 名增援</text>
<text x="525.0" y="223.0" fill="#efece0" font-size="19">驻守区域</text>
<text x="525.0" y="252.0" fill="#efece0" font-size="15">湖廊巡查　4 名</text>
<text x="525.0" y="277.0" fill="#efece0" font-size="15">铸造守卫　5 名</text>
<text x="525.0" y="302.0" fill="#efece0" font-size="15">箭塔驻防　5 名</text>
<text x="525.0" y="327.0" fill="#efece0" font-size="15">转运守卫　6 名</text>
<text x="525.0" y="380.0" fill="#efece0" font-size="15">绿线示范正序路线，最后一门为本局结算点。</text>
<text x="525.0" y="408.0" fill="#efece0" font-size="15">涨潮前可走中央低沟，涨潮时沿两侧高桥。</text>
<text x="525.0" y="436.0" fill="#efece0" font-size="14">金色虚线为支路，空心星标为蓝釉测温杯。</text>
<text x="525.0" y="464.0" fill="#efece0" font-size="14">浅蓝点为固定弹箱，珊瑚色点为驻防中心。</text>
