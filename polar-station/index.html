      const wrap = standard('#7b7973', { roughness: .89 });
      for (let i = 0; i < 5; i++) {
        box(body, wrap, -.12 + i * .004, -.08 - i * .019, 0, .088, .014, .096, -.24);
        box(guard, wrap, .486 + i * .024, -.015, 0, .018, .113, .175, -.14);
      }
      const drops = physical('#9cc8dc', { roughness: .1, clearcoat: 1, transparent: true, opacity: .62, depthWrite: false });
      const wetOptic = physical('#7196b7', { roughness: .13, clearcoat: 1 });
      box(sight, wetOptic, .046, .235, 0, .071, .013, .097);
      const rand = rifleRandom(175);
      for (let i = 0; i < 32; i++) {
        tube(body, drops, -.209 + rand() * .51, -.017 + rand() * .092, i % 2 ? .09 : -.09, .002 + rand() * .004, .004, 'z', 0, 6);
      }
      break;
    }
    case 'buried-tomb': {
      const lapis = physical('#1744a3', { roughness: .43, clearcoat: .55 });
      standardMagazine(lapis);
      for (const z of [-.06, .06]) tube(sight, lapis, .047, .186, z, .025, .009, 'z');
      for (const z of [-.086, .086]) line(body, accent, -.216, .076, .28, .076, z, .009);
      break;
    }
    case 'polar-station': {
      canister(skin.light, accent, glass('#78bded', .72));
      tube(barrel, frost, .792, .046, 0, .045, .252);
      for (const x of [.687, .742, .842, .903]) {
        tube(barrel, hardware, x, .046, 0, .048, .014);
        for (const z of [-.033, .033]) tube(barrel, glass('#b9e8fd', .68), x, -.01, z, 0, .039, 'y', .011, 5);
      }
      break;
    }
    case 'drowned-city': {
      canister(skin.light, pearl);
      for (const z of [-.058, .058]) {
        for (let i = 0; i < 4; i++) {
          const x = .074 + i * .019, y = -.176 + Math.sin(i * 2.1) * .024;
          line(magazine, indicator, x, y, x + .019, -.176 + Math.sin((i + 1) * 2.1) * .024, z, .005);
          line(sight, indicator, .037 + i * .005, .154 + i * .014, .052, .164 + i * .014, z, .004);
        }
      }
      animations.push(t => { indicator.emissiveIntensity = .72 + 2.05 * Math.max(0, Math.sin(t * 11) * Math.cos(t * 4)); });
      break;
    }
    case 'ember-fortress': {
      standardMagazine(accent);
      const hammered = standard('#68504a', { roughness: .84, metalness: .47 });
      const rand = rifleRandom(1343);
      for (const z of [-.088, .088]) {
        line(guard, indicator, .401, -.03, .657, -.03, z, .007);
        for (let i = 0; i < 12; i++) tube(guard, hammered, .398 + i * .023, -.004 + rand() * .054, z,
          .004 + rand() * .009, .007, 'z', .005, 7);
      }
      animations.push((t, event) => {
        const tide = event.tide ?? .5 + .5 * Math.sin(t * 1.22);
        enamel.emissiveIntensity = indicator.emissiveIntensity = .75 + tide * (1.1 + .7 * Math.sin(t * 2.5) ** 2);
      });
      break;
    }
    case 'derelict-station': {
      standardMagazine(indicator);
      const windowGlass = glass('#60bdf5', .3);
      for (const z of [-.097, .097]) {
        box(guard, gasket, .535, .015, z * .96, .256, .068, .02);
        for (let i = 0; i < 7; i++) box(guard, indicator, .438 + i * .03, .016, z * 1.08, .021, .034, .01);
        box(guard, windowGlass, .535, .015, z * 1.16, .256, .067, .01);
        for (const x of [-.189, -.119, -.049]) tube(body, hardware, x, .047, z * .88, .018, .012, 'z');
      }
      const hologram = physical('#54caff', {
        emissive: '#2178f1', emissiveIntensity: 1.5, transparent: true, opacity: .46, depthWrite: false,
      });
      box(sight, hologram, .041, .19, 0, .012, .059, .066);
      tube(sight, indicator, .048, .192, 0, .007, .014);
      break;
    }
    case 'neon-undercity': {
      const violet = glow('#ff298e', 1.5);
      standardMagazine(violet);
      const segments = Array.from({ length: 9 }, (_, i) => glow(i % 2 ? '#2afcec' : '#20bfd6', 1));
      for (const z of [-.092, .092]) {
        for (let i = 0; i < segments.length; i++) {
          const x = -.186 + i * .088, y = i < 6 ? .075 : .05;
          line(i < 6 ? body : guard, segments[i], x, y, x + .075, y, z);
        }
        line(body, violet, -.225, -.017, .24, -.046, z, .012);
        line(guard, violet, .39, -.047, .681, -.047, z, .012);
        plate(guard, physical('#8d4279', { map: finish.map, roughness: .25, iridescence: .63, clearcoat: .65 }),
          [[.435,-.013],[.61,-.013],[.644,.012],[.644,.044],[.435,.044]], .004, 0, 0, z, 0, z < 0);
      }
      animations.push((t, event) => {
        const restart = event.empRecovery ?? 0;
        const power = event.emp ? 0 : restart > 0 ? .33 + .67 * Number(Math.sin(t * 39) > 0) : 1;
        segments.forEach((light, i) => {
          light.emissiveIntensity = power * (.34 + 2.25 * Math.max(0, Math.sin(t * 4 - i * .74)) ** 2);
          light.color.setScalar(power ? .31 : .025);
        });
        indicator.emissiveIntensity = violet.emissiveIntensity = power * 1.62;
        indicator.color.setScalar(power ? .32 : .025);
        violet.color.setScalar(power ? .32 : .025);
      });
      break;
    }
    case 'jungle-temple': {
      standardMagazine(accent);
      const vine = standard('#718744', { roughness: .82 });
      for (const z of [-.085, .085]) {
        for (let i = 0; i < 4; i++) line(guard, vine, .397 + i * .071, -.04, .44 + i * .071, .072, z, .013);
        tube(body, accent, .254, .02, z, .039, .014, 'z');
        for (let i = 0; i < 8; i++) {
          const a = i * tau / 8;
          tube(body, accent, .254 + .05 * Math.cos(a), .02 + .05 * Math.sin(a), z, .006, .01, 'z');
        }
      }
      for (const [i, color] of ['#f1ad42', '#4bc4a5', '#d35d3d'].entries()) {
        const feather = standard(color, { roughness: .81 });
        const x = -.3 + i * .027;
        plate(stock, feather, [[x,.001],[x-.038,-.092],[x-.02,-.129],[x+.004,-.086]], .005, 0, 0, -.062, .002);
      }
      break;
    }
    case 'bloodmoon-castle': {
      canister(skin.light, accent, glow('#eb143a', .6));
      const arches = [[-.068,.006],[-.046,.034],[-.025,.006],[-.002,-.008],[.022,.006],[.046,.034],
        [.068,.006],[.059,-.031],[.031,-.012],[0,-.039],[-.031,-.012],[-.059,-.03]];
      for (const z of [-.092, .092]) {
        plate(guard, accent, arches, .008, .527, .003, z, .002);
        line(guard, accent, .656, -.026, .656, .052, z, .009);
        line(guard, accent, .638, .029, .675, .029, z, .009);
      }
      break;
    }
  }

  // 每个分组按材质合批，弹匣仍可独立参与换弹动画。
  for (const [group, byMaterial] of batches) {
    for (const [mat, parts] of byMaterial) {
      const geometry = parts.length > 1 ? mergeGeometries(parts) : parts[0];
      if (parts.length > 1) parts.forEach(part => part.dispose());
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.castShadow = !mat.transparent && !(mat.transmission > 0);
      mesh.receiveShadow = !mat.transparent;
      group.add(mesh);
    }
  }

  return {
    root, magazine, muzzle,
    update(time, signals = {}) { for (const animate of animations) animate(time, signals); },
    dispose() {
      root.removeFromParent();
      root.traverse(object => {
        if (object.isInstancedMesh) object.dispose();
        if (object.isMesh) object.geometry.dispose();
      });
      materials.forEach(mat => mat.dispose());
      textures.forEach(texture => texture.dispose());
    },
  };
}

// 六面反射环境也由 Canvas 生成。明暗不同的区域让抛光金属和湿表面显示轮廓。
export function createRifleEnvironment() {
  const faces = ['#c7daee', '#7690ab', '#f7e8d2', '#4c4953', '#adbfcc', '#666c7a'].map((color, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const light = ctx.createLinearGradient(0, 0, 54, 64);
    light.addColorStop(0, color); light.addColorStop(.38, '#536079'); light.addColorStop(1, '#252b35');
    ctx.fillStyle = light; ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#ffffffa8';
    ctx.fillRect(i % 2 ? 9 : 30, 6, 9, 48);
    return canvas;
  });
  const environment = new THREE.CubeTexture(faces);
  environment.colorSpace = THREE.SRGBColorSpace;
  environment.needsUpdate = true;
  return environment;
}

<script type="text/plain" data-level-module="@level-kit/rifle-textures.mjs">
const width = 512, height = 128;
const tau = Math.PI * 2;

export function rifleRandom(seed) {
  return () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 2 ** 32);
}

export function rifleTexture(THREE, w, h, paint, color = true) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  paint(ctx, w, h);
  const texture = new THREE.CanvasTexture(canvas);
  if (color) texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 4;
  return texture;
}

function stroke(ctx, points, color, weight = 2) {
  ctx.beginPath();
  points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.lineWidth = weight; ctx.strokeStyle = color; ctx.stroke();
}

function ring(ctx, x, y, radius, color, weight = 2) {
  ctx.beginPath(); ctx.arc(x, y, radius, 0, tau);
  ctx.lineWidth = weight; ctx.strokeStyle = color; ctx.stroke();
}

function type(ctx, text, x, y, color, size = 20) {
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function flecks(ctx, rand, colors, count, size) {
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(rand() * width, rand() * height, 1 + rand() * size, 1 + rand() * size * .4);
  }
}

function stains(ctx, rand, colors, count, size) {
  for (let i = 0; i < count; i++) {
    const x = rand() * width, y = rand() * height, r = 2 + rand() * size;
    const blend = ctx.createRadialGradient(x, y, 0, x, y, r);
    blend.addColorStop(0, colors[i % colors.length]); blend.addColorStop(1, 'transparent');
    ctx.fillStyle = blend; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

function hazard(ctx, x, y, w, h) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#eab92e'; ctx.fillRect(x, y, w, h);
  for (let i = -h; i < w; i += 34) {
    stroke(ctx, [[x + i, y + h], [x + i + h, y]], '#2c2921', 14);
  }
  ctx.restore();
}

function biohazard(ctx, x, y) {
  ctx.save(); ctx.translate(x, y);
  const ink = '#282f2c';
  ring(ctx, 0, 0, 16, ink, 4);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(tau / 3);
    ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(0, -16, 16, 0, tau); ctx.fill();
    ctx.fillStyle = '#c9cac1'; ctx.beginPath(); ctx.arc(0, -21, 11, 0, tau); ctx.fill();
    stroke(ctx, [[0, -6], [0, 4]], '#c9cac1', 5);
  }
  ring(ctx, 0, 0, 5, ink, 2); ctx.restore();
}

function bronzePattern(ctx, color) {
  // 饕餮的两半与云雷回纹共用同一高度图，受光时有实际凹刻感。
  for (const side of [1, -1]) {
    ctx.save(); ctx.translate(256, 66); ctx.scale(side, 1);
    stroke(ctx, [[0, -21], [15, -12], [30, -34], [74, -31], [101, -12], [76, -9], [64, -19],
      [37, -18], [22, 0], [40, 17], [66, 16], [85, 2], [72, 31], [44, 36], [25, 30], [0, 19]], color, 4);
    ring(ctx, 51, -3, 9, color, 5);
    ctx.restore();
  }
  for (const x of [14, 53, 93, 382, 421, 460]) {
    stroke(ctx, [[x, 54], [x + 34, 54], [x + 34, 91], [x + 5, 91], [x + 5, 63],
      [x + 24, 63], [x + 24, 82], [x + 13, 82], [x + 13, 71]], color, 3);
  }
}

function jadePattern(ctx, color) {
  for (let x = 12; x < width - 28; x += 42) {
    stroke(ctx, [[x, 36], [x, 27], [x + 9, 27], [x + 9, 18], [x + 26, 18], [x + 26, 27],
      [x + 35, 27], [x + 35, 36]], color, 3);
    stroke(ctx, [[x, 104], [x, 111], [x + 9, 111], [x + 9, 118], [x + 26, 118], [x + 26, 111],
      [x + 35, 111], [x + 35, 104]], color, 3);
  }
  stroke(ctx, [[63, 77], [91, 58], [121, 62], [163, 83], [202, 81], [240, 58],
    [283, 57], [323, 79], [360, 76], [389, 57], [411, 53], [441, 64], [418, 79], [394, 77]], color, 5);
  ring(ctx, 418, 63, 4, color, 3);
  for (let x = 130; x < 380; x += 17) {
    const y = 69 + Math.sin((x - 130) * .024) * 12;
    stroke(ctx, [[x, y], [x - 13, y - 14], [x - 4, y - 17], [x + 8, y]], color, 2);
  }
}

function normalPattern(THREE, paint) {
  return rifleTexture(THREE, width, height, ctx => {
    ctx.fillStyle = '#555'; ctx.fillRect(0, 0, width, height);
    paint(ctx, '#ddd');
    const source = ctx.getImageData(0, 0, width, height).data;
    const image = ctx.createImageData(width, height);
    const at = (x, y) => source[(y * width + x) * 4] / 255;
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        const a = (at(x - 1, y) - at(x + 1, y)) * 2;
        const b = (at(x, y - 1) - at(x, y + 1)) * 2;
        const scale = 127 / Math.hypot(a, b, 1), offset = (y * width + x) * 4;
        image.data.set([128 + a * scale, 128 - b * scale, 128 + scale, 255], offset);
      }
    }
    ctx.fillStyle = '#8080ff'; ctx.fillRect(0, 0, width, height);
    ctx.putImageData(image, 0, 0, 1, 1, width - 2, height - 2);
  }, false);
}

function voronoi(THREE) {
  const step = 37, columns = Math.ceil(width / step) + 2, rows = Math.ceil(height / step) + 2;
  const random = rifleRandom(31314);
  const cells = Array.from({ length: columns * rows }, (_, i) => ({
    x: (i % columns - 1 + .16 + random() * .68) * step,
    y: (Math.floor(i / columns) - 1 + .16 + random() * .68) * step,
  }));
  return rifleTexture(THREE, width, height, ctx => {
    const image = ctx.createImageData(width, height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const row = Math.floor(y / step), col = Math.floor(x / step);
        let nearest = Infinity, second = Infinity;
        const warp = 2.9 * Math.sin(y * .13) + 1.3 * Math.sin(x * .25);
        for (let cy = row; cy <= row + 2; cy++) {
          for (let cx = col; cx <= col + 2; cx++) {
            const cell = cells[cy * columns + cx];
            const d = (x + warp - cell.x) ** 2 + (y - cell.y) ** 2;
            if (d < nearest) { second = nearest; nearest = d; }
            else second = Math.min(second, d);
          }
        }
        const edge = Math.sqrt(second) - Math.sqrt(nearest);
        const glow = Math.max(0, 1 - edge / 2.8);
        const pixel = 4 * (y * width + x);
        image.data[pixel] = Math.round(255 * glow);
        image.data[pixel + 1] = Math.round(67 * glow * glow);
        image.data[pixel + 2] = Math.round(8 * glow);
        image.data[pixel + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);
  });
}

function royalMark(ctx) {
  const ink = '#6c4a2c';
  stroke(ctx, [[171, 59], [212, 41], [255, 42], [291, 56], [252, 71], [213, 72], [171, 59]], ink, 5);
  ring(ctx, 235, 56, 11, ink, 4);
  stroke(ctx, [[249, 69], [244, 91], [226, 106], [208, 100], [216, 91]], ink, 5);
  stroke(ctx, [[267, 66], [270, 87], [282, 95]], ink, 5);
  for (const x of [29, 70, 113, 328, 370, 416, 456]) {
    ring(ctx, x + 6, 52, 8, ink, 2);
    stroke(ctx, [[x - 7, 85], [x + 6, 66], [x + 20, 85], [x - 7, 85]], ink, 3);
  }
}

function gothicMark(ctx) {
  const silver = '#dbccd1';
  for (let x = 22; x < width; x += 43) {
    ctx.strokeStyle = silver; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(x - 13, 103); ctx.bezierCurveTo(x - 13, 85, x - 12, 75, x, 67);
    ctx.bezierCurveTo(x + 12, 75, x + 13, 85, x + 13, 103); ctx.closePath(); ctx.stroke();

  ring(ctx, 251, 45, 26, silver, 2);
  for (let i = 0; i < 8; i++) {
    const a = i * tau / 8;
    ring(ctx, 251 + Math.cos(a) * 14, 45 + Math.sin(a) * 14, 8, silver, 2);
  }
  stroke(ctx, [[16, 15], [197, 15], [212, 26]], silver);
  stroke(ctx, [[301, 26], [318, 15], [496, 15]], silver);
}

export function rifleFinish(THREE, id, skin) {
  const map = rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(74106);
    const paint = ctx.createLinearGradient(0, 0, 0, height);
    paint.addColorStop(0, skin.base); paint.addColorStop(.46, skin.base); paint.addColorStop(1, skin.dark);
    ctx.fillStyle = paint; ctx.fillRect(0, 0, width, height);
    switch (id) {
      case 'underground-lab':
        stains(ctx, rand, ['#66532b73', '#72803696', '#292b33a1'], 68, 20);
        hazard(ctx, 0, 5, 512, 23); hazard(ctx, 270, 96, 242, 19);
        biohazard(ctx, 226, 63); type(ctx, 'BIO / LAB-01', 22, 73, '#373b32');
        type(ctx, 'SPECIMEN', 293, 69, '#393e30', 22);
        break;
      case 'shanhai-secret-realm':
        stains(ctx, rand, ['#24584be8', '#63a688bb', '#55331dcc'], 133, 22);
        bronzePattern(ctx, '#d9a878');
        break;
      case 'rain-city':
        stains(ctx, rand, ['#9f421cdc', '#321f1bca', '#1c2839ca', '#cc7233b0'], 83, 29);
        flecks(ctx, rand, ['#949b8980', '#291c1870'], 240, 8);
        ctx.save(); ctx.translate(218, 75); ctx.rotate(-.11);
        type(ctx, '下城制造', -94, 7, '#a6d0ca', 41);
        stroke(ctx, [[-97, 17], [45, 22], [92, 10]], '#af633d', 5); ctx.restore();
        for (let i = 0; i < 72; i++) {
          const x = rand() * width, y = rand() * height;
          stroke(ctx, [[x, y], [x + 2, y + 5 + rand() * 45]], '#cae2f239', 1.3);
        }
        break;
      case 'buried-tomb':
        flecks(ctx, rand, ['#ffecc38c', '#70502a6b', '#b996546e'], 2100, 4);
        royalMark(ctx);
        break;
      case 'polar-station':
        ctx.fillStyle = '#e97029'; ctx.fillRect(8, 34, 205, 55);
        type(ctx, 'ARC / 05', 20, 71, '#252c30', 35); type(ctx, 'POLAR SURVEY', 237, 70, '#10223b', 23);
        stains(ctx, rand, ['#e1f5ff90', '#f3fbffb0'], 100, 14);
        flecks(ctx, rand, ['#f0f8ffc9', '#c3e8ffc0', '#527a986e'], 660, 4);
        break;
      case 'drowned-city':
        for (let i = 0; i < 44; i++) {
          const x = rand() * width, y = rand() * height;
          ring(ctx, x, y, 1 + rand() * 7, '#eef4e48c');
          stroke(ctx, [[x, y + 12], [x + 8, y], [x + 6, y - 12], [x + 16, y - 24]], '#39847f70', 2);
        }
        type(ctx, 'ABYSS', 173, 81, '#e1f2e4', 29);
        break;
      case 'ember-fortress':
        stains(ctx, rand, ['#87738465', '#060507d9'], 125, 18);
        flecks(ctx, rand, ['#b78b7f52', '#181218aa'], 300, 4);
        break;
      case 'derelict-station':
        hazard(ctx, 332, 78, 149, 35);
        type(ctx, 'OS-08', 21, 78, '#25394e', 44);
        type(ctx, 'ORBITAL SYSTEMS', 232, 55, '#244a70', 22);
        for (let x = 232; x < 486; x += 28) ring(ctx, x, 18, 5, '#4d7291');
        for (let i = 0; i < 62; i++) {
          const x = rand() * width, y = rand() * height;
          stroke(ctx, [[x, y], [x + 8 + rand() * 14, y - 4]], '#f5faff85', 1);
        }
        break;
      case 'neon-undercity':
        for (let y = 0; y < height; y += 8) {
          for (let x = 0; x < width; x += 8) {
            const warp = ((x + y) / 8) % 2;
            ctx.fillStyle = warp ? '#313140' : '#181923'; ctx.fillRect(x, y, 8, 8);
            ctx.fillStyle = warp ? '#474657' : '#252733';
            ctx.fillRect(x + (warp ? 1 : 0), y + (warp ? 0 : 1), warp ? 2 : 8, warp ? 8 : 2);
          }
        }
        ctx.fillStyle = '#623055'; ctx.fillRect(49, 33, 161, 54);
        type(ctx, '義体工房', 63, 71, '#fcc6f5', 31); type(ctx, '電脳 / 09', 264, 73, '#a5fff5', 27);
        break;
      case 'jungle-temple':
        stains(ctx, rand, ['#a9e49cbf', '#12746cbf', '#cde8a777'], 100, 28);
        jadePattern(ctx, '#cfdda3');
        break;
      case 'bloodmoon-castle':
        gothicMark(ctx);
        break;
      case 'sakura-night-town':
        for (const y of [10, 109]) {
          stroke(ctx, [[2, y], [118, y], [132, y + 8], [372, y + 8], [387, y], [510, y]], '#edb55a', 3);
        }
        for (let i = 0; i < 21; i++) {
          ctx.save(); ctx.translate(rand() * width, 24 + rand() * 74); ctx.rotate(rand() * tau);
          for (let petal = 0; petal < 5; petal++) {
            ctx.rotate(tau / 5); ctx.beginPath(); ctx.ellipse(0, -5, 3, 5, 0, 0, tau);
            ctx.fillStyle = '#e7b075ad'; ctx.fill();
          }
          ctx.restore();
        }
        break;
      case 'brass-factory':
        stains(ctx, rand, ['#70402ce0', '#402e28d0', '#26292c9f'], 78, 19);
        flecks(ctx, rand, ['#e6c68c', '#493f38', '#75513a'], 890, 4);
        for (let i = 0; i < 42; i++) {
          const x = rand() * width, y = rand() * height;
          stroke(ctx, [[x, y], [x + 8 + rand() * 30, y - 3]], '#f6dca985', 1);
        }
        type(ctx, 'BOILER WORKS', 143, 78, '#382f22', 27);
        break;
      case 'haunted-midway':
        for (let x = -60; x < width; x += 68) {
          stroke(ctx, [[x, height], [x + 64, 0]], '#d8c298', 32);
        }
        flecks(ctx, rand, ['#583e31c0', '#866040d0', '#443a31a8'], 1370, 8);
        for (let i = 0; i < 40; i++) {
          const y = rand() * height, x = rand() * width;
          stroke(ctx, [[x, y], [x + 18, y - 2], [x + 49, y]], '#402d287c', 1);
        }
        break;
    }
    flecks(ctx, rand, ['#fff8e03d', '#10151d30'], 330, 4);
    stroke(ctx, [[0, 4], [width, 4]], '#eee0c290', 2);
    stroke(ctx, [[0, 123], [width, 123]], '#211c2270', 2);

  return {
    map,
    normalMap: pattern ? normalPattern(THREE, pattern) : null,
    emissiveMap: id === 'ember-fortress' ? voronoi(THREE) : null,
  };
}

export function rifleWood(THREE, base) {
  return rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(7196);
    ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
    for (let i = 0; i < 145; i++) {
      const y = rand() * height, wave = rand() * 20 - 10;
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(124, y + wave, 294, y - wave, width, y + wave * .4);
      ctx.strokeStyle = i % 3 ? '#17101480' : '#f6ac634e';
      ctx.lineWidth = .4 + rand() * 1.9; ctx.stroke();
    }
  });
}

export function rifleFrost(THREE, base) {
  return rifleTexture(THREE, width, height, ctx => {
    const rand = rifleRandom(7943);
    ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
    stains(ctx, rand, ['#e4f6ffe8', '#aacde6a7'], 110, 24);
    flecks(ctx, rand, ['#ffffffaf', '#a8d1f1b0', '#f1faffdc'], 1400, 6);
  });
}

<script type="text/plain" data-level-module="@level-kit/runtime.mjs">
import { makeConfig } from '@level-kit/config.mjs';
import { createWorld, createGrid } from '@level-kit/world.mjs';
import { createRendering } from '@level-kit/rendering.mjs';
import { createEffectClasses } from '@level-kit/effects.mjs';
import { createSoundClass } from '@level-kit/audio.mjs';
import { createBeastClasses } from '@level-kit/beasts.mjs';
import { createPlayerClass } from '@level-kit/player.mjs';
import { createPickupClass } from '@level-kit/pickups.mjs';
import { createWeaponClass } from '@level-kit/weapon.mjs';
import { rifleSkins, resolveRifleSkin } from '@level-kit/rifle-skins.mjs';
import { createUIClass } from '@level-kit/ui.mjs';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

export function startLevel(definition, campaign = null, campaignStage = 0) {
  if (typeof definition?.buildMap !== 'function') throw new TypeError('关卡需要实现 buildMap()');
  const $ = id => document.getElementById(id);
  const canvas = $('world');
  const menus = $('menu');
  const CONFIG = makeConfig(definition.config, campaignStage);
  const GRID = createGrid(definition.grid, CONFIG.map.cell);
  const visual = createRendering({ CONFIG, definition, canvas });
  const { THREE, scene, camera, renderer, composer, bloom, weaponCamera, weaponPass } = visual;
  const { clamp, lerp } = THREE.MathUtils;
  const V3 = THREE.Vector3;
  const TAU = Math.PI * 2;
  const Y_AXIS = new V3(0, 1, 0);
  const workColor = new THREE.Color();
  const brighter = (color, power = 1) => new THREE.Color(color).multiplyScalar(power);
  const randomRange = (a, b) => lerp(a, b, Math.random());
  const palette = definition.palette ?? {};
  const colors = {
    projectileTint: brighter(palette.projectile ?? 0x9bfa48, 2.3),
    ichor: new THREE.Color(palette.ichor ?? 0x9b4763),
    spark: brighter(palette.spark ?? 0xffc280, 3.3),
    coreTint: brighter(palette.core ?? 0xffa064, 2.6),
    rareTint: brighter(palette.rare ?? 0x84eccc, 1.7),
    ammoTint: brighter(palette.ammo ?? 0x7fc8ed, 1.1),
  };
  const TEXT = makeText(definition);
  const context = {
    ...visual, CONFIG, GRID, definition, TEXT, colors, $, clamp, lerp, V3, TAU, Y_AXIS,
    brighter, workColor, randomRange, seededRandom,
  };
  document.title = definition.pageTitle ?? TEXT.title;
  const { Level, Navigation } = createWorld(context);
  const { Effects, Rift, Projectiles } = createEffectClasses(context);
  const { BeastManager } = createBeastClasses(context);
  const Sound = createSoundClass(context);
  const Player = createPlayerClass(context);
  const Pickups = createPickupClass(context);
  const WeaponSystem = createWeaponClass(context);
  const UI = createUIClass(context);

  const level = new Level();
  const mapData = definition.buildMap({ ...context, level });
  const gate = definition.portal ?? {};
  const gateShield = gate.shield === false ? null : level.box(level.gate.x, level.gate.z,
    gate.width ?? 4.05, gate.depth ?? 0.15, level.gate.y + 0.10, level.gate.y + (gate.height ?? 4.72));
  const nav = new Navigation(level);
  const look = new THREE.PerspectiveCamera();
  const controls = new PointerLockControls(look, canvas);
  controls.pointerSpeed = CONFIG.player.mouseSpeed;
  controls.minPolarAngle = 0.04;
  controls.maxPolarAngle = Math.PI - 0.04;

  const input = {
    down: new Set(), fire: false, jump: false, reload: false, interact: false,
    clear() { this.down.clear(); this.fire = this.jump = this.reload = this.interact = false; },
  };
  const sound = new Sound(), effects = new Effects();
  const environment = definition.createEnvironment?.({ ...context, level, mapData, sound });
  const rift = definition.createPortal?.({ ...context, level, mapData, sound }) ?? new Rift(level.gate);
  const player = new Player(level, look), beasts = new BeastManager(level, nav);
  const projectiles = new Projectiles(level, effects), pickups = new Pickups(level, effects);
  const skinId = resolveRifleSkin(campaign?.equippedSkin, resolveRifleSkin(definition.weaponSkin));
  const weapon = new WeaponSystem(skinId), ui = new UI(level);
  $('rifle-label').textContent = rifleSkins[skinId].name;
  const burstPoint = new V3();
  const blastTint = brighter(palette.blast ?? 0xb78cff, 2.8);
  const encounter = definition.createEncounter?.({ ...context, level, mapData, sound });

  const game = {
    level, player, beasts, pickups, weapon, effects, sound, projectiles, ui, encounter,
    phase: 'ready', time: 0, kills: 0, core: false, bossDead: false, loot: [], value: 0,
    hitStop: 0, shotAt: -Infinity, shotX: 0, shotY: 0, shotZ: 0, shotHearingScale: 1,
    footstep: { at: -Infinity, x: 0, y: 0, z: 0, radius: 0 }, blast: 0, blastClock: 0,
    threat: Infinity, threatDelay: 0,
    reset() {
      campaign?.reset();
      this.time = 0; this.kills = 0; this.core = false; this.bossDead = false; this.loot.length = 0; this.value = 0;
      this.shotAt = -Infinity; this.footstep.at = -Infinity; encounter?.reset?.(); this.hitStop = 0; this.blast = 0; this.blastClock = 0;
      this.threat = Infinity; this.threatDelay = 0;
      if (gateShield) gateShield.active = true;
      player.reset(); beasts.reset(player); projectiles.reset(); effects.reset(); pickups.reset(); weapon.reset(); ui.reset();
      input.clear();
    },
    ready() { return this.kills >= CONFIG.beasts.killsToWin && this.bossDead && this.core; },
    nearGate() {
      return Math.abs(player.y - level.gate.y) < (gate.verticalRange ?? 2) && Math.hypot(player.x - level.gate.x, player.z - level.gate.z) < (gate.useRadius ?? 4.55);
    },
    trigger() {
      if (!this.ready() || !this.nearGate() || this.blast > 0) return;
      this.blast = 0.001; this.blastClock = 0;
      if (gateShield) gateShield.active = false;
      sound.blast();
      burstPoint.copy(level.gate); burstPoint.y += 1.8;
      effects.spray(burstPoint, colors.coreTint, 150, 15.5, 0.15, 'spark');
      burstPoint.y += 0.45;
      effects.spray(burstPoint, blastTint, 82, 9.2, 0.23, 'mist');
      player.shake = 1.34; weapon.group.visible = false; input.clear();
    },
    finish(won) {
      if (this.phase !== 'play') return;
      this.phase = won ? 'win' : 'fail';
      if (!won) { this.loot.length = 0; this.value = 0; }
      input.clear();
      sound.active(false);
      if (document.pointerLockElement === canvas) controls.unlock();
      ui.nodes.hud.hidden = true; weapon.group.visible = false;
      ui.menu(this.phase, this);
      campaign?.finish({ won, kills: this.kills, durationMs: Math.round(this.time * 1000), loot: this.loot });
    },
    step(dt) {
      this.time += dt;
      encounter?.update(this, dt);
      if (this.phase !== 'play') return;
      this.threatDelay -= dt;
      const frozen = Math.min(dt, this.hitStop);
      this.hitStop -= frozen;
      if (!this.blast) {
        weapon.combat.passive(dt, this);
        player.update(dt - frozen, input, this);
        if (input.interact) {
          input.interact = false;
          if (this.nearGate()) {
            if (!this.ready()) ui.notify(TEXT.locked, 1.55);
            this.trigger();
          } else {
            encounter?.interact?.(this);
          }
        }
        if (!this.blast) {
          player.positionCamera(0);
          weapon.update(dt, input, this);
          if (encounter?.beastsDisabled) beasts.fadeHitFlashes(dt, this);
          else beasts.update(dt - frozen, player, this);
          projectiles.update(dt - frozen, player, this);
          if (this.phase !== 'play') return;
          pickups.update(dt, player, this);
          if (this.threat < 8.1 && this.threatDelay <= 0 && !player.protected(this)) {
            sound.tone(65, 47, 0.35, clamp((9 - this.threat) * 0.022, 0.035, 0.18), 'sine');
            this.threatDelay = clamp(0.52 + this.threat * 0.10, 0.56, 1.4);
          }
        }
      } else {
        this.blastClock += dt;
        this.blast = clamp(this.blastClock / CONFIG.effects.gateDuration, 0.001, 1);
        player.shake = Math.max(player.shake, (1 - this.blast) * 0.70);
        if (this.blast >= 1) this.finish(true);
      }
      effects.update(dt);
      player.positionCamera(dt);
      weapon.render(dt, player, this);
      ui.update(dt, this);
    },
  };

  function pause() {
    if (game.phase !== 'play') return;
    game.phase = 'pause';
    input.clear(); sound.active(false);
    ui.menu('pause', game);
  }

  function startGame() {
    if (!canvas.requestPointerLock) {
      ui.text('menu-status', '此浏览器无法锁定鼠标，请使用支持 Pointer Lock 的桌面浏览器。');
      return;
    }
    if (document.pointerLockElement === canvas) return;
    ui.text('menu-status', '');
    try {
      // r160 控制器不返回锁定请求。直接在点击事件里发起请求，兼容有无 Promise 的实现。
      const result = canvas.requestPointerLock();
      result?.catch(lockError);
      sound.open();
    } catch {
      lockError();
    }
  }

  function lockError() {
    ui.text('menu-status', '鼠标锁定未成功。请聚焦此窗口，再点击进入游戏。');
  }

  controls.addEventListener('lock', () => {
    if (game.phase !== 'pause') game.reset();
    if (menus.open) menus.close();
    game.phase = 'play';
    ui.nodes.hud.hidden = false;
    weapon.group.visible = game.blast === 0;
    sound.active(true);
    ui.update(0, game);
  });
  controls.addEventListener('unlock', pause);
  document.addEventListener('pointerlockerror', lockError);
  menus.addEventListener('cancel', event => event.preventDefault());
  $('start').addEventListener('click', startGame);
  $('sound').addEventListener('click', () => {
    sound.toggle();
    $('sound').setAttribute('aria-pressed', String(sound.enabled));
    ui.text('sound', sound.enabled ? '音效开启' : '音效关闭');
  });

  const capturedKeys = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'KeyE', 'Space', 'ShiftLeft', 'ShiftRight']);
  if (CONFIG.player.crouch) capturedKeys.add('KeyC');
  document.addEventListener('keydown', event => {
    if (game.phase !== 'play') return;
    if (event.code === 'Escape' && document.pointerLockElement === canvas) {
      event.preventDefault(); controls.unlock(); return;
    }
    if (!capturedKeys.has(event.code)) return;
    event.preventDefault();
    input.down.add(event.code);
    if (event.repeat) return;
    if (event.code === 'KeyR') input.reload = true;
    if (event.code === 'Space') input.jump = true;
    if (event.code === 'KeyE') input.interact = true;
  });
  document.addEventListener('keyup', event => input.down.delete(event.code));
  document.addEventListener('mousedown', event => {
    if (event.button !== 0 || game.phase !== 'play' || document.pointerLockElement !== canvas) return;
    event.preventDefault(); input.fire = true;
  });
  document.addEventListener('mouseup', event => { if (event.button === 0) input.fire = false; });
  window.addEventListener('blur', input.clear.bind(input));
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  function resize() {
    const width = canvas.clientWidth || window.innerWidth, height = canvas.clientHeight || window.innerHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, CONFIG.graphics.maxPixelRatio);
    camera.aspect = weaponCamera.aspect = width / height;
    camera.updateProjectionMatrix(); weaponCamera.updateProjectionMatrix();
    renderer.setPixelRatio(ratio); renderer.setSize(width, height, false);
    composer.setPixelRatio(ratio); composer.setSize(width, height);
    bloom.setSize(width * ratio * CONFIG.graphics.bloomScale, height * ratio * CONFIG.graphics.bloomScale);

  let lastFrame = 0, worldTime = 0, requested = 0;

    requested = 0;

    const dt = lastFrame ? clamp((now - lastFrame) / 1000, 0, 0.040) : 0;
    lastFrame = now;
    worldTime += dt;
    // 失焦时暂停模拟和 WebGL 绘制，重新进入页面不补算隐藏期间的时间。
    if (game.phase === 'play') game.step(dt);
    if (game.phase === 'play' || game.phase === 'pause' || game.phase === 'win' || game.phase === 'fail') {
      beasts.render(game.phase === 'play' && !game.encounter?.beastsDisabled ? dt : 0, game.time, game.encounter?.beastsDisabled);
    }
    pickups.render(game.phase === 'ready' ? worldTime : game.time);
    environment?.update(worldTime, game.phase === 'play', game);
    rift.update(worldTime, game.ready(), game.blast);
    renderer.info.reset();
    weaponPass.enabled = weapon.group.visible;
    composer.render(dt);
    requested = requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (requested) cancelAnimationFrame(requested);
      requested = 0; lastFrame = 0;
      pause();
      if (document.pointerLockElement === canvas) controls.unlock();
      if (sound.ctx?.state === 'running') sound.ctx.suspend().catch(() => {});
    } else if (!requested) {
      requested = requestAnimationFrame(animate);
    }
  });
  pickups.reset();
  resize();
  $('start').disabled = false;
  ui.menu('ready', game);
  requested = requestAnimationFrame(animate);

  return { game, scene, camera, renderer, config: CONFIG, grid: GRID, nav };
}

function seededRandom(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function makeText(definition) {
  const theme = definition.text ?? {};
  const enemy = theme.enemy ?? '凶兽';
  const keyItem = theme.keyItem ?? '关键道具';
  const portal = theme.portal ?? '传送门';
  const loot = theme.loot ?? '宝物';
  const bossName = theme.bossName ?? '首领凶兽';
  return {
    tag: '地图关卡', title: '走位射击', enter: '进入关卡',
    brief: '沿开阔路线边打边退，击杀凶兽，夺取关键道具并引爆传送门，带走沿途找到的宝物。',
    pauseBrief: '返回地图后，战斗会从暂停处继续。',
    winBrief: `你已引爆${portal}，带着搜集到的${loot}成功撤离。`,
    failBrief: `你在战斗中倒下，本局拾取的${loot}已丢失。`,
    objective: `清除${enemy}，击杀${bossName}并夺取${keyItem}`,
    exitObjective: `前往${portal}，按 E 引爆`,
    detonating: `${portal}屏障崩解中`,
    coreCollected: `已取得${keyItem}，前往${portal}`,
    bossDefeated: `${bossName}已倒下，靠近拾取${keyItem}`,
    rage: `${bossName}狂暴，群攻体正在聚集`,
    locked: `解除封印需要达到击杀目标并取得${keyItem}`,
    safe: '出生安全区',
    enemy, portal, bossName, keyItem, loot,
    ...theme,
  };
}

<script type="text/plain" data-level-module="@level-kit/stage-craft.mjs">
// 供街町与机坊共用的造景工具。尺寸统一用米，实体地形与可见网格由同一参数生成。
export function stageBuilder(context, palette, texture) {
  const { THREE, scene, level, GRID, StaticBatches, shapes } = context;
  const materials = Object.fromEntries(
    Object.entries(palette).map(([name, color]) => [name, new THREE.MeshLambertMaterial({ color })]),
  );
  materials.light = new THREE.MeshBasicMaterial({ color: 0xffffff });
  if (texture) materials.surface = new THREE.MeshLambertMaterial({ map: texture });
  const geometry = {
    ...shapes,
    roof: new THREE.CylinderGeometry(0.28, 0.72, 1, 4, 1, false, Math.PI / 4),
    cone: new THREE.ConeGeometry(0.5, 1, 10),
    orb: new THREE.IcosahedronGeometry(0.55, 1),
    ring: new THREE.TorusGeometry(0.5, 0.065, 6, 22),
  };
  const batch = new StaticBatches(materials, geometry);
  const part = (...args) => batch.add(...args);
  function block(material, x, z, w, d, y0, y1, solid = false, climb = false) {
    part('box', material, x, (y1 + y0) / 2, z, w, y1 - y0, d);
    if (solid) level.box(x, z, w, d, y0, y1, climb);
  }
  function column(material, x, z, diameter, y0, y1, solid = false) {
    part('cylinder', material, x, (y1 + y0) / 2, z, diameter, y1 - y0, diameter);
    if (solid) level.box(x, z, diameter * 0.84, diameter * 0.84, y0, y1);
  }
  function beam(material, start, end, width, shape = 'box') {
    const a = new THREE.Vector3(...start),
      delta = new THREE.Vector3(...end).sub(a);
    const center = a.addScaledVector(delta, 0.5),
      length = delta.length();
    const e = new THREE.Euler().setFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize()),
    );
    part(shape, material, center.x, center.y, center.z, width, length, width, 0xffffff, e.y, e.x, e.z);
  }
  function floor(material) {
    block(material, 0, 0, GRID.halfX * 2, GRID.halfZ * 2, -0.24, -0.015);
  }
  function lighting(sky, ground, rim, locations) {
    scene.add(new THREE.HemisphereLight(sky, ground, 1.65));
    const moon = new THREE.DirectionalLight(rim, 1.7);
    moon.position.set(-26, 48, -35);
    scene.add(moon);
    for (const [x, y, z, color, intensity, range] of locations) {
      const light = new THREE.PointLight(color, intensity, range, 1.45);
      light.position.set(x, y, z);
      scene.add(light);
    }
  }
  return { part, block, column, beam, floor, lighting, flush: () => batch.flush() };
}

// 三段式平台可由两端上下。视觉踏步与基础地形采用相同阶高，寻路和拾取可直接使用地表高度。
export function stairDeck(x, z, width, length, run, rise, axis = 'z') {
  const steps = Math.ceil(rise / 0.24);
  function coordinates(distance, lateral = 0) {
    return axis === 'z' ? [x + lateral, z + distance] : [x + distance, z + lateral];
  }
  function height(px, pz) {
    const along = Math.abs(axis === 'z' ? pz - z : px - x);
    const across = Math.abs(axis === 'z' ? px - x : pz - z);
    if (across > width / 2 || along >= length / 2 + run) return 0;
    if (along <= length / 2) return rise;
    return (rise * Math.ceil((1 - (along - length / 2) / run) * steps)) / steps;
  }
  function draw(builder, material) {
    const segment = (s, l, h) => {
      const [cx, cz] = coordinates(s);
      builder.block(material, cx, cz, axis === 'z' ? width : l, axis === 'z' ? l : width, -0.02, h, true, true);
    };
    segment(0, length, rise);
    for (const sign of [-1, 1])
      for (let i = 0; i < steps; i++) {
        segment(
          sign * (length / 2 + ((i + 0.5) * run) / steps),
          run / steps + 0.002,
          (rise * (steps - i)) / steps,
        );
      }
  }
  return { height, draw };
}

// 每种轮廓仅合并一次，普通与发光部件沿用共享实例化凶兽对象池。
export function creatureParts({ THREE, shapes, mergeGeometries }) {
  const body = [],
    light = [];
  const gem = new THREE.IcosahedronGeometry(0.55, 0),
    horn = new THREE.ConeGeometry(0.5, 1, 6);
  const source = { ...shapes, gem, horn };
  const stamp = new THREE.Object3D();
  function add(shape, color, x, y, z, w, h, d, pitch = 0, roll = 0, yaw = 0, luminous = false) {
    const base = source[shape];
    const geometry = base.index ? base.toNonIndexed() : base.clone();
    stamp.position.set(x, y, z);
    stamp.scale.set(w, h, d);
    stamp.rotation.set(pitch, yaw, roll);
    stamp.updateMatrix();
    geometry.applyMatrix4(stamp.matrix);
    const rgb = new THREE.Color(color),
      values = new Float32Array(geometry.attributes.position.count * 3);
    for (let i = 0; i < values.length; i += 3) rgb.toArray(values, i);
    geometry.setAttribute('color', new THREE.BufferAttribute(values, 3));
    (luminous ? light : body).push(geometry);
  }
  function finish() {
    const result = [mergeGeometries(body), mergeGeometries(light)];
    for (const geo of [...body, ...light, gem, horn]) geo.dispose();
    return result;
  }
  return { add, finish };
}

export function skySpecks({ THREE, scene, seededRandom }, count, span, color, size, seed) {
  const random = seededRandom(seed),
    positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (random() - 0.5) * span;
    positions[i * 3 + 1] = 2 + random() * 13;
    positions[i * 3 + 2] = (random() - 0.5) * span;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const points = new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      size,
      color,
      transparent: true,
      opacity: 0.82,
      depthWrite: false,
      sizeAttenuation: true,
    }),
  );
  scene.add(points);
  return points;
}
</script>
<script type="text/plain" data-level-module="@level-kit/ui.mjs">
export function createUIClass({ CONFIG, GRID, TEXT, $, V3, TAU, definition }) {
  class UI {
    constructor(level) {
      this.level = level;
      this.nodes = {};
      for (const name of ['menu', 'menu-title', 'menu-tag', 'menu-text', 'loot-title', 'boss-title', 'menu-status', 'guide', 'summary', 'start', 'sound', 'hud', 'area', 'objective', 'kills', 'loot',
        'map', 'boss', 'boss-phase', 'boss-health', 'health', 'hp', 'stamina', 'energy', 'condition', 'condition-title', 'condition-time', 'condition-meter', 'condition-detail', 'hud-announcement', 'crouch-help', 'posture', 'ammo', 'reserve', 'weapon-state', 'cross', 'message', 'injury', 'blast']) this.nodes[name] = $(name);
      this.ctx = this.nodes.map.getContext('2d');
      this.size = this.nodes.map.width;
      this.facing = new V3();
      this.tick = 0; this.hitTime = 0; this.noticeTime = 0;
      this.base = document.createElement('canvas');
      this.base.width = this.base.height = this.size;
      this.drawBase();
      this.text('menu-tag', TEXT.tag);
      this.text('loot-title', TEXT.loot);
      this.text('boss-title', TEXT.bossName);
      this.nodes.boss.setAttribute('aria-label', TEXT.bossName + '状态');
      this.nodes['boss-health'].setAttribute('aria-label', TEXT.bossName + '生命值');
      this.nodes['crouch-help'].hidden = !CONFIG.player.crouch;
      this.nodes.health.max = CONFIG.player.health;
      this.nodes.stamina.max = CONFIG.player.stamina;
      this.nodes['boss-health'].max = CONFIG.beasts.types[3].hp;
    }
    px(x) { return (x + GRID.halfX) / (GRID.halfX * 2) * this.size; }
    pz(z) { return (z + GRID.halfZ) / (GRID.halfZ * 2) * this.size; }
    drawBase() {
      const ctx = this.base.getContext('2d'), size = this.size;
      ctx.fillStyle = '#152735'; ctx.fillRect(0, 0, size, size);
      const style = definition.minimap ?? {};
      const draw = { ctx, px: x => this.px(x), pz: z => this.pz(z), size };
      style.beforeTiles?.(draw);
      const palette = style.tiles ?? { '#': '#3a556b' };
      const w = size / GRID.columns, h = size / GRID.rows;
      for (let row = 0; row < GRID.rows; row++) {
        for (let column = 0; column < GRID.columns; column++) {
          const color = palette[GRID.cells[row][column]];
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(column * w + 0.42, row * h + 0.42, Math.max(0, w - 0.84), Math.max(0, h - 0.84));
        }
      }
      style.afterTiles?.(draw);
      ctx.strokeStyle = '#6d95bf2d'; ctx.lineWidth = 1;
      for (let i = 36; i < size; i += 36) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
      }
      ctx.fillStyle = '#ffb171'; ctx.fillRect(this.px(this.level.gate.x) - 3, this.pz(this.level.gate.z) - 3, 6, 6);
      ctx.fillStyle = '#a1a086'; ctx.fillRect(this.px(this.level.bossAnchor.x) - 2, this.pz(this.level.bossAnchor.z) - 2, 4, 4);
    }
    drawMap(game) {
      const ctx = this.ctx;
      ctx.drawImage(this.base, 0, 0);
      definition.minimap?.overlay?.({ ctx, px: x => this.px(x), pz: z => this.pz(z), game });
      for (const b of game.beasts.pool) {
        if (!b.active) continue;
        ctx.fillStyle = b.type === 3 ? '#ff9a71' : '#f45f76';
        ctx.beginPath(); ctx.arc(this.px(b.x), this.pz(b.z), b.type === 3 ? 3.2 : 1.5, 0, TAU); ctx.fill();
        if (b.statusEffects.has('marked')) {
          ctx.strokeStyle = '#ffd780'; ctx.beginPath(); ctx.arc(this.px(b.x), this.pz(b.z), 4.4, 0, TAU); ctx.stroke();
        }
      }
      if (game.bossDead && !game.core) {
        const core = game.pickups.objects.find(item => item.active && item.kind === 'core');
        if (core) {
          ctx.strokeStyle = '#ffd89a'; ctx.strokeRect(this.px(core.x) - 3, this.pz(core.z) - 3, 6, 6);
        }
      }
      this.facing.set(0, 0, -1).applyQuaternion(game.player.look.quaternion);
      ctx.save();
      ctx.translate(this.px(game.player.x), this.pz(game.player.z));
      ctx.rotate(Math.atan2(this.facing.x, -this.facing.z));
      ctx.fillStyle = '#b0fff0'; ctx.strokeStyle = '#102738'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4.6, 5); ctx.lineTo(0, 2.5); ctx.lineTo(-4.6, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    text(name, value) {
      if (this.nodes[name].textContent !== value) this.nodes[name].textContent = value;
    }
    notify(text, duration) {
      this.notice = text; this.noticeTime = duration;
      this.text('hud-announcement', text);
    }
    hit(kind) {
      this.nodes.cross.dataset.hit = kind;
      this.hitTime = kind === 'kill' ? 0.20 : 0.12;
    }
    reset() {
      this.tick = 0; this.hitTime = 0; this.noticeTime = 0;
      this.nodes.cross.dataset.hit = '';
      this.nodes.blast.style.opacity = '0'; this.nodes.injury.style.opacity = '0';
      this.nodes.message.hidden = true; this.nodes.boss.hidden = true;
      this.nodes.condition.hidden = true; this.nodes.posture.hidden = true;
      this.nodes.hud.removeAttribute('data-offline');
      this.text('hud-announcement', '');
    }
    update(dt, game) {
      if (this.hitTime > 0) {
        this.hitTime -= dt;
        if (this.hitTime <= 0) this.nodes.cross.dataset.hit = '';
      }
      this.noticeTime -= dt;
      if (this.noticeTime <= 0) this.text('hud-announcement', '');
      const { player: p, weapon: w } = game;
      this.nodes.injury.style.opacity = (p.damageVignette * 0.81).toFixed(3);
      const blast = game.blast;
      this.nodes.blast.style.opacity = blast > 0 && blast < 1 ? String(Math.sin(blast ** 0.47 * Math.PI) * 0.86) : '0';
      this.tick -= dt;
      if (this.tick > 0) return;
      this.tick = 0.062;
      const status = w.combat.status(game);
      const condition = game.encounter?.status ?? (status ? { title: '武器特性', detail: '' } : null);
      this.nodes.condition.hidden = !condition;
      if (condition) {
        this.text('condition-title', condition.title);
        const meter = this.nodes['condition-meter'];
        meter.hidden = !Number.isFinite(condition.value);
        if (!meter.hidden) meter.value = condition.value;
        const readout = condition.readout ?? (Number.isFinite(condition.remaining) ? Math.max(0, Math.ceil(condition.remaining)) + ' 秒' : '');
        this.text('condition-time', readout);
        this.text('condition-detail', [condition.detail, status].filter(Boolean).join(' / '));
      }
      const offline = game.encounter?.hudOffline === true;
      this.nodes.hud.toggleAttribute('data-offline', offline);
      if (offline) return;
      this.text('area', this.level.area(p.x, p.z, p.y));
      this.text('hp', String(Math.ceil(p.hp)));
      this.text('energy', String(Math.ceil(p.energy)));
      this.nodes.posture.hidden = !p.crouched;
      this.nodes.health.value = p.hp; this.nodes.stamina.value = p.energy;
      this.text('ammo', String(w.ammo).padStart(2, '0'));
      this.text('reserve', '/ ' + w.reserve);
      this.text('weapon-state', w.reloadLeft > 0 ? '换弹中 ' + (Math.ceil(w.reloadLeft * 10) / 10).toFixed(1) + ' 秒' : w.ammo === 0 && w.reserve === 0 ? '弹药耗尽' : '');
      this.nodes.cross.style.setProperty('--gap', (7 + w.heat * 12 + (p.sprinting ? 5 : 0)).toFixed(1) + 'px');
      this.text('loot', game.loot.length + ' / ' + (definition.loot?.length ?? 0));
      this.text('kills', game.kills + ' / ' + CONFIG.beasts.killsToWin);
      const remaining = Math.max(0, CONFIG.beasts.killsToWin - game.kills);
      const objective = blast ? TEXT.detonating : game.ready() ? TEXT.exitObjective :
        game.core ? `已取得${TEXT.keyItem}，还需击杀 ${remaining} 只${TEXT.enemy}` :
          game.bossDead ? '靠近掉落物，拾取' + TEXT.keyItem : TEXT.objective;
      this.text('objective', objective);
      const boss = game.beasts.boss;
      this.nodes.boss.hidden = !boss || Math.hypot(boss.x - p.x, boss.z - p.z) > 28;
      if (!this.nodes.boss.hidden) {
        this.text('boss-phase', boss.rage ? '狂暴' : '第一阶段');
        this.nodes['boss-health'].value = Math.max(boss.hp, 0);
      }
      let note = !blast && this.noticeTime > 0 ? this.notice : '';
      if (game.nearGate()) {
        if (game.ready() && !game.blast) note = '按 E 引爆' + TEXT.portal;
        else if (!note && !game.blast) note = ['屏障封印', remaining ? '还需击杀 ' + remaining + ' 只' : '', game.core ? '' : '需要' + TEXT.keyItem].filter(Boolean).join(' / ');
      } else if (!note && !blast) {
        note = game.encounter?.interactionHint?.(game) ??
          (p.protected(game) ? TEXT.safe + ' / ' + Math.max(0, Math.ceil(CONFIG.player.safeTime - game.time)) + ' 秒' : '');
      }
      this.nodes.message.hidden = !note;
      if (note) this.text('message', note);
      this.drawMap(game);
    }
    menu(mode, game) {
      const overlay = this.nodes.menu;
      this.text('menu-title', mode === 'pause' ? '行动暂停' : mode === 'win' ? '撤离成功' : mode === 'fail' ? '撤离失败' : TEXT.title);
      this.text('menu-text', mode === 'pause' ? TEXT.pauseBrief : mode === 'win' ? TEXT.winBrief : mode === 'fail' ? TEXT.failBrief : TEXT.brief);
      this.text('start', mode === 'pause' ? '继续游戏' : mode === 'ready' ? TEXT.enter : '再来一局');
      this.text('menu-status', '');
      const ended = mode === 'win' || mode === 'fail';
      this.nodes.guide.hidden = ended;
      this.nodes.summary.hidden = !ended;
      if (ended) this.text('summary', '累计击杀 ' + game.kills + ' 只 / 带回 ' + game.loot.length + ' 件' + TEXT.loot + ' / 结算价值 ' + game.value);
      if (!overlay.open) overlay.showModal();
      this.nodes.start.focus({ preventScroll: true });
    }
  }

  return UI;
}
</script>
<script type="text/plain" data-level-module="@level-kit/weapon-perks.mjs">
// 特性按实际佩戴的步枪选择；事件与敌人阵营始终读取当前战场。
const effectTitles = {
  corrosion: '∴ 酸蚀',
  thunder: 'ϟ 雷印',
  wet: '≈ 潮湿',
  sand: '≋ 流沙',
  frost: '✳ 寒霜',
  burn: '△ 灼烧',
  rooted: '⊠ 定身',
  frozen: '✳ 冻结',
  stunned: 'ϟ 麻痹',
  hover: '↑ 悬浮',
  stone: '◆ 石化',
  stopped: '∥ 停机',
  confused: '⟳ 混乱',
  slowed: '↓ 减速',
  bossSlow: '↓ 抗性减速',
  marked: '◎ 标记',
  poison: '∴ 中毒',
  seal: '◇ 符咒',
  scald: '△ 烫伤',
  gear: '⊗ 齿轮卡滞',
  ribbon: '∞ 彩带',
  grounded: '↓ 击落',
};
const controlKinds = new Set(['rooted', 'frozen', 'stunned', 'hover', 'stone', 'stopped']);
const machineStages = new Set(['neon-undercity', 'brass-factory']);
const beastStages = new Set([
  'shanhai-secret-realm',
  'rain-city',
  'buried-tomb',
  'polar-station',
  'drowned-city',
  'ember-fortress',
  'jungle-temple',
]);
const waterStages = new Set(['drowned-city', 'jungle-temple']);
const coefficients = new Map();

// 连续未触发时线性增加机会；求出系数，使长期平均触发率仍等于配置值。
function chanceCoefficient(rate) {
  if (coefficients.has(rate)) return coefficients.get(rate);
  let low = 0,
    high = rate;
  for (let i = 0; i < 32; i++) {
    const c = (low + high) / 2;
    let survival = 1,
      average = 0;
    for (let k = 1; survival > 1e-10; k++) {
      average += survival;
      survival *= Math.max(0, 1 - c * k);
    }
    if (1 / average < rate) low = c;
    else high = c;
  }
  coefficients.set(rate, high);
  return high;
}

function put(target, kind, time, seconds, limit = 1, amount = 1) {
  let effect = target.statusEffects.get(kind);
  if (!effect || effect.until <= time) {
    effect = { type: kind, stacks: 0, until: 0, tickAt: time + 0.5 };
    target.statusEffects.set(kind, effect);
  }
  effect.stacks = Math.min(limit, effect.stacks + amount);
  effect.until = time + seconds;
  return effect;
}

function active(target, kind, now) {
  const effect = target.statusEffects.get(kind);
  return effect?.until > now ? effect : null;
}

function push(target, origin, speed) {
  const x = target.x - origin.x,
    z = target.z - origin.z;
  const distance = Math.hypot(x, z) || 1;
  const strength = target.type === 3 ? speed * 0.4 : speed;
  target.perkPushX += (x / distance) * strength;
  target.perkPushZ += (z / distance) * strength;
}

function drop(target, game, kind, name, value) {
  const y = game.beasts.dropHeight(target);
  game.pickups.add(kind, target.x - 0.19, target.z + 0.23, y, name, value);
}

function bloodMoon(combat, game) {
  return (
    (combat.stage === 'bloodmoon-castle' || combat.stage === 'shanhai-secret-realm') &&
    game.encounter?.phase === 'active'
  );
}

function inVacuum(combat, game) {
  const sector = game.encounter?.panel?.data;
  const p = game.player;
  return (
    combat.stage === 'derelict-station' &&
    game.encounter.phase === 'open' &&
    sector &&
    p.x >= sector.x0 &&
    p.x <= sector.x1 &&
    p.z >= sector.z0 &&
    p.z <= sector.z1
  );
}

function timedControl(c, target, kind, duration, game) {
  if (target.controlReady > game.time) return false;
  target.controlReady = game.time + 5;
  const effect = put(target, target.type === 3 ? 'bossSlow' : kind, game.time, duration);
  if (target.type === 3) effect.scale = 0.6;
  else {
    if (kind === 'confused') {
      effect.angle = (c.random() * 0.75 + 0.125) * Math.PI * (c.random() < 0.5 ? -1 : 1);
    } else {
      target.mode = 'move';
      target.cooldown = Math.max(target.cooldown, duration);
    }
  }
  c.visual(target, game, kind === 'stone' ? 'stone' : 'ice');
  return true;
}

function slow(target, time, duration, scale) {
  const previous = active(target, 'slowed', time);
  const effect = put(target, 'slowed', time, duration);
  effect.scale = Math.min(previous?.scale ?? 1, scale);
}

function area(c, center, radius, game, visitor, maximum = Infinity) {
  // 在同一帧内，死亡特效可能再次调用空间查询。保持各次查询的候选列表独立。
  const nearby = game.beasts.hash.query(
    center.x - radius,
    center.z - radius,
    center.x + radius,
    center.z + radius,
    [],
  );
  nearby.sort(
    (a, b) => (a.x - center.x) ** 2 + (a.z - center.z) ** 2 - (b.x - center.x) ** 2 - (b.z - center.z) ** 2,
  );
  for (const other of nearby) {
    if (
      other === center ||
      !other.active ||
      Math.hypot(other.x - center.x, other.y - center.y, other.z - center.z) > radius
    )
      continue;
    if (!c.visible(center, other, game)) continue;
    visitor(other);
    if (--maximum === 0) break;
  }
}

const NONE = () => {};
function perk(onHit = NONE, onKill = NONE, passive = NONE) {
  return {
    onHit(target, hitInfo, game) {
      onHit(this, target, hitInfo, game);
    },
    onKill(target, hitInfo, game) {
      onKill(this, target, hitInfo, game);
    },
    passive(dt, game) {
      passive(this, dt, game);
    },
  };
}

export function resetTargetEffects(target) {
  target.statusEffects ??= new Map();
  target.statusEffects.clear();
  target.controlReady = target.empReady = -Infinity;
  target.perkPushX = target.perkPushZ = 0;
  target.perkMoveScale = 1;
  target.spawnGeneration = (target.spawnGeneration ?? 0) + 1;
}

export class WeaponCombat {
  constructor(skin, stage, baseDamage, random = Math.random) {
    this.skin = skin;
    this.stage = stage;
    this.baseDamage = baseDamage;
    this.random = random;
    this.hooks = weaponPerks[skin] ?? perk();
    this.reset();
  }
  reset() {
    this.misses = new Map();
    this.charge = this.consecutive = 0;
    this.tracked = null;
    this.chargedShot = this.penetration = false;
    this.samplePending = this.sampleActive = false;
    this.speedUntil = this.fireUntil = -Infinity;
    this.fireRate = this.moveSpeed = 1;
  }
  roll(kind, rate) {
    const failures = this.misses.get(kind) ?? 0;
    const hit = this.random() < chanceCoefficient(rate) * (failures + 1);
    this.misses.set(kind, hit ? 0 : failures + 1);
    return hit;
  }
  beginShot() {
    const threshold = this.skin === 'brass-factory' ? 15 : this.skin === 'jungle-temple' ? 12 : Infinity;
    this.chargedShot = this.charge >= threshold;
    if (this.chargedShot) this.charge = 0;
    const penetrate = this.penetration;
    this.penetration = false;
    return penetrate;
  }
  reloaded() {
    this.sampleActive = this.samplePending;
    this.samplePending = false;
  }
  passive(dt, game) {
    this.moveSpeed = this.fireRate = 1;
    this.hooks.passive.call(this, dt, game);
  }
  hearingScale(player) {
    return this.skin === 'buried-tomb' && player.crouched ? 0.6 : 1;
  }
  terrainScale(scale) {
    return this.skin === 'drowned-city' && waterStages.has(this.stage) ? 1 : scale;
  }
  miss() {
    this.consecutive = 0;
  }
  hit(target, info, game) {
    const same = this.tracked === target && this.generation === target.spawnGeneration;
    this.consecutive = same ? this.consecutive + 1 : 1;
    this.tracked = target;
    this.generation = target.spawnGeneration;
    if (this.sampleActive) info.damage *= 1.3;
    this.hooks.onHit.call(this, target, info, game);
  }
  onKill(target, hit, game) {
    this.hooks.onKill.call(this, target, hit, game);
  }
  damageScale(target, source, time) {
    const corrosion = active(target, 'corrosion', time);
    // 敌人原有耐久已包含护甲。以原有效伤害为 1，仅计算被削掉的护甲带来的增量。
    const armor = target.type === 1 ? 0.4 : target.type === 3 ? 0.25 : 0;
    const erosion = (armor / (1 - armor)) * 0.05 * (corrosion?.stacks ?? 0);
    const mark = active(target, 'marked', time)?.damageBonus ?? 0;
    const stone = active(target, 'stone', time)?.damageBonus ?? 0;
    const electric = source === 'electric' || source === 'electric-environment';
    const wet = electric && active(target, 'wet', time) ? 0.25 : 0;
    return (1 + erosion) * (1 + mark) * (1 + stone) * (1 + wet);
  }
  updateTarget(b, game) {
    const time = game.time;
    b.perkMoveScale = 1;
    let controlled = false;
    for (const [kind, effect] of b.statusEffects) {
      if (kind === 'burn' || kind === 'poison' || kind === 'scald') {
        const tide =
          this.stage === 'ember-fortress' && ['rise', 'high', 'retreat'].includes(game.encounter?.phase);
        const steam = kind === 'scald' && game.encounter?.inSteam?.(b.x, b.z, b.y, game);
        const perSecond =
          kind === 'burn'
            ? 0.08 * (tide ? 2 : 1)
            : kind === 'poison'
              ? 0.08 * effect.stacks
              : 0.12 * (steam ? 2 : 1);
        while (effect.tickAt <= Math.min(effect.until, time)) {
          effect.tickAt += 0.5;
          game.beasts.damage(b, this.baseDamage * perSecond * 0.5, game, 'weapon');
          if (!b.active) return true;
        }
      }
      if (effect.until <= time) {
        b.statusEffects.delete(kind);
        continue;
      }
      if (controlKinds.has(kind)) controlled = true;
      if (kind === 'slowed' || kind === 'bossSlow') b.perkMoveScale = Math.min(b.perkMoveScale, effect.scale);
      if (kind === 'frost') b.perkMoveScale = Math.min(b.perkMoveScale, 1 - 0.08 * effect.stacks);
    }
    if (controlled) b.perkMoveScale = 0;
    return controlled;
  }
  status(game) {
    const b = this.tracked;
    if (!b?.active || b.spawnGeneration !== this.generation || !b.statusEffects.size) return '';
    const labels = [];
    for (const effect of b.statusEffects.values()) {
      const name = effectTitles[effect.type];
      if (!name || effect.until <= game.time) continue;
      const icon = controlKinds.has(effect.type) ? '◇' : effect.type === 'marked' ? '◎' : '·';
      labels.push(
        icon +
          ' ' +
          name +
          (effect.stacks > 1 ? '×' + effect.stacks : '') +
          ' ' +
          Math.ceil(effect.until - game.time) +
          '秒',
      );
    }
    return labels.slice(-2).join(' / ');
  }
}
</script>
<script type="text/plain" data-level-module="@level-kit/weapon.mjs">
import { createRifle } from '@level-kit/rifle-model.mjs';
import { WeaponCombat } from '@level-kit/weapon-perks.mjs';

export function createWeaponClass({ CONFIG, THREE, V3, TAU, camera, weaponScene, definition, shapes, brighter, lerp, randomRange, colors }) {
  const { spark } = colors;
  const nativeSkin = definition.weaponSkin;
  const bloodMoonLevel = nativeSkin === 'shanhai-secret-realm' || nativeSkin === 'bloodmoon-castle';

  class WeaponSystem {
    constructor(skinId) {
      this.skinId = skinId;
      this.combat = new WeaponCombat(skinId, nativeSkin, CONFIG.weapon.damage);
      const from = new V3(), to = new V3(), sight = new V3();
      const tints = Object.fromEntries(Object.entries({
        stone: 0xb1a886, ice: 0x91eaff, arc: 0x8cffff, fire: 0xff792e, petal: 0xffabc9, steam: 0xe7e0d5,
      }).map(([name, tint]) => [name, brighter(tint, 1.8)]));
      const center = (out, b) => out.set(b.x, b.y + (b.height ?? 1.7) * .52, b.z);
      this.combat.visual = (b, game, kind) => {
        game.effects.spray(center(to, b), tints[kind], 8, 2.8, .07, kind === 'steam' || kind === 'petal' ? 'mist' : 'spark');
      };
      this.combat.arc = (a, b, game) => {
        game.effects.streak(center(from, a), center(to, b));
        this.combat.visual(b, game, 'arc');
      };
      this.combat.visible = (a, b, game) => {
        center(from, a); center(to, b);
        const length = sight.subVectors(to, from).length();
        return length < .01 || game.level.visible(from, sight.divideScalar(length), length);
      };
      this.group = new THREE.Group();
      weaponScene.add(this.group);
      this.rifle = createRifle(skinId, { firstPerson: true });
      this.rifle.root.rotation.y = Math.PI / 2;
      this.group.add(this.rifle.root);
      this.signals = {};
      this.empRecovery = 0;
      const glove = new THREE.MeshStandardMaterial({ color: 0x35373b, roughness: .86 });
      const sleeve = new THREE.MeshStandardMaterial({ color: 0x313c46, roughness: .88 });
      function component(group, geo, mat, x, y, z, w = 1, h = 1, d = 1, pitch = 0, yaw = 0, roll = 0) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z); mesh.scale.set(w, h, d); mesh.rotation.set(pitch, yaw, roll);
        group.add(mesh);
        return mesh;
      }
      // 手套随第一人称武器移动，收藏预览只展示武器本身。
      const hand = (mat, ...args) => component(this.group, shapes.box, mat, ...args);
      hand(sleeve, .024, -.171, .19, .115, .125, .39, -.41, .17, -.1);
      hand(glove, .016, -.118, .132, .115, .095, .115, -.35, .18, -.12);
      hand(glove, -.047, -.071, -.49, .141, .072, .12, -.21, .22, .15);
      hand(sleeve, -.117, -.155, -.26, .116, .112, .43, -.39, .48);

      this.flashGroup = new THREE.Group(); this.group.add(this.flashGroup);
      this.flashGroup.position.copy(this.rifle.muzzle).applyAxisAngle(new V3(0, 1, 0), Math.PI / 2);
      const outer = new THREE.MeshBasicMaterial({ color: brighter(0xff9c48, 4), transparent: true, depthWrite: false });
      const inner = new THREE.MeshBasicMaterial({ color: brighter(0xffe8a4, 6), transparent: true, depthWrite: false });
      const star = new THREE.ConeGeometry(0.064, 0.24, 5);
      component(this.flashGroup, star, outer, 0, 0, -0.08, 1, 1, 1, -Math.PI / 2).renderOrder = 15;
      component(this.flashGroup, new THREE.OctahedronGeometry(0.050, 0), inner, 0, 0, -0.065, 1.32, 1.32, 3).renderOrder = 16;
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5;
        component(this.flashGroup, star, outer, Math.cos(a) * 0.039, Math.sin(a) * 0.039, -0.045, 0.45, 0.62, 0.45, -Math.PI / 2, Math.cos(a) * 0.62, Math.sin(a) * 0.57).renderOrder = 15;
      }
      this.dir = new V3(); this.origin = new V3(); this.end = new V3(); this.muzzle = new V3();
      this.reset();
    }
    reset() {
      this.ammo = CONFIG.weapon.magazine; this.reserve = CONFIG.weapon.reserve;
      this.heat = 0; this.cooldown = 0; this.reloadLeft = 0; this.kick = 0; this.flash = 0;
      this.emptyAt = -5;
      this.combat.reset();
      this.empRecovery = 0;
      this.signals.emp = false;
      this.flashGroup.visible = false;
      this.group.visible = false;
    }
    reload(game) {
      if (this.reloadLeft > 0 || this.ammo >= CONFIG.weapon.magazine || this.reserve <= 0) return;
      this.reloadLeft = CONFIG.weapon.reloadTime; game.sound.reload();
    }
    shoot(game) {
      const w = CONFIG.weapon, p = game.player;
      this.ammo--; this.heat = Math.min(1, this.heat + w.heatPerShot);
      this.kick = Math.min(0.21, this.kick + 0.081 + 0.028 * this.heat);
      this.flash = 0.047;
      p.recoil = Math.min(0.085, p.recoil + w.recoil * (1 + 1.1 * this.heat));
      p.recoilRoll += randomRange(-0.004, 0.004) * (1 + this.heat);
      game.shotAt = game.time; game.shotX = p.x; game.shotY = p.y; game.shotZ = p.z;
      game.shotHearingScale = this.combat.hearingScale(p);
      const penetrate = this.combat.beginShot();
      game.sound.shoot();
      const spread = lerp(w.baseSpread, w.maxSpread, this.heat ** 1.25) * (p.sprinting ? 1.45 : 1);
      const a = randomRange(0, TAU), s = Math.sqrt(Math.random()) * spread;
      this.dir.set(Math.cos(a) * s, Math.sin(a) * s, -1).normalize().applyQuaternion(camera.quaternion);
      this.origin.copy(camera.position);
      const cover = game.level.hash.ray(this.origin, this.dir, w.range);
      let limit = game.level.hash.depth;
      if (this.dir.y < -0.009) {
        const floor = game.level.base(this.origin.x, this.origin.z);
        const t = (floor - this.origin.y) / this.dir.y;
        if (t > 0) {
          const depth = (game.level.base(this.origin.x + this.dir.x * t, this.origin.z + this.dir.z * t) - this.origin.y) / this.dir.y;
          limit = Math.min(limit, Math.max(0, depth));
        }
      }
      const hit = game.beasts.hash.ray(this.origin, this.dir, limit);
      this.end.copy(this.origin).addScaledVector(this.dir, game.beasts.hash.depth);
      this.group.updateWorldMatrix(true, true);
      camera.localToWorld(this.flashGroup.getWorldPosition(this.muzzle));
      const streakLength = this.muzzle.distanceTo(this.end);
      if (streakLength > 0.28) game.effects.streak(this.muzzle, this.end);
      if (hit) {
        let dead = this.hitTarget(hit, game);
        if (penetrate) {
          const next = game.beasts.hash.ray(this.origin, this.dir, limit, hit);
          if (next) {
            this.end.copy(this.origin).addScaledVector(this.dir, game.beasts.hash.depth);
            game.effects.streak(this.muzzle, this.end);
            dead = this.hitTarget(next, game) || dead;
          }
        }
        game.sound.hit(dead);
        game.ui.hit(dead ? 'kill' : 'hit');
        game.hitStop = w.hitStop;
      } else {
        this.combat.miss();
        if (cover || limit < w.range) game.effects.spray(this.end, spark, 5, 3.2, 0.025, 'spark');
      }
    }
    hitTarget(target, game) {
      const hit = { damage: CONFIG.weapon.damage, headshot: this.end.y >= target.y + target.height * .75 };
      this.combat.hit(target, hit, game);
      return game.beasts.takeHit(target, hit.damage, this.end, this.dir, game, hit);
    }
    update(dt, input, game) {
      this.cooldown = Math.max(-dt, this.cooldown - dt);
      this.heat = Math.max(0, this.heat - dt * CONFIG.weapon.heatRecovery * (input.fire && this.ammo > 0 && this.reloadLeft <= 0 ? 0.26 : 1));
      if (input.reload) { input.reload = false; this.reload(game); }
      if (this.reloadLeft > 0) {
        this.reloadLeft = Math.max(0, this.reloadLeft - dt);
        if (this.reloadLeft === 0) {
          const fill = Math.min(CONFIG.weapon.magazine - this.ammo, this.reserve);
          this.ammo += fill; this.reserve -= fill; game.sound.reload(true);
          this.combat.reloaded();
          this.cooldown = Math.max(0.08, this.cooldown);
        }
      }
      if (!input.fire) this.cooldown = Math.max(0, this.cooldown);
      if (input.fire && this.reloadLeft <= 0 && this.cooldown <= 0) {
        if (this.ammo > 0) {
          this.cooldown += 1 / (CONFIG.weapon.fireRate * this.combat.fireRate);
          this.shoot(game);
        } else if (this.reserve <= 0 && game.time - this.emptyAt > 0.45) {
          this.emptyAt = game.time; game.sound.tone(182, 100, 0.045, 0.095, 'square');
        }
      }
      // 打出最后一发即开始换弹；空仓时捡到备弹也走相同入口。
      if (this.ammo === 0 && this.reloadLeft === 0) this.reload(game);
    }
    render(dt, player, game) {
      const emp = Boolean(game.level.empActive);
      if (this.signals.emp && !emp) this.empRecovery = .88;
      this.empRecovery = Math.max(0, this.empRecovery - dt);
      this.signals.bloodMoon = bloodMoonLevel && game.encounter?.phase === 'active';
      this.signals.tide = game.level.tide?.rifleTide;
      this.signals.emp = emp;
      this.signals.shot = this.flash > 0 ? 1 : 0;
      this.signals.pressure = this.combat.charge / 15;
      this.signals.empRecovery = this.empRecovery;
      this.rifle.update(game.time, this.signals);
      this.kick *= Math.exp(-dt * 17);
      this.flash = Math.max(0, this.flash - dt);
      const cycle = this.reloadLeft > 0 ? Math.sin(Math.PI * this.reloadLeft / CONFIG.weapon.reloadTime) : 0;
      const sway = player.speedMix * Math.sin(player.bob);
      this.group.position.set(0.315 + sway * 0.028 + cycle * 0.075, -0.315 + sway * 0.023 - cycle * 0.29, -0.67 + this.kick * 0.8 + (player.sprinting ? 0.041 : 0));
      this.group.rotation.set(this.kick * 0.24 - cycle * 0.31, -0.045 + cycle * 0.26, -0.013 + player.sway * 0.026 - cycle * 0.62);
      this.rifle.magazine.position.y = -Math.sin(cycle * 1.56) * 0.18;
      this.flashGroup.visible = this.flash > 0;
      if (this.flashGroup.visible) {
        this.flashGroup.scale.setScalar(Math.max(0.55, this.flash * 18 + 0.25));
        this.flashGroup.rotation.z += 0.42;
      }
    }
  }

  return WeaponSystem;
}
