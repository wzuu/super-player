<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>地图关卡</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e9f4f7;
    --muted: #9db2c0;
    --cyan: #79f3e0;
    --orange: #ffad73;
    --red: #ff626d;
    --border: #9fc4da3d;
    --panel: #09131de8;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #080d17;
    color: var(--ink);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .visually-hidden {
    position: absolute; inline-size: 1px; block-size: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  #world, #hud, #injury, #blast { position: fixed; inset: 0; }
  #world { width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; container-type: size; }
  #injury { background: radial-gradient(ellipse, transparent 35%, #a62239 120%); opacity: 0; }
  #directions { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  #directions i { position: absolute; left: 50%; top: 50%; }
  .damage-arc { width: 58px; height: 17px; margin: -8px -29px; border-top: 5px solid #ff555f;
    border-radius: 50%; filter: drop-shadow(0 1px 2px #47101b); }
  .near-warning { width: 0; height: 0; margin: -5px -6px; border: 6px solid transparent;
    border-top: 0; border-bottom-width: 11px; filter: drop-shadow(0 1px 2px #171219); }
  #hud[data-critical] #hp { color: #ff626d; font-weight: 800; }
  #hud[data-critical] #health { --fill: #ff626d; accent-color: #ff626d; }
  #blast { background: radial-gradient(ellipse at center, #ffd5be80, #ff6ebb33 50%, transparent 85%); opacity: 0; }
  .hud-top {
    position: absolute; inset: 24px 28px auto; display: grid;
    grid-template-columns: minmax(0, 1fr) min(280px, 33vw) minmax(0, 1fr);
    grid-template-areas: "task signals map"; align-items: start; column-gap: 12px;
  }
  .top-left { grid-area: task; justify-self: start; min-inline-size: 0; max-inline-size: min(420px, 100%); }
  .top-right { grid-area: map; justify-self: end; position: relative; }
  .top-signals { grid-area: signals; display: grid; gap: 7px; margin-block-start: 2px; }
  .bottom-left, .bottom-right { position: absolute; }
  .bottom-left { bottom: 28px; left: 28px; width: min(250px, 41vw); }
  .bottom-right { bottom: 28px; right: 28px; min-width: 128px; }
  .instrument {
    background: linear-gradient(112deg, #091723f0, #09131dba);
    border: 1px solid var(--border);
    padding: 13px 15px;
    box-shadow: 0 6px 28px #02050855;
  }
  .area { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: .13em; }
  .objective { margin: 5px 0 0; font-size: 13px; line-height: 1.55; }
  #objective-detail { margin: 2px 0 0; font-size: 12px; color: var(--cyan); }
  #task-panel[data-update] { border-color: var(--cyan); box-shadow: inset 3px 0 var(--cyan); }
  #task-update { color: var(--cyan); margin-inline-start: .6em; font-size: 11px; }
  .tallies { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 9px; color: var(--muted); font-size: 11px; }
  .tallies strong { color: var(--ink); margin-left: 5px; font: 600 13px var(--mono); }
  #map-offline { display: none; }
  #hud[data-offline] .top-left,
  #hud[data-offline] .bottom-left,
  #hud[data-offline] .bottom-right,
  #hud[data-offline] #boss,
  #hud[data-offline] #cross,
  #hud[data-offline] #reload-ring, #hud[data-offline] #aim-dot,
  #hud[data-offline] #message,
  #hud[data-offline] #map { visibility: hidden; }
  #hud[data-offline] #map-offline {
    display: grid; position: absolute; inset: 34px 12px 12px; place-items: center;
    color: #aac4da; font: 11px var(--mono); text-align: center;
    background: repeating-linear-gradient(0deg, #132238 0 2px, #101a2c 2px 4px);
    border: 1px solid #62748568;
  }
  .map-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
  #map { display: block; width: 150px; height: 150px; margin-top: 7px; }
  .meter-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: var(--muted); }
  .meter-label output { font: 600 16px var(--mono); color: var(--ink); }
  progress { width: 100%; height: 5px; display: block; border: 0; appearance: none; background: #293a48; margin: 6px 0 11px; }
  progress:last-child { margin-bottom: 0; }
  progress::-webkit-progress-bar { background: #293a48; }
  progress::-webkit-progress-value { background: var(--fill, var(--cyan)); }
  progress::-moz-progress-bar { background: var(--fill, var(--cyan)); }
  #health { --fill: #71e1a4; }
  #stamina { --fill: #77bfe5; }
  .ammo-label { color: var(--muted); font-size: 11px; }
  .ammo-line { display: flex; align-items: baseline; gap: 9px; margin: 3px 0; font-family: var(--mono); }
  #ammo { font-size: clamp(25px, 4vw, 44px); font-weight: 650; line-height: 1; }
  #reserve { font-size: 14px; color: var(--muted); }
  #weapon-state { min-height: 16px; color: var(--orange); font-size: 11px; }
  #boss, #condition { padding: 8px 10px; background: var(--panel); border: 1px solid #ff64675c; }
  #condition { border-color: #ffad736b; }
  #condition-title { color: var(--orange); font-size: 12px; }
  #condition-time { font: 600 12px var(--mono); color: var(--ink); white-space: nowrap; }
  #condition-meter {
    display: block; appearance: none; width: 100%; height: 5px;
    margin: 6px 0 0; border: 0; background: #293a48;
  }
  #condition-meter::-webkit-meter-bar { border: 0; border-radius: 0; background: #293a48; }
  #condition-meter::-webkit-meter-optimum-value { background: #77bfe5; }
  #condition-meter::-webkit-meter-suboptimum-value { background: var(--orange); }
  #condition-meter::-webkit-meter-even-less-good-value { background: var(--red); }
  #condition-meter::-moz-meter-bar { background: #77bfe5; }
  #condition-meter:-moz-meter-sub-optimum::-moz-meter-bar { background: var(--orange); }
  #condition-meter:-moz-meter-sub-sub-optimum::-moz-meter-bar { background: var(--red); }
  #condition p { margin: 4px 0 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
  #posture { color: var(--cyan); font-size: 10px; margin-inline-start: auto; white-space: nowrap; }
  #boss progress { --fill: var(--red); margin-bottom: 0; }
  .boss-meter {position:relative}
  .boss-meter::after {content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right,transparent calc(35% - 1px),#eff9ff 35%,transparent calc(35% + 1px),
      transparent calc(70% - 1px),#eff9ff 70%,transparent calc(70% + 1px))}
  #boss strong { color: #ffafb7; font-size: 12px; font-weight: 650; }
  #cross { --gap: 7px; display: block; position: absolute; top: 50%; left: 50%; width: 0; height: 0; color: #edfffc; filter: drop-shadow(0 0 2px #02070a); }
  #cross i { position: absolute; display: block; border-radius: 1px; background: currentColor; }
  #cross i:nth-child(1) { width: 5px; height: 1px; right: var(--gap); top: 0; }
  #cross i:nth-child(2) { width: 5px; height: 1px; left: var(--gap); top: 0; }
  #cross i:nth-child(3) { width: 1px; height: 5px; bottom: var(--gap); left: 0; }
  #cross i:nth-child(4) { width: 1px; height: 5px; top: var(--gap); left: 0; }
  #cross i:nth-child(5) { width: 3px; height: 3px; left: -1px; top: -1px; border-radius: 50%; }
  #cross[data-hit="hit"] { color: var(--orange); }
  #hud[data-aim] #cross:not([data-hit]), #hud[data-aim] #cross[data-hit=""] { visibility:hidden; }
  #aim-dot, #reload-ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; border-radius:50%; }
  #aim-dot { width:4px; height:4px; background:#ff3e32; box-shadow:0 0 2px #4b0803,0 0 4px #ee4539; }
  #reload-ring { width:58px; height:58px; background:conic-gradient(#e6fff7 var(--remaining,1turn),#17282788 0); mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0); }
  #cross[data-hit="weak"] { color: #ffe75e; transform: rotate(45deg); }
  #cross[data-hit="critical-kill"] { color: #fff08b; transform: rotate(45deg) scale(1.8); outline: 1px solid currentColor; }
  #combo { position: absolute; right: 3%; top: 49%; color: #ffda80; font-weight: bold; text-shadow: 0 1px 3px black; }
  #hud[data-offline] #combo { visibility: hidden; }
  #hud[data-steam]::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center,transparent 12%,#d1d8d551 85%); pointer-events:none; }
  #trait-label {position:absolute;right:3%;top:44%;font-size:12px;color:#f4ceff;text-shadow:0 1px 3px black}
  #hud[data-offline] #trait-label {visibility:hidden}
  #cross[data-hit="kill"] { color: var(--red); transform: scale(1.55) rotate(45deg); }
  #message { position: absolute; top: calc(50% + 37px); left: 50%; transform: translateX(-50%); max-width: 80%; width: max-content; padding: 7px 12px; background: #07111be8; border: 1px solid var(--border); color: var(--ink); font-size: 12px; text-align: center; }
  #menu {
    position: fixed; inset: 0; margin: 0; width: 100%; height: 100%;
    max-width: none; max-height: none; border: 0; padding: 0;
    overflow: auto; background: transparent; color: var(--ink);
  }
  #menu:modal { overscroll-behavior: contain; }
  #menu::backdrop { background: #04091228; overflow: hidden; overscroll-behavior: contain; }
  .screen {
    min-height: 100%; display: grid; align-content: center; justify-items: start;
    padding: clamp(22px, 7vw, 104px);
    background: linear-gradient(90deg, #060d18f2 0%, #07111de8 27%, #091521b8 42%, #09152118 76%), linear-gradient(0deg, #060c16ab, transparent 44%);
  }
  .brief { width: min(100%, 475px); }
  .brief-tag { display: flex; align-items: center; gap: 11px; color: var(--cyan); font-size: 12px; letter-spacing: .18em; font-weight: 700; }
  .brief-tag::before { content: ""; width: 24px; height: 2px; background: currentColor; }
  h1 { margin: 16px 0 9px; font-weight: 780; font-size: clamp(40px, 6.25vw, 90px); line-height: 1.06; letter-spacing: -.05em; }
  #menu-text { margin: 0; max-width: 36ch; color: #bdced9; font-size: clamp(14px, 1.65vw, 17px); line-height: 1.8; }
  .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 25px 0 24px; padding: 14px 0; border-block: 1px solid var(--border); }
  .controls div { display: flex; gap: 5px 10px; align-items: center; flex-wrap: wrap; }
  .controls dt { color: #d7ebf0; font: 650 12px var(--mono); white-space: nowrap; }
  .controls dd { margin: 0; color: var(--muted); font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button, .action-link {
    min-height: 46px; border: 1px solid var(--border); border-radius: 0;
    padding: 10px 18px; font: 650 14px system-ui, sans-serif;
    background: #0c1b28e8; color: var(--ink); cursor: pointer;
  }
  .action-link { display: inline-flex; align-items: center; text-decoration: none; }
  button:hover, .action-link:hover { background: #163343; }
  button:focus-visible, .action-link:focus-visible { outline: 2px solid #effcfe; outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: wait; }
  #start { min-width: 148px; background: var(--cyan); border-color: var(--cyan); color: #07191e; }
  #start:hover:enabled { background: #b2fff3; }
  #next-level { color: var(--cyan); border-color: var(--cyan); }
  #menu-status { margin: 11px 0 0; min-height: 18px; color: var(--orange); font-size: 12px; }
  #summary { margin: 22px 0; padding: 12px 15px; border: 1px solid var(--border); background: #0a1826d9; font-size: 13px; line-height: 1.8; }
  @media (max-width: 790px) {
    .hud-top {
      inset: 13px 13px auto; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "task map" "signals signals"; gap: 8px;
    }
    .top-signals { inline-size: min(280px, 74vw); justify-self: center; margin-block-start: 0; }
    .bottom-left { bottom: 13px; left: 13px; } .bottom-right { bottom: 13px; right: 13px; }
    #map { width: 105px; height: 105px; }
    .instrument { padding: 9px 10px; }
  }
  @media (max-width: 790px) and (max-height: 575px) {
    .top-signals { display: flex; inline-size: min(100%, 460px); gap: 7px; align-items: start; justify-content: center; }
    .top-signals > section { flex: 0 1 226px; min-inline-size: 0; }
  }
  @media (max-width: 790px) and (max-height: 520px) {
    #map { width: 76px; height: 76px; }
  }
  @media (max-height: 575px) {
    .screen { padding-block: 17px; }
    h1 { margin-top: 8px; font-size: clamp(32px, 8vh, 54px); }
    .controls { margin-block: 13px; padding-block: 9px; }
    #map { max-width: 96px; max-height: 96px; }
  }
#equipment-hud .kit-slot {display:inline-flex;gap:.35em;margin:.2em;padding:.2em;border:1px solid #668390;background:linear-gradient(0deg,#657082 var(--cooldown,0%),transparent var(--cooldown,0%))}
.kit-slot kbd {color:#94e9db;font-weight:bold}
#menu .screen {height:100dvh;min-height:0;place-content:center;grid-template: minmax(0,1fr) / minmax(0,1000px);padding:clamp(12px,4vw,56px)}
.brief {width:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;align-self:center;height:min(610px,100%);background:#0a1722ef;border:1px solid var(--border)}
.brief-body {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;gap:24px;overflow:auto;padding:clamp(16px,3vw,35px);scrollbar-gutter:stable}
.brief-body > * {min-width:0}
.brief h1 {font-size:clamp(28px,4vw,54px)}
.brief h2 {margin:0 0 8px;font-size:18px}
.brief h3 {margin:15px 0 5px;font-size:15px}
.brief footer {border-top:1px solid var(--border);padding:12px clamp(16px,3vw,35px);background:#0b1926}
.brief details summary {cursor:pointer;color:var(--cyan);padding:8px 0;font-weight:650}
.brief select {min-width:0;max-width:100%;padding:5px;color:var(--ink);background:#132733;border:1px solid var(--border);font:inherit}
.brief :is(select,summary):focus-visible {outline:2px solid var(--cyan);outline-offset:2px}
.mission-choice {margin:16px 0;padding:12px;border-left:3px solid var(--cyan);background:#15303b}
.mission-choice label {display:block;color:var(--cyan);font-size:13px;font-weight:bold;margin-bottom:6px}
#mission-rule,#shop-detail,#loadout-state,#shop-status {margin:6px 0;font-size:13px;line-height:1.6}
#loadout-state,#shop-detail {color:var(--muted)}
#shop-status {color:var(--orange)}
#kit-slots,#kit-preview {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
#kit-preview > div {padding:9px;background:#10232f;border:1px solid var(--border);display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:start}
#kit-preview kbd {grid-row:span 2;color:var(--cyan);font:700 15px var(--mono);overflow-wrap:anywhere}
#kit-preview small {color:var(--muted)}
#kit-slots label {min-width:0;display:grid;font-size:13px}
.shop-row {display:flex;align-items:center;gap:7px}
.shop-row select {flex:1}
.controls {margin:4px 0}
#menu-status:empty, #shop-status:empty {display:none}
@media(max-width:730px){.brief-body{grid-template-columns:minmax(0,1fr);gap:12px}.brief footer .actions{gap:6px}.brief footer :is(button,a){min-height:36px;padding:6px 8px}.brief #start{min-width:100px}}
#equipment-hud {position:absolute;left:0;bottom:calc(100% + 8px);width:max-content;max-width:64vw;background:#142734d9;color:#e5f5ff;padding:.4em .7em;font:14px/1.35 system-ui}
</style>
</head>
<body>
<canvas id="world" aria-label="第一人称关卡画面"></canvas>
<div id="hud" hidden>
  <div id="hud-announcement" class="visually-hidden" role="status"></div>
  <div id="combo" role="status"></div>
  <div id="trait-label"></div>
  <div id="injury"></div>
  <div id="directions" aria-hidden="true"></div>
  <div id="blast"></div>
  <div class="hud-top">
  <section id="task-panel" class="top-left instrument" aria-label="当前区域与撤离任务">
    <div><span id="area" class="area">出生点</span><span id="task-update" hidden>目标更新</span></div>
    <p id="objective" class="objective" role="status"></p>
    <p id="objective-detail" hidden></p>
    <div class="tallies"><span>击杀<strong id="kills">0</strong></span><span><span id="loot-title">宝物</span><strong id="loot">0 / 10</strong></span></div>
  </section>
  <section class="top-right instrument" aria-label="战术小地图">
    <div class="map-label"><span>小地图</span><span>北</span></div>
    <span id="map-offline">地图信号中断</span>
    <canvas id="map" width="180" height="180" aria-label="红点为凶兽，橙点为传送门，青色箭头为玩家"></canvas>
  </section>
  <div class="top-signals">
  <section id="boss" aria-label="首领凶兽状态" hidden>
    <div class="meter-label"><strong id="boss-title">首领凶兽</strong><span id="boss-phase"></span></div>
    <div class="boss-meter"><progress id="boss-health" aria-label="首领凶兽生命值" max="100" value="100"></progress></div>
  </section>
  <section id="condition" aria-labelledby="condition-title" hidden>
    <div class="meter-label"><strong id="condition-title"></strong><span id="condition-time"></span></div>
    <meter id="condition-meter" aria-labelledby="condition-title" min="0" max="100" low="40" high="68" optimum="100" value="100" hidden></meter>
    <p id="condition-detail"></p>
  </section>
  </div>
  </div>
  <div id="cross" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="aim-dot" hidden aria-hidden="true"></div><div id="reload-ring" hidden aria-hidden="true"></div>
  <div id="message" hidden></div>
  <section class="bottom-left instrument" aria-label="玩家状态">
    <output id="equipment-hud" hidden></output>
    <div class="meter-label"><span>生命</span><output id="hp">100</output></div>
    <progress id="health" aria-label="生命" max="100" value="100"></progress>
    <div class="meter-label"><span>体力</span><span id="posture" hidden>蹲伏</span><output id="energy">100</output></div>
    <progress id="stamina" aria-label="体力" max="100" value="100"></progress>
  </section>
  <section class="bottom-right instrument" aria-label="机关枪状态">
    <div class="ammo-label" id="rifle-label">机关枪</div>
    <div class="ammo-line"><output id="ammo">60</output><span id="reserve">/ 300</span></div>
    <div id="weapon-state"></div>
    <small id="sound-state"></small>
  </section>
</div>
<output id="performance" hidden style="position:fixed;right:1em;bottom:7em;background:#162633;color:white;padding:.45em;pointer-events:none"></output>
<dialog id="menu" closedby="none" aria-labelledby="menu-title" aria-describedby="menu-text">
  <div class="screen">
    <section class="brief">
      <div class="brief-body"><div>
      <div id="menu-tag" class="brief-tag">地图关卡</div><p id="run-variation"></p>
      <h1 id="menu-title">走位射击</h1>
      <p id="menu-text">沿开阔路线边打边退，击杀凶兽，夺取关键道具并引爆传送门。</p>
      <div class="mission-choice"><label for="mission-mode">行动目标</label><select id="mission-mode" aria-describedby="mission-rule"></select>
        <p id="mission-rule"></p></div>
      <details id="key-guide"><summary>按键说明</summary><dl class="controls" id="guide">
        <div><dt>WASD</dt><dd>移动</dd></div>
        <div><dt>鼠标左键 / 右键</dt><dd>射击 / 按住红点瞄准</dd></div>
        <div><dt>Shift / 空格</dt><dd>冲刺 / 跳跃</dd></div>
        <div><dt>R / F / Esc</dt><dd>提前换弹（空仓自动） / 交互 / 暂停</dd></div>
        <div id="crouch-help" hidden><dt>C</dt><dd>按住蹲伏</dd></div>
        <div><dt>Q / E</dt><dd>主动技能</dd></div>
        <div><dt>1 / 2</dt><dd>携带道具</dd></div>
        <div><dt>V</dt><dd>第一人称 / 肩后视角</dd></div>
      </dl></details>
      <div id="summary" hidden></div>
      </div><section id="loadout-pane" aria-labelledby="kit-title">
        <h2 id="kit-title">本次携带</h2><div id="kit-preview"></div><p id="loadout-state"></p><p id="weapon-build"></p>
        <details id="preparation" hidden><summary>调整装备与补给</summary>
          <div id="kit-slots"></div>
          <h3>补给站 · <span id="credits"></span></h3>
          <div class="shop-row"><select id="shop-item" aria-label="军需物品"></select> <button id="shop-buy" type="button">兑换</button></div>
          <p id="shop-detail"></p><p id="shop-status" role="status"></p>
        </details>
      </section></div>
      <footer>
      <details id="practice-controls" hidden><summary>完整操作说明</summary><p id="practice-bindings"></p></details>
      <label id="practice-armory" hidden>练习武器 <select id="practice-weapon"><option value="">默认训练步枪</option></select></label>
      <div class="actions">
        <a id="next-level" class="action-link" hidden>进入下一关</a>
        <button id="start" type="button" disabled autofocus>进入关卡</button>
        <button id="practice-restart" type="button" hidden>重开练习</button>
        <a id="campaign-home" class="action-link" href="../" hidden>返回首页</a>
        <button id="retry-save" type="button" hidden>重试保存</button>
        <button id="sound" type="button" aria-pressed="true">音效开启</button>
      </div>
      <p id="menu-status" role="status">正在加载关卡</p>
      </footer>
    </section>
  </div>
</dialog>
<script>
  document.getElementById('menu').showModal();
</script>
<script src="./vendor/three-r160.js"></script>
<!-- LEVEL_SOURCES -->
<script>
  {
    const imports = { ...globalThis.levelThreeModules?.(), '@level-kit/': './src/' };
    for (const source of document.querySelectorAll('script[data-level-module]')) {
      imports[source.dataset.levelModule] = URL.createObjectURL(new Blob([source.textContent], { type: 'text/javascript' }));
    }
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports });
    document.currentScript.after(map);
  }
</script>
<script type="module">
  async function boot() {
    if (!globalThis.levelThreeModules) throw new Error('缺少本地 Three.js 文件');
    // LEVEL_SCENE_START
    const source = new URL(new URLSearchParams(location.search).get('scene') || './starter/scene.mjs', location.href);
    if (source.origin !== location.origin || !source.pathname.endsWith('.mjs')) {
      throw new Error('请提供工作区内的 .mjs 场景文件');
    }
    const sceneModule = source.href;
    const campaignResponse = await fetch('../campaign/levels.json');
    if (!campaignResponse.ok) throw new Error('无法读取战役关卡顺序');
    const levels = await campaignResponse.json();
    const campaignStage = levels.findIndex(({ id }) =>
      source.pathname === new URL(`../${id}/scene.mjs`, location.href).pathname) + 1;
    // LEVEL_SCENE_END
    const [{ startLevel }, { default: definition }] = await Promise.all([
      import('@level-kit/runtime.mjs'), import(sceneModule),
    ]);
    const campaignId = document.body.dataset.campaignLevel;
    const storageStatus = message => { document.getElementById('menu-status').textContent = message; };
    let campaign = null;
    if (document.body.hasAttribute('data-practice')) {
      const select=document.getElementById('practice-weapon');
      try {
        const {campaignStore}=await import(location.protocol==='file:'?'offline/campaign/store.mjs':'../campaign/store.mjs');
        const {rifleSkins}=await import('@level-kit/rifle-skins.mjs');
        const store=await campaignStore(storageStatus), progress=await store.progress();
        const cleared=new Set(progress.levels.filter(stage=>stage.cleared).map(stage=>stage.id));
        for (const [id,skin] of Object.entries(rifleSkins)) if (cleared.has(skin.unlock ?? id))
          select.add(new Option((skin.category ?? '步枪')+' · '+skin.name,id));
        const url=new URL(location.href),requested=url.searchParams.get('weapon');
        if ([...select.options].some(option=>option.value===requested)) select.value=requested;
        select.onchange=()=>{url.searchParams.set('weapon',select.value);location.assign(url);};
        document.getElementById('practice-armory').hidden=select.options.length<2;
      } catch { /* 单独练习仍可使用默认训练步枪 */ }
    }
    if (campaignId && (location.protocol !== 'file:' || new URLSearchParams(location.search).has('campaign'))) {
      campaign = await import(location.protocol==='file:'?'offline/campaign/save.mjs':'../campaign/save.mjs').then(module => module.connectCampaign(campaignId, storageStatus));
      if (!campaign) return;
    }
    startLevel(definition, campaign, campaignStage);
  }

  boot().catch(error => {
    console.error(error);
    document.getElementById('menu-status').textContent = '关卡加载失败。请检查本地游戏文件和浏览器的 WebGL 支持。';
  });
</script>
</body>
</html>
