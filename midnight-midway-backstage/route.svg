<text x="525.0" y="380.0" fill="#efece0" font-size="15">绿线示范正序路线，最后一门为本局结算点。</text>
<text x="525.0" y="408.0" fill="#efece0" font-size="15">轨道过车时，取道东侧后台绕行。</text>
<text x="525.0" y="436.0" fill="#efece0" font-size="14">金色虚线为支路，空心星标为釉面木马徽章。</text>
<text x="525.0" y="464.0" fill="#efece0" font-size="14">浅蓝点为固定弹箱，珊瑚色点为驻防中心。</text>
