name: Campaign
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 发布与公网实测共用锁，后续 main 部署须等前一版完成线上存档验收。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'github-pages' || format('campaign-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: ${{ github.event_name == 'pull_request' && 'dist' || vars.PAGES_DEMO_ENABLED == 'true' && 'dist' || 'ops/offline' }}
    outputs:
      home_sha256: ${{ steps.digests.outputs.home }}
      lab_sha256: ${{ steps.digests.outputs.lab }}
      site: ${{ steps.digests.outputs.site }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build -- dist
      - run: npm test
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - run: python level-kit/tests/campaign_browser.py
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/upgrades_browser.py
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/battlefield_browser.py --audit
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/static_campaign.py dist
        env:
          GAME_TEST_BROWSER: chromium
      - name: Record game entry checksums
        id: digests
        run: |
          echo "site=$PAGES_ARTIFACT" >> "$GITHUB_OUTPUT"
          sha256sum dist/index.html dist/underground-lab/index.html |
            awk 'NR == 1 {print "home=" $1} NR == 2 {print "lab=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PAGES_ARTIFACT }}

  gameplay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suites:
          - 'reports_browser'
          - 'practice_browser weapon_system_browser'
          - 'story_browser stair_routes_browser stage_audio_browser'
          - 'combat_expansion field_operations_browser'
          - 'controls_browser grenade_browser lab_live_browser'
          - 'visibility_browser'
    env:
      GAME_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci && npm run build
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - name: Run gameplay checks
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          for suite in $SUITES; do
            echo "::group::$suite"
            python -u "level-kit/tests/$suite.py"
            echo '::endgroup::'
          done
      - name: Verify 160 visible enemies in Chromium
        if: matrix.suites == 'visibility_browser'
        run: python -u level-kit/tests/herd_performance.py --samples open dense --sizes 160 --frames 36

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-build, gameplay]
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v5

  verify-public-game:
    if: needs.test-build.outputs.site == 'dist'
    needs: [test-build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - name: Play the published campaign
        env:
          GAME_TEST_BROWSER: chromium
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          HOME_SHA256: ${{ needs.test-build.outputs.home_sha256 }}
          LAB_SHA256: ${{ needs.test-build.outputs.lab_sha256 }}
        run: python -u level-kit/tests/pages_browser.py "$PAGES_URL" --home-sha256 "$HOME_SHA256" --level-sha256 "$LAB_SHA256"
