name: Campaign
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build -- dist
      - run: npm test
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - run: python level-kit/tests/campaign_browser.py
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/upgrades_browser.py
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/battlefield_browser.py --audit
        env:
          GAME_TEST_BROWSER: chromium
      - run: python level-kit/tests/static_campaign.py dist
        env:
          GAME_TEST_BROWSER: chromium
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.event_name == 'pull_request' && 'dist' || vars.PAGES_DEMO_ENABLED == 'true' && 'dist' || 'ops/offline' }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v5
